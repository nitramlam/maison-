<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maison">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#DDE5FF">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<script>
  // Mode nuit : auto (suit l'iPhone), clair ou sombre
  (function () {
    var pref = 'auto'; try { pref = localStorage.getItem('maison.theme') || 'auto'; } catch (e) {}
    var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
<link rel="icon" href="icon-192.png?v=2">
<title>Maison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Averia+Sans+Libre:wght@700&family=Urbanist:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#DDE5FF; --card:#FFFFFF; --ink:#171E34; --muted:#646D8E; --line:#D3DBF5;
    --accent:#5B7CF5; --on-accent:#FFFFFF; --lime:#BFFF49; --on-lime:#171E34;
    --shadow:0 1px 2px rgba(23,30,52,.05), 0 4px 14px rgba(23,30,52,.06);
  }
  html[data-theme="dark"]{ --bg:#171E34; --card:#262E4B; --ink:#DDE5FF; --muted:#9AA3C6; --line:#353F62; --accent:#7496FF; --on-accent:#171E34; --shadow:none; }
  html[data-theme="dark"]{color-scheme:dark}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{background:var(--bg);color:var(--ink)}
  body{font-family:Urbanist,system-ui,-apple-system,sans-serif;font-weight:800;font-size:16px;line-height:1.4;min-height:100vh;
       padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
  button{font:inherit;color:inherit;cursor:pointer}
  .wrap{max-width:560px;margin:0 auto;padding:22px 18px 120px}

  h1{font-family:'Averia Sans Libre',system-ui,sans-serif;font-weight:700;font-size:32px;letter-spacing:-.01em;line-height:1.1;word-break:break-word}
  h2{font-size:18px;font-weight:800;margin-bottom:12px}
  .sub{color:var(--muted);margin-top:6px;font-size:15px}
  .banner{margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-size:14px;color:var(--muted)}

  .card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
  .pad{padding:20px 18px}
  .muted{color:var(--muted)}
  .sec{margin-top:24px}
  .stack > * + *{margin-top:10px}

  .hometop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .dashtop{align-items:center}.dashtop .hello{margin:0}
  .dashhouse{display:inline-flex!important;width:auto!important;justify-content:flex-start!important;align-items:center;gap:6px;margin:2px 0 4px;max-width:100%;text-align:left}.dashhouse h1{overflow-wrap:break-word}.dashhouse h1.long{font-size:32px}.dashhouse h1.xlong{font-size:26px}
  .hometop .btns{display:flex;gap:4px;margin:-6px -8px 0 0}

  /* Accueil */
  .lrow{display:flex;align-items:center;gap:14px;padding:13px 16px;width:100%;background:none;border:0;text-align:left}
  .lrow + .lrow{border-top:1px solid var(--line)}
  .lrow:active{background:color-mix(in srgb, var(--ink) 4%, transparent)}
  .tile{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;font-size:23px;line-height:1;
        background:color-mix(in srgb, var(--accent) 10%, var(--card))}
  .grow{flex:1;min-width:0}
  .lname{font-weight:800;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lmeta{color:var(--muted);font-size:14px;margin-top:1px}
  .chev{color:var(--muted);flex:none}

  .fab{position:fixed;right:max(20px, env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));
       background:var(--lime);color:var(--on-lime);border:0;border-radius:999px;padding:14px 20px 14px 16px;font-weight:800;font-size:16px;
       box-shadow:0 8px 24px rgba(23,30,52,.22);display:flex;gap:8px;align-items:center;z-index:5}
  .fab svg{width:20px;height:20px}

  .empty{text-align:center;padding:34px 22px}
  .empty p{color:var(--muted);margin:8px 0 18px}
  .btn{border:0;border-radius:13px;padding:12px 18px;font-weight:800;font-size:15px}
  .primary{background:var(--accent);color:var(--on-accent)}
  .ghost{background:color-mix(in srgb, var(--ink) 7%, transparent)}
  .danger{background:color-mix(in srgb, #C0392B 12%, transparent);color:#C0392B}
  .danger.sure{background:#C0392B;color:#fff}
  .full{width:100%}

  /* Vue d'une liste */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin:-8px -8px 14px}
  .back,.iconbtn{background:none;border:0;color:var(--accent);font-weight:800;font-size:17px;display:flex;align-items:center;gap:2px;padding:8px}
  .back svg,.iconbtn svg{width:22px;height:22px}
  .ltitle{display:flex;align-items:center;gap:12px}

  .grp{margin-top:22px}
  .grp-h{display:flex;align-items:center;gap:8px;margin:0 4px 9px;font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
  .grp-h .e{font-size:16px;letter-spacing:0}
  .grp-h .n{color:var(--muted);font-weight:800;letter-spacing:0}
  .grp-h::after{content:"";flex:1;height:1px;background:var(--line);margin-left:4px}
  .grp-h.soft{color:var(--muted)}
  .grp-h .act{margin-left:auto;order:2}
  .link{background:none;border:0;color:var(--accent);font-size:14px;font-weight:800;padding:2px 4px;text-transform:none;letter-spacing:0}

  .irow{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:54px}
  .irow + .irow{border-top:1px solid var(--line)}
  .check{width:27px;height:27px;border-radius:50%;border:2px solid color-mix(in srgb, var(--muted) 55%, transparent);flex:none;
         display:grid;place-items:center;background:none;transition:all .15s}
  .check svg{width:15px;height:15px;color:#fff}
  .check.on{background:var(--accent);border-color:var(--accent)}
  .itext{flex:1;min-width:0;cursor:pointer}
  .ititle{font-size:17px;word-break:break-word}
  .done .ititle{color:var(--muted);text-decoration:line-through}
  .by{font-size:12.5px;color:var(--muted);margin-top:1px}

  /* Barre d'ajout */
  .composer{position:sticky;top:0;z-index:6;margin:14px -18px 0;padding:10px 18px 10px;
            background:color-mix(in srgb, var(--bg) 86%, transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  .composer.stuck{box-shadow:0 8px 18px -14px rgba(31,27,22,.35)}
  .composer form{display:flex;gap:8px;align-items:center;background:var(--card);border-radius:16px;
                 padding:5px 5px 5px 16px;box-shadow:0 1px 2px rgba(31,27,22,.05), 0 6px 18px rgba(31,27,22,.06);border:1px solid var(--line);
                 transition:border-color .2s, box-shadow .2s}
  .composer form:focus-within{border-color:var(--lc);box-shadow:0 0 0 4px color-mix(in srgb, var(--lc) 16%, transparent)}
  .composer input{flex:1;min-width:0;border:0;background:none;font:16px Urbanist,system-ui,sans-serif;color:var(--ink);outline:none;padding:9px 0}
  .composer input::placeholder{color:var(--muted)}
  .composer form button{background:var(--lc);color:#fff;border:0;border-radius:12px;width:42px;height:42px;display:grid;place-items:center;flex:none;transition:transform .12s}
  .composer form button:active{transform:scale(.9)}
  .composer form button svg{width:20px;height:20px}

  .chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .composer .chips{margin-top:9px;padding-bottom:2px}
  .chip{flex:none;border:1px solid var(--line);background:var(--card);padding:7px 12px;border-radius:999px;font-weight:800;font-size:13.5px;white-space:nowrap}
  .chip.add{border-style:dashed;color:var(--muted);background:transparent}

  /* Feuille du bas */
  .overlay{position:fixed;inset:0;background:rgba(20,16,12,.42);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  .sheet{background:var(--card);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;border-radius:24px 24px 0 0;
         padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,.8,.3,1)}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .sheet{position:relative}
  .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:-10px auto 12px}
  .sheet-x{position:sticky;top:0;float:right;z-index:12;width:40px;height:40px;margin:-8px -8px 0 8px;border:0;border-radius:50%;
           display:grid;place-items:center;background:color-mix(in srgb, var(--ink) 10%, var(--card));color:var(--ink);
           box-shadow:0 2px 10px rgba(0,0,0,.14),0 0 0 3px var(--card)}
  .sheet-x svg{width:18px;height:18px}
  .sheet-x:active{transform:scale(.9)}
  .sheet h3{font-family:'Averia Sans Libre',system-ui,sans-serif;font-weight:700;font-size:23px;letter-spacing:0;margin-bottom:16px}
  .field{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:13px;padding:13px 14px;font:16px Urbanist,system-ui,sans-serif;outline:none}
  .field:focus{border-color:var(--accent)}
  .field.err{border-color:#C0392B}
  .label{font-size:13px;color:var(--muted);font-weight:800;margin:18px 2px 8px}
  .actions{display:flex;gap:10px;margin-top:20px}
  .actions .btn{flex:1}
  .sep{height:1px;background:var(--line);margin:22px 0 6px}
  .linkbox{font-size:14px;word-break:break-all;padding:12px 14px;border-radius:13px;background:var(--bg);border:1px solid var(--line);user-select:all;-webkit-user-select:all}

  /* Émojis */
  .emo-row{display:flex;gap:10px;align-items:center}
  .emo-big{width:52px;height:52px;flex:none;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:28px;line-height:1;display:grid;place-items:center}
  .emo-wrap{margin-top:12px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
  .emo-grid{max-height:210px;overflow-y:auto;padding:4px 8px 8px}
  .emo-g{font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:10px 4px 4px}
  .emo-cells{display:grid;grid-template-columns:repeat(auto-fill, minmax(40px, 1fr))}
  .emo{height:42px;border:0;background:none;border-radius:10px;font-size:24px;line-height:1}
  .emo:active,.emo.on{background:color-mix(in srgb, var(--accent) 16%, transparent)}
  .emo-custom{border:0;border-top:1px solid var(--line);border-radius:0 0 14px 14px;background:transparent}

  .srow{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
  .srow-btn{flex:1;display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;padding:11px 2px;font-size:16px;min-width:0}
  .srow-btn .e{font-size:20px;width:26px;text-align:center}
  .srow-btn .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .del{background:none;border:0;color:var(--muted);padding:8px;flex:none}
  .del svg{width:18px;height:18px}
  .hint{font-size:13.5px;color:var(--muted);margin-top:4px}

  /* Liste déroulante */
  .dd-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--bg);
          border-radius:13px;padding:13px 14px;font-size:16px;text-align:left}
  .dd-btn .v{display:flex;align-items:center;gap:10px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dd-btn svg{width:18px;height:18px;color:var(--muted);flex:none;transition:transform .15s}
  .dd.open .dd-btn{border-color:var(--accent)}
  .dd.open .dd-btn svg{transform:rotate(180deg)}
  .dd-panel{margin-top:8px;border:1px solid var(--line);border-radius:14px;background:var(--bg);overflow:hidden}
  .dd-search{border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent}
  .dd-search:focus{border-color:var(--line)}
  .dd-list{max-height:240px;overflow-y:auto}
  .dd-opt{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:12px 14px;text-align:left;font-size:16px}
  .dd-opt + .dd-opt{border-top:1px solid var(--line)}
  .dd-opt:active{background:color-mix(in srgb, var(--accent) 10%, transparent)}
  .dd-opt .e{width:24px;text-align:center;font-size:19px;flex:none}
  .dd-opt .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dd-opt .ck{margin-left:auto;color:var(--accent);flex:none;display:flex}
  .dd-opt .ck svg{width:18px;height:18px}
  .dd-opt.create{color:var(--accent);font-weight:800}
  .dd-empty{padding:12px 14px;color:var(--muted);font-size:14px}

  .logo{font-size:52px;margin-bottom:10px}

  /* Couleur propre à chaque liste (--h = teinte) */
  :root{--lc:var(--accent)}
  .view{--lc:hsl(var(--h,152) 45% 38%)}
  html[data-theme="dark"] .view{--lc:hsl(var(--h,152) 45% 60%)}
  .hello{color:var(--muted);font-size:15px;font-weight:800;margin-bottom:4px}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
  .lcard{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;border:0;border-radius:22px;
         padding:16px 16px 15px;min-height:132px;background:hsl(var(--h) 60% 94%);color:var(--ink);overflow:hidden;
         transition:transform .15s cubic-bezier(.3,.7,.4,1), box-shadow .2s}
  .lcard::after{content:"";position:absolute;right:-26px;top:-26px;width:90px;height:90px;border-radius:50%;background:hsl(var(--h) 60% 88%);opacity:.7}
  .lcard:active{transform:scale(.96)}
  .lcard .lemo{position:relative;z-index:1;width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:28px;line-height:1;
               background:var(--card);box-shadow:0 2px 8px hsl(var(--h) 40% 40% / .14)}
  .lcard .lname{position:relative;z-index:1;font-weight:800;font-size:17px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal}
  .lcard .lmeta{position:relative;z-index:1;margin-top:auto;font-size:13.5px;color:hsl(var(--h) 30% 35%)}
  .lcard.add{background:transparent;border:1.5px dashed var(--line);align-items:center;justify-content:center;color:var(--muted);font-weight:800}
  .lcard.add::after{display:none}
  .lcard.add .plus{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb, var(--accent) 12%, transparent);color:var(--accent);font-size:26px;line-height:1}
  html[data-theme="dark"] .lcard{background:hsl(var(--h) 22% 17%)}html[data-theme="dark"] .lcard::after{background:hsl(var(--h) 25% 22%)}html[data-theme="dark"] .lcard .lemo{background:hsl(var(--h) 20% 23%);box-shadow:none}html[data-theme="dark"] .lcard .lmeta{color:hsl(var(--h) 20% 70%)}

  .view .ltitle .tile{width:54px;height:54px;border-radius:17px;font-size:30px;background:hsl(var(--h) 60% 92%)}
  html[data-theme="dark"] .view .ltitle .tile{background:hsl(var(--h) 22% 20%)}
  .view .back{color:var(--lc)}
  .view .iconbtn{color:var(--lc)}
  .view .check.on{background:var(--lc);border-color:var(--lc)}
  .view .grp-h:not(.soft){color:var(--lc)}
  .view .grp-h:not(.soft)::after{background:color-mix(in srgb, var(--lc) 28%, var(--line))}
  .view .link{color:var(--lc)}

  /* Éléments : émoji + quantité */
  .iline{display:flex;align-items:center;gap:10px;min-width:0}
  .iemo{font-size:21px;line-height:1;flex:none;width:26px;text-align:center}
  .ititle{flex:1;min-width:0}
  .qty{flex:none;margin-left:auto;font-size:13.5px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap;max-width:45%;overflow:hidden;text-overflow:ellipsis;
       color:var(--lc);background:color-mix(in srgb, var(--lc) 12%, transparent)}
  .done .qty{color:var(--muted);background:color-mix(in srgb, var(--muted) 12%, transparent)}
  .done .iemo{opacity:.5}
  .emo-big.none{color:var(--muted);font-size:22px}
  .emo-none{display:block;width:calc(100% - 16px);margin:8px 8px 0;border:1px dashed var(--line);background:none;border-radius:10px;padding:8px;font-size:14px;color:var(--muted)}

  /* Commentaire */
  .note{font-size:14px;line-height:1.35;color:var(--muted);margin-top:3px;white-space:pre-line;
        display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .note.indent{padding-left:36px}
  .done .note{opacity:.7}
  textarea.field{resize:vertical;min-height:84px;line-height:1.4}

  /* Membres */
  .members-btn{padding:6px 8px}
  .avatars{display:flex;align-items:center}
  .avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;font-size:13px;color:#fff;
          background:hsl(var(--h,152) 45% 45%);border:2px solid var(--bg)}
  .avatars .avatar + .avatar{margin-left:-9px}
  .avatar.more{background:var(--muted)}
  .avatar.lg{width:42px;height:42px;font-size:17px;border:0}
  .avatar.off{background:color-mix(in srgb, var(--muted) 45%, transparent)}
  .mrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .mname{font-weight:800;font-size:16px}
  .mdev{font-size:13.5px;margin-top:3px}
  .kick{flex:none;border:1px solid var(--line);background:none;color:var(--muted);border-radius:10px;padding:7px 11px;font-size:13.5px;font-weight:800}
  .kick.sure{background:#C0392B;border-color:#C0392B;color:#fff}

  /* Animations */
  @keyframes viewIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
  @keyframes viewBack{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
  @keyframes rise{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
  @keyframes enter{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}
  .anim-in{animation:viewIn .3s cubic-bezier(.2,.8,.3,1)}
  .anim-back{animation:viewBack .3s cubic-bezier(.2,.8,.3,1)}
  .anim-in .lcard,.anim-back .lcard,.anim-first .lcard{animation:rise .42s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i,0) * 45ms)}
  .irow.enter{animation:enter .35s cubic-bezier(.2,.8,.3,1)}
  .irow{transition:opacity .25s, background-color .25s}
  .irow.checking{opacity:.55}
  .irow.checking .check{animation:pop .32s ease}
  .irow.checking .ititle{text-decoration:line-through;color:var(--muted)}
  .check{transition:background-color .2s, border-color .2s, transform .12s}
  .check:active{transform:scale(.88)}
  .itext:active{opacity:.6}
  @media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
  .housebtn{background:none;border:0;display:flex;align-items:center;gap:6px;text-align:left;padding:0;max-width:100%}
  .housebtn h1{min-width:0}
  .housebtn .caret{display:flex;flex:none;color:var(--muted)}
  .housebtn .caret svg{width:24px;height:24px}
  .star{font-size:24px;line-height:1;color:var(--muted);padding:8px 10px}
  .star.on{color:#D9A21B}
  /* Glisser-déposer */
  .drag,.sec-drag{flex:none;display:grid;place-items:center;width:30px;height:36px;margin-right:-6px;color:color-mix(in srgb, var(--muted) 70%, transparent);
                  touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
  .drag svg,.sec-drag svg{width:18px;height:18px}
  .sec-drag{margin-left:auto;order:3;height:28px}
  .drag-ghost{opacity:.35;background:color-mix(in srgb, var(--lc) 10%, var(--card))}
  .drag-chosen{background:var(--card)}
  .drag-fly{box-shadow:0 12px 30px rgba(31,27,22,.22);border-radius:14px;opacity:.97!important}
  body.dragging{-webkit-user-select:none;user-select:none}
  .grp-title{display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px 0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;text-align:left}

  /* Barre d'ajout : puces */

  /* Vue d'une catégorie */

  /* Bouton d'ajout (ouvre la fenêtre Nouvel élément) */

          padding:7px 16px 7px 7px;font-size:16px;color:var(--muted);text-align:left;

  /* Identifications et notifications */
  .online{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2EAD5B;margin-right:6px;vertical-align:1px}
  .walltags{display:flex;flex-wrap:wrap;gap:6px;margin:4px 4px 8px}
  .tagchip{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;font-weight:800;padding:4px 4px 4px 10px;border-radius:999px;
           background:color-mix(in srgb, var(--accent) 12%, transparent);color:var(--accent)}

  .chip.set{background:color-mix(in srgb, var(--accent) 14%, var(--card));border-color:color-mix(in srgb, var(--accent) 40%, var(--line));color:var(--accent)}

  /* Personnes : couleurs et surlignage */

  /* Résumé du jour (accueil) */
  .todaycard{padding:14px 16px;cursor:pointer;transition:transform .12s}
  .todaycard:active{transform:scale(.985)}
  .tdhead{display:flex;align-items:center;gap:12px}
  .tdcal{width:46px;height:50px;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;flex:none;
         background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}

  /* Accueil : jour + météo côte à côte */
  .homerow{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  .wxcard{padding:12px 13px;cursor:pointer;display:flex;flex-direction:column;gap:2px;transition:transform .12s;

  /* Météo animée */
  .wxa{position:relative;display:inline-block;width:1.45em;height:1.25em;font-size:30px;flex:none;overflow:visible}

  .wa-sun{left:.12em;top:.05em;font-size:1em;animation:waspin 14s linear infinite,wapulse 3s ease-in-out infinite}
  .wa-moon{left:.18em;top:.08em;animation:warock 5s ease-in-out infinite}
  .wa-sun.small,.wa-moon.small{font-size:.78em;left:.45em;top:-.05em}
  .wa-cloud{left:.1em;top:.18em;font-size:.95em;animation:wadrift 6s ease-in-out infinite alternate}
  .wa-cloud.front{left:.05em;top:.32em;font-size:.9em}
  .wa-cloud.back{left:.45em;top:.02em;font-size:.72em;opacity:.75;animation-duration:8s;animation-direction:alternate-reverse}
  .wa-cloud.top{left:.15em;top:-.08em;font-size:.95em;z-index:2}
  .wa-drop{width:.07em;height:.24em;border-radius:.05em;background:linear-gradient(#7fb6ff,#3d7fe0);top:.62em;left:calc(.35em + var(--i) * .2em);
    opacity:0;animation:wafall 1s linear infinite;animation-delay:calc(var(--i) * .27s)}
  .wa-flake{font-size:.3em;color:#9fd0ff;top:2.1em;left:calc(1.2em + var(--i) * 1em);opacity:0;animation:wasnow 2.4s linear infinite;animation-delay:calc(var(--i) * .8s)}
  .wa-bolt{font-size:.5em;left:1.1em;top:1.15em;z-index:3;animation:waflash 2.6s steps(1) infinite}
  .wa-fog{height:.07em;border-radius:.05em;background:color-mix(in srgb, var(--muted) 70%, transparent);width:.9em;left:.2em;top:calc(.78em + var(--i) * .16em);
    animation:wafog 3.5s ease-in-out infinite alternate;animation-delay:calc(var(--i) * -1.2s)}
  @keyframes waspin{to{transform:rotate(360deg)}}
  @keyframes wapulse{50%{filter:drop-shadow(0 0 .12em rgba(255,200,0,.75))}}
  @keyframes warock{50%{transform:rotate(-12deg)}}
  @keyframes wadrift{from{transform:translateX(-.08em)}to{transform:translateX(.12em)}}
  @keyframes wafall{0%{opacity:0;transform:translateY(0)}15%{opacity:1}100%{opacity:0;transform:translateY(.55em)}}
  @keyframes wasnow{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}50%{transform:translate(.6em,1.2em)}100%{opacity:0;transform:translate(-.3em,2.4em)}}
  @keyframes waflash{0%,100%{opacity:0}8%{opacity:1}12%{opacity:0}16%{opacity:1}22%{opacity:0}}
  @keyframes wafog{from{transform:translateX(-.1em)}to{transform:translateX(.15em)}}

  .addtile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:118px;border:2px dashed var(--line);border-radius:18px;background:none;color:var(--muted);font:800 13.5px Urbanist,system-ui,sans-serif}

  .toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);
         padding:11px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:calc(100% - 40px);text-align:center}
  b,strong,h4,h5,h6{font-weight:800}
  h2{font-family:'Averia Sans Libre',system-ui,sans-serif;font-weight:700}
  button,input,select,textarea{font-family:Urbanist,system-ui,sans-serif}
</style>
</head>
<body>
  <main class="wrap" id="app">
    <div id="screen"></div>
    <div class="composer" id="composer" hidden>
      <button type="button" class="addbtn" id="addBtn">
        <span class="addplus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
        Ajouter un élément
      </button>
    </div>
    <div id="body"></div>
  </main>

  <button class="fab" id="fab" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    Nouvelle liste
  </button>

  <nav class="tabbar" id="tabbar" hidden></nav>
  <div class="selbar" id="selbar" hidden></div>
  <div class="overlay" id="overlay" hidden><div class="sheet" id="sheet"></div></div>
  <div class="lightbox" id="lightbox" hidden></div>
  <div class="toast" id="toast" hidden></div>

const autoEmoCache = new Map();
function autoEmoji(title) {
  const t = norm(title).replace(/œ/g, 'oe').replace(/[’]/g, "'");
  if (!t) return '';
  if (autoEmoCache.has(t)) return autoEmoCache.get(t);
  let found = '';
  const padded = ' ' + t.replace(/[^a-z0-9' -]/g, ' ') + ' ';
  const sing = ' ' + t.replace(/[^a-z0-9' -]/g, ' ').split(/\s+/).map(w => w.length > 3 ? w.replace(/(s|x)$/, '') : w).join(' ') + ' ';
  for (const [w, e] of AUTO_EMO.multi) {
    const re = new RegExp(`[\\s']${w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}s?[\\s']`);
    if (re.test(padded) || re.test(sing)) { found = e; break; }
  }
  if (!found) {
    for (const raw of t.split(/[^a-z0-9]+/)) {
      if (raw.length < 2) continue;
      const cands = [raw, raw.replace(/(s|x)$/, ''), raw.replace(/aux$/, 'al'), raw.replace(/eaux$/, 'eau')];
      const hit = cands.find(c => AUTO_EMO.single.has(c));
      if (hit) { found = AUTO_EMO.single.get(hit); break; }
    }
  }
  autoEmoCache.set(t, found);
  return found;
}

let lastTouchUser = 0, lastTouch = 0;
function touchUser(force) {
  if (!db || !meId || state.blocked) return;
  const now = Date.now();
  if (!force && now - lastTouchUser < 10 * 60 * 1000) return;
  lastTouchUser = now;
  const em = auth?.currentUser?.email || '';
  fire(updateDoc(userRef(), { [`devices.${deviceId}`]: { label: deviceLabel(), lastSeen: now }, lastSeen: now, ...(em && em !== state.profile?.email ? { email: em } : {}) }));
}
function touchMember(force) {
  if (!db || !state.code || !meId || !state.myName) return;
  const now = Date.now();
  if (!force && now - lastTouch < 10 * 60 * 1000) return;
  lastTouch = now;
  const extra = typeof state.profile?.color === 'number' ? { hue: state.profile.color } : {};
  if (typeof state.profile?.avatar === 'string') extra.avatar = clipIcon(state.profile.avatar);
  // Humeur partagée : recopiée dans la maison ouverte (utile si on a plusieurs maisons ou si un envoi a raté)
  if (state.profile && 'moodData' in state.profile) { const m = cleanMood(state.profile.moodData); extra.mood = m.shared ? { e: m.e, c: m.c, shared: true } : deleteField(); }
  if (state.profile && state.profile.push) extra.push = state.profile.push;
  // plus aucune trace d'activité (« vu il y a… ») : on efface l'ancienne si elle existe
  fire(setDoc(ref('members', meId), { name: state.myName, removed: false, ...extra, devices: deleteField() }, { merge: true }));
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { touchUser(false); touchMember(false); }
});

const housesData = () => houses.map(h => ({ code: h.code, name: h.name || '' }));
function saveHouses() {
  if (!db || !meId) return;
  fire(updateDoc(userRef(), { houses: housesData(), fav: fav || null }));
}
function rememberHouse(code, name) {
  const h = houses.find(x => x.code === code);
  let changed = false;
  if (h) { if (name && h.name !== name) { h.name = name; changed = true; } }
  else { houses.push({ code, name: name || '' }); changed = true; }
  if (!fav || !houses.some(x => x.code === fav)) { fav = code; changed = true; }
  if (changed) saveHouses();
}

function watchProfile(u) {
  if (unsubProfile) unsubProfile();
  state.profileLoading = true;
  unsubProfile = onSnapshot(userRef(u.uid), async snap => {
    if (!snap.exists()) {
      if (snap.metadata.fromCache || creatingProfile) return;
      // Compte sans profil (inscription interrompue) : on le crée.
      creatingProfile = true;
      try { await setDoc(userRef(u.uid), newProfile(u, u.displayName)); } catch (e) { console.error(e); }
      creatingProfile = false;
      return;
    }
    const p = snap.data();
    state.profile = p; state.profileLoading = false;
    state.myName = str(p.pseudo, (u.email || '').split('@')[0]);
    state.blocked = p.blocked === true;
    if (p.theme && p.theme !== store.get('maison.theme')) { store.set('maison.theme', p.theme); applyTheme(p.theme); }
    houses = Array.isArray(p.houses) ? p.houses.filter(h => h && typeof h.code === 'string').map(h => ({ code: h.code, name: String(h.name || '') })) : [];
    fav = p.fav && houses.some(h => h.code === p.fav) ? p.fav : (houses[0]?.code || null);

    if (state.blocked) { closeHouse(); render(); return; }
    touchUser(false);
    if (!migrated) { migrated = true; migrateLegacy(); }

    if (state.code && !houses.some(h => h.code === state.code)) closeHouse();
    if (!state.code && houses.length) enterHouse(fav || houses[0].code);
    else if (renderedKey === 'notes' || renderedKey === 'cal') renderTabbar(true);
    else render();
  }, e => { console.error(e); state.profileLoading = false; state.error = 'Impossible de charger ton compte.'; render(); });
}

const newProfile = (u, pseudo) => ({
  pseudo: String(pseudo || (u.email || '').split('@')[0]).slice(0, 30), email: u.email || '',
  createdAt: Date.now(), lastSeen: Date.now(), blocked: false, houses: [], fav: null,
  devices: { [deviceId]: { label: deviceLabel(), lastSeen: Date.now() } }
});

function onSignedIn(u) {
  meId = u.uid;
  state.user = u;
  watchProfile(u);
}

function onSignedOut() {
  closeHouse();
  if (unsubProfile) { unsubProfile(); unsubProfile = null; }
  if (unsubUsers) { unsubUsers(); unsubUsers = null; }
  meId = null; houses = []; fav = null; migrated = false;
  Object.assign(state, { user: null, profile: null, blocked: false, isAdmin: false, myName: '', users: [], view: 'home', authMode: 'login', tab: 'home' });
  closeSheet();
  render();
}

// Récupère automatiquement les maisons créées avec l'ancienne version (sans comptes) sur cet appareil.
async function migrateLegacy() {
  if (store.get('maison.migrated')) return;
  const codes = new Set();
  try { JSON.parse(store.get('maison.houses') || '[]').forEach(h => h && typeof h.code === 'string' && codes.add(h.code)); } catch (_) {}
  const lc = store.get('maison.code'); if (lc) codes.add(lc);
  const oldMe = store.get('maison.me');
  if (oldMe) {
    try { const s = await getDoc(doc(db, 'people', oldMe)); if (s.exists()) (s.data().houses || []).forEach(h => h && h.code && codes.add(h.code)); } catch (_) {}
  }
  let got = 0;
  for (const id of codes) {
    if (houses.some(h => h.code === id)) continue;
    try {
      const jc = newJoinCode();
      const b = writeBatch(db);
      b.update(doc(db, 'households', id), { members: [meId], banned: [], code: jc, createdBy: meId });
      b.set(doc(db, 'joinCodes', jc), { houseId: id });
      await b.commit();
      const s = await getDoc(doc(db, 'households', id));
      rememberHouse(id, s.data()?.name || '');
      got++;
    } catch (e) { console.warn('ancienne maison non récupérée', id, e && e.code); }
  }
  store.set('maison.migrated', '1');
  if (got) toast(got > 1 ? `${got} anciennes maisons récupérées.` : 'Ton ancienne maison a été récupérée.');
}

// ================== Maisons ==================
function closeHouse() {
  unsubs.forEach(u => u()); unsubs = [];
  state.code = null; state.house = null; state.members = [];
  state.lists = []; state.sections = []; state.items = [];
  if (state.view !== 'admin') state.view = 'home';
}

function subscribe() {
  unsubs.forEach(u => u()); unsubs = [];
  state.expenses = []; state.expDenied = false;
  unsubs.push(onSnapshot(query(col('expenses'), orderBy('createdAt')), snap => {
    state.expenses = snap.docs.map(d => { const v = d.data(); return { id: d.id, name: str(v.name, 'Dépense'), emoji: typeof v.emoji === 'string' ? clipIcon(v.emoji) : '',
      amount: Math.max(0, Math.round(Number(v.amount) || 0)), freq: ['week', 'year'].includes(v.freq) ? v.freq : 'month', day: Math.min(31, Math.max(1, Number(v.day) || 1)),
      people: Array.isArray(v.people) ? v.people.filter(x => typeof x === 'string') : [], by: v.by || null, createdAt: Number(v.createdAt) || 0 }; });
    if (state.tab === 'budget' || state.tab === 'home') render();
  }, e => { if (e && e.code === 'permission-denied') { state.expDenied = true; if (state.tab === 'budget') render(); return; } console.warn('dépenses', e); }));
  state.loading = true; state.error = null;
  const have = {};
  const kinds = ['lists', 'sections', 'items'];
  const code = state.code;
  const got = k => { have[k] = true; if (kinds.every(x => have[x])) state.loading = false; render(); if (!state.loading) maybeOpenPending(); };
  const lost = async () => {
    // On n'a plus accès à cette maison : retiré par un membre… ou compte bloqué.
    if (state.code !== code) return;
    try {
      const p = await getDoc(userRef());
      if (p.data()?.blocked) { state.blocked = true; closeHouse(); render(); return; }
    } catch (_) {}
    if (state.code !== code) return;
    const name = houses.find(h => h.code === code)?.name || 'la maison';
    houses = houses.filter(h => h.code !== code);
    if (fav === code) fav = houses[0]?.code || null;
    saveHouses();
    closeHouse();
    toast(`Tu ne fais plus partie de « ${name} ».`);
    if (houses.length) enterHouse(fav || houses[0].code); else render();
  };
  const err = e => {
    console.error(e);
    if (e && e.code === 'permission-denied') return lost();
    state.loading = false; state.error = 'Impossible de charger les listes pour le moment.'; render();
  };

  unsubs.push(onSnapshot(houseRef(), snap => {
    if (!snap.exists()) { if (!snap.metadata.fromCache) lost(); return; }
    state.house = snap.data();
    if (Array.isArray(state.house.members) && !state.house.members.includes(meId) && !snap.metadata.hasPendingWrites) return lost();
    if (typeof state.house.name === 'string') rememberHouse(code, state.house.name);
    if (!Array.isArray(state.house.admins) && houseAdmins()[0] === meId && !snap.metadata.fromCache) fire(updateDoc(houseRef(), { admins: [meId] }));
    render();
    if (sheetKind === 'members') openMembersSheet();
    if (sheetKind === 'manage' && !amAdmin()) closeSheet();
    if (sheetKind === 'invite') openInviteSheet();
  }, err));

  unsubs.push(onSnapshot(col('members'), snap => {
    state.members = snap.docs.map(d => {
      const v = d.data();
      const devs = v.devices && typeof v.devices === 'object' ? Object.entries(v.devices) : [];
      return {
        id: d.id, name: str(v.name, "Quelqu'un"), removed: v.removed === true, hue: typeof v.hue === 'number' ? v.hue : null,
        avatar: typeof v.avatar === 'string' ? clipIcon(v.avatar) : '',
        cycles: cleanTrackers(v.cycles),
        pushDevs: v.push && Array.isArray(v.push.subs) ? v.push.subs.filter(x => x && x.endpoint).map(x => String(x.dev || 'Appareil')) : [],
        mood: v.mood && v.mood.shared ? cleanMood(v.mood) : null,
        budget: v.budget && typeof v.budget === 'object' && Number(v.budget.salary) > 0 ? { salary: Math.round(Number(v.budget.salary)), payday: Math.min(31, Math.max(1, Number(v.budget.payday) || 1)) } : null,
        devices: devs.map(([k, x]) => ({ id: k, label: str(x && x.label, 'Appareil'), lastSeen: Number(x && x.lastSeen) || 0 }))
                     .sort((a, b) => b.lastSeen - a.lastSeen)
      };
    });
    render();
    if (sheetKind === 'members') openMembersSheet();
  }, e => { if (e && e.code === 'permission-denied') return; console.error('membres', e); }));

  unsubs.push(onSnapshot(query(col('lists'), orderBy('createdAt')), snap => {
    state.lists = snap.docs.map(d => { const v = d.data(); return { id: d.id, name: str(v.name, 'Sans nom'), emoji: typeof v.emoji === 'string' ? clipIcon(v.emoji) : '', order: typeof v.order === 'number' ? v.order : (v.createdAt || 0),
      shopping: v.shopping === true || (v.shopping === undefined && /^courses?$/.test(norm(str(v.name, ''))) ) }; }).sort(byOrder);
    got('lists');
  }, err));
  unsubs.push(onSnapshot(query(col('sections'), orderBy('createdAt')), snap => {
    state.sections = snap.docs.map(d => { const v = d.data(); return { id: d.id, listId: v.listId, name: str(v.name, 'Sans nom'), emoji: typeof v.emoji === 'string' ? clipIcon(v.emoji) : '', order: typeof v.order === 'number' ? v.order : (v.createdAt || 0) }; });
    if (sheetKind === 'sec') openSecView(sheetTarget);
    got('sections');
  }, err));
  // Calendrier et notes : si les règles Firebase ne sont pas à jour, on prévient sans casser le reste.
  let warned = false;
  const soft = what => e => {
    console.error(what, e);
    if (e && e.code === 'permission-denied' && !warned) { warned = true; toast(`${what} : mets à jour les règles Firebase.`); }
  };
  // Seulement les 2 derniers mois et le futur (les plus vieux sont supprimés)
  setTimeout(purgeOldEvents, 4000);
  let evRecent = [], evYearly = [];
  const mergeEv = () => { const seen = new Set(); state.events = [...evYearly, ...evRecent].filter(e => e.date && !seen.has(e.id) && seen.add(e.id)); };
  unsubs.push(onSnapshot(query(col('events'), where('date', '>=', evCutoff())), snap => {
    evRecent = snap.docs.map(evFromDoc); mergeEv();
    if (state.tab === 'cal' || state.tab === 'home') render();
  }, soft('Calendrier')));
  unsubs.push(onSnapshot(query(col('events'), where('repeat', 'in', REPEATS)), snap => {
    evYearly = snap.docs.map(evFromDoc); mergeEv();
    if (state.tab === 'cal' || state.tab === 'home') render();
  }, e => console.warn('anniversaires', e)));
  const seenPosts = new Set(); let postsPrimed = false;
  unsubs.push(onSnapshot(query(col('posts'), orderBy('createdAt', 'desc'), limit(80)), snap => {
    const fresh = new Set();
    for (const d of snap.docs) { if (postsPrimed && !seenPosts.has(d.id)) fresh.add(d.id); seenPosts.add(d.id); }
    postsPrimed = true; state.freshPosts = fresh;
    state.posts = snap.docs.map(d => {
      const v = d.data();
      return { id: d.id, text: typeof v.text === 'string' ? v.text : '', photo: typeof v.photo === 'string' && v.photo.startsWith('data:image/') ? v.photo : null,
               w: Number(v.w) || 0, h: Number(v.h) || 0, by: typeof v.by === 'string' ? v.by : null, byName: typeof v.byName === 'string' ? v.byName : '',
               createdAt: Number(v.createdAt) || 0, pinned: v.pinned === true,
               mentions: Array.isArray(v.mentions) ? v.mentions.filter(x => typeof x === 'string') : [],
               photoId: typeof v.photoId === 'string' ? v.photoId : null, editedAt: Number(v.editedAt) || 0, reactions: cleanReactions(v.reactions),
               audioId: typeof v.audioId === 'string' ? v.audioId : null, dur: Number(v.dur) || 0 };
    });
    if (state.tab === 'notes' || state.tab === 'home') render();
    else renderTabbar(true);
    if (sheetKind === 'post' && !state.posts.some(p => p.id === sheetTarget)) closeSheet();
  }, soft('Bento')));

  unsubs.push(onSnapshot(query(col('replies'), orderBy('createdAt', 'desc'), limit(300)), snap => {
    state.replies = snap.docs.map(d => { const v = d.data(); return { id: d.id, postId: v.postId, text: String(v.text || ''),
      by: typeof v.by === 'string' ? v.by : null, byName: typeof v.byName === 'string' ? v.byName : '', createdAt: Number(v.createdAt) || 0,
      photoId: typeof v.photoId === 'string' ? v.photoId : null, w: Number(v.w) || 0, h: Number(v.h) || 0, reactions: cleanReactions(v.reactions),
      audioId: typeof v.audioId === 'string' ? v.audioId : null, dur: Number(v.dur) || 0 }; }).sort((x, y) => x.createdAt - y.createdAt);
    if (state.tab === 'notes' || state.tab === 'home') render(); else renderTabbar(true);
    if (sheetKind === 'thread') openThread(sheetTarget);
  }, soft('Réponses')));

  unsubs.push(onSnapshot(query(col('items'), orderBy('createdAt')), snap => {
    const fresh = new Set();
    for (const d of snap.docs) { if (itemsPrimed && !seenItems.has(d.id)) fresh.add(d.id); seenItems.add(d.id); }
    itemsPrimed = true; state.fresh = fresh;
    state.items = snap.docs.map(d => {
      const v = d.data();
      return { id: d.id, listId: v.listId, sectionId: typeof v.sectionId === 'string' ? v.sectionId : null,
               title: String(v.title ?? ''), done: v.done === true, byName: typeof v.byName === 'string' ? v.byName : '',
               by: typeof v.by === 'string' ? v.by : null,
               emoji: typeof v.emoji === 'string' && v.emoji ? v.emoji : null,
               qty: typeof v.qty === 'string' ? v.qty.trim() : '',
               note: typeof v.note === 'string' ? v.note.trim() : '',
               order: typeof v.order === 'number' ? v.order : (v.createdAt || 0),
               assignees: Array.isArray(v.assignees) ? v.assignees.filter(x => typeof x === 'string') : [],
               assignedAt: Number(v.assignedAt) || 0, assignedBy: typeof v.assignedBy === 'string' ? v.assignedBy : '',
               photoId: typeof v.photoId === 'string' ? v.photoId : null, important: v.important === true,
               link: typeof v.link === 'string' ? v.link.trim() : '', thumb: typeof v.thumb === 'string' ? v.thumb : '' };
    }).sort(byOrder);
    got('items');
    if (state.tab !== 'lists') renderTabbar(true);
    if (sheetKind === 'sec') openSecView(sheetTarget);
  }, err));
}

function enterHouse(code) {
  state.code = code;
  if (state.view !== 'admin') state.view = 'home';
  state.house = null; state.members = []; state.lists = []; state.sections = []; state.items = [];
  state.events = []; state.posts = []; state.replies = []; state.newMentions = new Set(); pendingTags.clear();
  seenItems.clear(); itemsPrimed = false; state.anim = 'first';
  subscribe();
  touchMember(true);
  render();
}

function createHouse(name) {
  name = String(name || '').trim().slice(0, 40) || 'Ma maison';
  const id = newCode(), jc = newJoinCode();
  const b = writeBatch(db);
  b.set(doc(db, 'households', id), { name, createdAt: Date.now(), createdBy: meId, members: [meId], admins: [meId], banned: [], code: jc });
  b.set(doc(db, 'joinCodes', jc), { houseId: id });
  // une fois la maison créée : listes de départ + événement de bienvenue
  fire(b.commit().then(() => seedHouse(id, name)));
  houses.push({ code: id, name });
  fav = fav || id;
  saveHouses();
  enterHouse(id);
  setTimeout(openInviteSheet, 450);
}

function seedHouse(id, name) {
  const t = Date.now(), c = sub => collection(db, 'households', id, sub);
  const lists = [
    { name: 'Courses', emoji: '🛒', shopping: true },
    { name: 'Idées repas', emoji: '🍝' },
    { name: 'Achats', emoji: '🛍️' },
    { name: 'Travaux', emoji: '🔨' }
  ];
  const b = writeBatch(db);
  const refs = lists.map((l, i) => { const r = doc(c('lists')); b.set(r, { ...l, createdAt: t + i, order: t + i }); return r; });
  b.set(doc(c('events')), { title: `Bienvenue dans « ${String(name).slice(0, 50)} »`, emoji: '🎉', date: todayYmd(), allDay: true, time: '', end: '',
    note: `${state.myName || 'Quelqu\'un'} a créé la maison aujourd'hui.`, people: [meId], by: meId, byName: state.myName, createdAt: t });
  // la liste Courses en favori pour le créateur
  b.update(userRef(), { [`homePrefs.${id}.fav`]: [refs[0].id] });
  if (state.profile) { state.profile.homePrefs = state.profile.homePrefs || {}; state.profile.homePrefs[id] = { fav: [refs[0].id], collapsed: [] }; }
  return b.commit();
}

async function joinWithCode(raw) {
  const code = cleanCode(raw);
  if (code.length !== 6) { toast('Le code fait 6 caractères (lettres et chiffres).'); return false; }
  let s;
  try { s = await getDoc(doc(db, 'joinCodes', code)); }
  catch (e) { console.error(e); toast('Impossible de vérifier le code pour le moment.'); return false; }
  if (!s.exists()) { toast('Ce code ne correspond à aucune maison.'); return false; }
  const id = s.data().houseId;
  try { await updateDoc(doc(db, 'households', id), { members: arrayUnion(meId), joinWith: code }); }
  catch (e) {
    console.error(e);
    toast(e && e.code === 'permission-denied' ? "Tu ne peux pas rejoindre cette maison (code changé ou accès retiré)." : "Ça n'a pas marché, réessaie.");
    return false;
  }
  let name = '';
  try { name = (await getDoc(doc(db, 'households', id))).data()?.name || ''; } catch (_) {}
  if (!houses.some(h => h.code === id)) houses.push({ code: id, name });
  if (!fav) fav = id;
  saveHouses();
  closeSheet();
  enterHouse(id);
  toast(`Bienvenue dans « ${name || 'la maison'} » !`);
  return true;
}

// Quitter une maison : tu n'en fais plus partie (les listes restent pour les autres).
// ----- Administrateurs de la maison : le créateur au départ, il peut nommer d'autres personnes -----
function houseAdmins(h = state.house) {
  if (!h) return [];
  if (Array.isArray(h.admins)) return h.admins;
  return h.createdBy ? [h.createdBy] : (Array.isArray(h.members) && h.members[0] ? [h.members[0]] : []);
}
const amAdmin = () => !!meId && houseAdmins().includes(meId);

function setAdmin(uid, on) {
  const cur = houseAdmins();
  if (!on && cur.length <= 1 && cur.includes(uid)) { toast('Il faut au moins un administrateur.'); return; }
  const next = on ? [...new Set([...cur, uid])] : cur.filter(x => x !== uid);
  fire(updateDoc(houseRef(), { admins: next }));
  toast(on ? `${memberName(uid)} est administrateur.` : `${memberName(uid)} n'est plus administrateur.`);
}

// Retirer quelqu'un : il perd l'accès, mais peut revenir avec le code (sauf si on change le code)
function removeMember(uid) {
  const b = writeBatch(db);
  b.update(houseRef(), { members: arrayRemove(uid), admins: houseAdmins().filter(x => x !== uid) });
  b.delete(ref('members', uid));
  fire(b.commit());
  toast(`${memberName(uid)} a été retiré de la maison.`);
}

function forgetHouseLocally(id) {
  houses = houses.filter(h => h.code !== id);
  if (fav === id) fav = houses[0]?.code || null;
  saveHouses();
  closeSheet();
  closeHouse();
  if (houses.length) enterHouse(fav || houses[0].code); else render();
}

// Quitter : un admin seul doit d'abord passer la main ; s'il n'y a plus personne, la maison est supprimée
function startLeave() {
  const others = (state.house?.members || []).filter(x => x !== meId);
  const lastAdmin = amAdmin() && houseAdmins().filter(x => x !== meId).length === 0;
  if (!lastAdmin) return leaveHouse();
  if (others.length) return openTransferSheet(others);
  openSheet(`<h3>Supprimer la maison ?</h3>
    <p class="hint">Tu es la dernière personne dans <b>${esc(state.house?.name || 'cette maison')}</b>. En partant, la maison et tout son contenu (listes, calendrier, bento, dépenses) seront <b>supprimés définitivement</b>.</p>
    <div class="actions"><button type="button" class="btn ghost" data-close>Annuler</button>
      <button type="button" class="btn danger" data-delete-house>Supprimer et quitter</button></div>`);
  sheetKind = 'leaveDelete';
}
let transferTo = null;
function openTransferSheet(others) {
  transferTo = null;
  const ms = others.map(id => ({ id, name: memberName(id) }));
  openSheet(`<h3>Avant de partir</h3>
    <p class="hint" style="margin-bottom:12px">Tu es l'administrateur de la maison. Choisis qui reprend les droits :</p>
    <div class="card">${ms.map(m => `<button type="button" class="tagrow" data-transfer="${esc(m.id)}">
        <span class="avatar" style="--h:${pHue(m.id)}">${esc(avatarOf(m.id, m.name))}</span><span class="grow">${esc(m.name)}</span><span class="tagck">${ICON.check}</span></button>`).join('')}</div>
    <div class="actions"><button type="button" class="btn ghost" data-close>Annuler</button>
      <button type="button" class="btn danger" data-transfer-go disabled>Transférer et quitter</button></div>`);
  sheetKind = 'transfer';
}
function leaveHouse(newAdmin) {
  const id = state.code;
  if (!id) return;
  const b = writeBatch(db);
  b.delete(ref('members', meId));
  const upd = { members: arrayRemove(meId) };
  if (newAdmin) upd.admins = [newAdmin];
  else if (amAdmin()) upd.admins = houseAdmins().filter(x => x !== meId);
  b.update(houseRef(), upd);
  fire(b.commit());
  forgetHouseLocally(id);
}
async function deleteHouse() {
  const id = state.code, jc = state.house?.code;
  if (!id) return;
  closeSheet();
  toast('Suppression de la maison…');
  try {
    for (const c of ['items', 'sections', 'lists', 'events', 'replies', 'posts', 'media', 'members']) {
      const sn = await getDocs(collection(db, 'households', id, c));
      for (let i = 0; i < sn.docs.length; i += 400) {
        const b = writeBatch(db);
        sn.docs.slice(i, i + 400).forEach(d => b.delete(doc(db, 'households', id, c, d.id)));
        await b.commit();
      }
    }
    if (jc) await deleteDoc(doc(db, 'joinCodes', jc)).catch(() => {});
    await deleteDoc(doc(db, 'households', id));
    toast('Maison supprimée.');
  } catch (e) { console.error(e); toast("La suppression n'a pas pu aller jusqu'au bout."); }
  forgetHouseLocally(id);
}

// Réautoriser : la personne pourra revenir avec le code de la maison.

function purgeMember(uid) {
  const b = writeBatch(db);

function changeJoinCode() {

}

screen.addEventListener('submit', async e => {
  e.preventDefault();
  if (e.target.id === 'wallForm') return publishPost();
  const f = e.target, fld = n => f.querySelector(`[name="${n}"]`) || f.querySelector(`[name="q_${n}"]`);
  const v = n => (fld(n)?.value || '').trim();
  const need = n => { const el = fld(n); if (!el.value.trim()) { el.classList.add('err'); el.focus(); return true; } return false; };
  const btn = f.querySelector('button[type="submit"]');
  const busy = on => { if (btn) { btn.disabled = on; btn.style.opacity = on ? .6 : ''; } };

  if (f.dataset.form === 'signup') {
    if (need('pseudo') || need('email') || need('password') || need('password2')) return;
    const pw1 = f.querySelector('[name="password"]').value, pw2 = f.querySelector('[name="password2"]');
    if (pw1 !== pw2.value) { pw2.classList.add('err'); pw2.focus(); toast('Les deux mots de passe ne sont pas identiques.'); return; }
    busy(true); creatingProfile = true;
    try {
      const cred = await createUserWithEmailAndPassword(auth, v('email'), f.querySelector('[name="password"]').value);
      await setDoc(userRef(cred.user.uid), newProfile(cred.user, v('pseudo')));
      updateProfile(cred.user, { displayName: v('pseudo').slice(0, 30) }).catch(() => {});
    } catch (err) { toast(authError(err)); busy(false); }
    creatingProfile = false;
  } else if (f.dataset.form === 'login') {
    if (need('email') || need('password')) return;
    busy(true);
    try { await signInWithEmailAndPassword(auth, v('email'), f.querySelector('[name="password"]').value); }
    catch (err) { toast(authError(err)); busy(false); }
  } else if (f.dataset.form === 'reset') {
    if (need('email')) return;
    busy(true);
    try { await sendPasswordResetEmail(auth, v('email')); toast('E-mail envoyé ! Regarde ta boîte de réception (et les spams).'); state.authMode = 'login'; render(); }
    catch (err) { toast(authError(err)); busy(false); }
  } else if (f.dataset.form === 'create') {
    if (need('house')) return;
    createHouse(v('house'));
  } else if (f.dataset.form === 'join') {
    if (need('code')) return;
    busy(true);
    if (!(await joinWithCode(v('code')))) busy(false);
  }
});

// Supprimer un compte (admin) : son profil est effacé et il est retiré de toutes ses maisons.
// S'il se reconnecte avec son e-mail, il repart de zéro (pour l'empêcher de revenir, bloque-le plutôt).
async function adminDeleteUser(uid) {
  let u = (state.users || []).find(x => x.id === uid);
  if (!u) { try { const sn = await getDoc(userRef(uid)); u = sn.exists() ? sn.data() : null; } catch (_) {} }
  if (!u) u = { pseudo: memberName(uid), houses: state.code ? [{ code: state.code }] : [] };
  if (state.code && !(u.houses || []).some(h => h && h.code === state.code) && (state.house?.members || []).includes(uid)) u.houses = [...(u.houses || []), { code: state.code }];
  const hs = Array.isArray(u?.houses) ? u.houses.map(h => h && h.code).filter(Boolean) : [];
  hs.forEach(h => {
    updateDoc(doc(db, 'households', h), { members: arrayRemove(uid), banned: arrayRemove(uid) }).catch(e => console.warn(e));
    deleteDoc(doc(db, 'households', h, 'members', uid)).catch(e => console.warn(e));
  });
  fire(deleteDoc(userRef(uid)));
  toast(`Compte de ${u?.pseudo || 'cette personne'} supprimé.`);
}

function renderList(l) {
  const its = state.items.filter(i => i.listId === l.id);
  const shop = !!l.shopping;
  const todo = shop ? its.filter(i => !i.done) : its, done = shop ? its.filter(i => i.done) : [];
  // catégories rangées automatiquement : celle qui a le plus d'éléments en haut
  const cntSec = id => todo.filter(i => i.sectionId === id).length;
  const secs = sectionsOf(l.id).map((sc, k) => ({ sc, k, n: cntSec(sc.id) })).sort((a, b) => b.n - a.n || a.k - b.k).map(x => x.sc);
  const secIds = new Set(secs.map(s => s.id));
  let h = `<nav class="catbar">${secs.map(s => {
      const n = todo.filter(i => i.sectionId === s.id).length;
      return `<button type="button" class="catchip" data-action="jumpSec" data-id="${esc(s.id)}"><span class="e">${esc(s.emoji)}</span>${esc(s.name)}${n ? `<span class="n">${n}</span>` : ''}</button>`;
    }).join('')}<button type="button" class="catchip add" data-action="newSec">＋ Catégorie</button>${secs.length ? `<button type="button" class="catchip add" data-sec-manage-open>⚙️ Gérer</button>` : ''}</nav>`;

  const loose = todo.filter(i => !secIds.has(i.sectionId));
  if (secs.length) {
    // toutes les catégories s'affichent, même vides (on peut y ajouter ou y glisser un élément)
    h += `<div id="groups">${secs.map(s => group(s, todo.filter(i => i.sectionId === s.id))).join('')}</div>`;
    if (loose.length) h += group(null, loose);
  } else if (todo.length) {
    h += `<section class="sec"><div class="card tiles" data-drop="">${loose.map(itemRow).join('')}</div></section>`;
  } else {
    h += `<section class="sec"><div class="card"><div class="pad muted">${
      done.length ? 'Plus rien à faire ici.' : 'Ajoute un premier élément juste au-dessus.'}</div></div></section>`;
  }
  if (done.length) {
    // Cochés, rangés par catégorie : on retrouve vite l'élément à remettre dans la liste.
    const dg = secs.map(s => ({ s, items: done.filter(i => i.sectionId === s.id) })).filter(g => g.items.length);
    const dl = done.filter(i => !secIds.has(i.sectionId));
    h += `<div class="done-zone"><div class="grp-h soft done-h">Cochés<span class="n">${done.length}</span>
        <button class="link act" data-action="clearDone">Tout effacer</button></div>
      ${dg.length ? dg.map(g => group(g.s, g.items, { mini: true })).join('') + (dl.length ? group(null, dl, { mini: true }) : '')
                  : `<div class="card tiles">${dl.map(itemRow).join('')}</div>`}
    </div>`;
  }
  return h;
}

// Appui long sur un élément
(() => {
  let timer = null, startX = 0, startY = 0, fired = false;
  body.addEventListener('pointerdown', e => {
    const row = e.target.closest('.irow[data-id]');
    if (!row || state.selecting || e.target.closest('.drag, .ithumb')) return;
    startX = e.clientX; startY = e.clientY; fired = false;
    timer = setTimeout(() => { fired = true; navigator.vibrate?.(15); setSelecting(true, row.dataset.id); }, 480);
  });
  const cancel = e => { if (timer && (!e || e.type !== 'pointermove' || Math.hypot(e.clientX - startX, e.clientY - startY) > 8)) { clearTimeout(timer); timer = null; } };
  body.addEventListener('pointermove', cancel);
  body.addEventListener('pointerup', () => { cancel(); if (fired) setTimeout(() => { fired = false; }, 350); });
  body.addEventListener('pointercancel', () => cancel());
  body.addEventListener('contextmenu', e => { if (e.target.closest('.irow')) e.preventDefault(); });
  // le clic qui suit un appui long ne doit pas ouvrir l'élément
  body.addEventListener('click', e => { if (fired) { fired = false; e.stopPropagation(); e.preventDefault(); } }, true);
})();

function shortLink(url) {
  try {
    const u = new URL(url.replace(/&amp;/g, '&'));
    const host = u.hostname.replace(/^www\./, '');
    const seg = u.pathname.split('/').map(x => decodeURIComponent(x)).find(x => x && x.length > 2 && !/^(dp|p|r|s|gp|product|products|item|itm|fr|en|ref=.*)$/i.test(x) && !/^[A-Z0-9]{8,}$/.test(x));
    let label = host + (seg ? '/' + seg : '');
    if (label.length > 34) label = label.slice(0, 32) + '…';
    return label;
  } catch (_) { return url.slice(0, 30) + '…'; }
}
const linkify = html => html.replace(/(https?:\/\/[^\s<]+)/g, m => `<a class="shortlink" href="${m}" target="_blank" rel="noopener">🔗 ${esc(shortLink(m))}</a>`);

const mediaCache = new Map(), mediaLoading = new Map();
function loadMedia(id) {
  if (mediaCache.has(id)) return Promise.resolve(mediaCache.get(id));
  if (mediaLoading.has(id)) return mediaLoading.get(id);
  const r = ref('media', id);
  const pr = getDocFromCache(r).then(x => { if (!x.exists()) throw 0; return x; }).catch(() => getDoc(r))
    .then(x => { const d = x.exists() ? x.data().data : null; if (d) mediaCache.set(id, d); mediaLoading.delete(id); return d; })
    .catch(() => { mediaLoading.delete(id); return null; });
  mediaLoading.set(id, pr);
  return pr;
}
// ====== Liens vidéo : miniature + ouverture dans l'app (TikTok, YouTube, Instagram…) ======
function normLink(v) {
  let t = String(v || '').trim();
  if (!t) return '';
  const m = t.match(/https?:\/\/\S+/i); if (m) t = m[0];               // un texte partagé contient souvent le lien
  else if (/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(t)) t = 'https://' + t;
  else return '';
  return t.slice(0, 500);
}
function videoInfo(url) {
  let u; try { u = new URL(url); } catch (_) { return null; }
  const h = u.hostname.replace(/^(www|m|vm|vt)\./, '');
  const yt = url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/);
  if (yt) return { kind: 'youtube', label: 'YouTube', id: yt[1], img: `https://i.ytimg.com/vi/${yt[1]}/hqdefault.jpg` };
  if (/(^|\.)tiktok\.com$/.test(h)) return { kind: 'tiktok', label: 'TikTok' };
  if (/(^|\.)instagram\.com$/.test(h)) return { kind: 'instagram', label: 'Instagram' };
  if (/(^|\.)(facebook\.com|fb\.watch)$/.test(h)) return { kind: 'web', label: 'Facebook' };
  if (/(^|\.)pinterest\.(com|fr)$|pin\.it$/.test(h)) return { kind: 'web', label: 'Pinterest' };
  if (/(^|\.)vimeo\.com$/.test(h)) return { kind: 'web', label: 'Vimeo' };
  return { kind: 'web', label: h.replace(/^www\./, '') };
}
function videoThumb(url, clickable, item = {}) {
  const v = videoInfo(url); if (!v) return '';
  const icon = v.kind === 'web' ? '🔗' : '▶';
  let img = '';
  if (item.photoId) img = `<img data-media="${esc(item.photoId)}" alt="">`;                       // ta propre capture : toujours prioritaire
  else if (v.img) img = `<img src="${esc(v.img)}" alt="" loading="lazy" referrerpolicy="no-referrer">`; // YouTube : direct
  else if (item.thumb) img = `<img src="${esc(item.thumb)}" alt="" referrerpolicy="no-referrer" data-stored="${esc(url)}" data-item="${esc(item.id || '')}">`;
  else img = `<img data-resolve="${esc(url)}" data-item="${esc(item.id || '')}" alt="" referrerpolicy="no-referrer" hidden>`;
  const inner = `${img}<span class="vplay">${icon}</span><span class="vsrc">${esc(v.label)}</span>`;
  return clickable
    ? `<a class="vthumb ${v.kind}" href="${esc(url)}" target="_blank" rel="noopener" aria-label="Ouvrir sur ${esc(v.label)}">${inner}</a>`
    : `<span class="vthumb ${v.kind}">${inner}</span>`;
}
// Trouver l'image d'une vidéo : TikTok la donne directement ; sinon on lit l'aperçu de la page (Microlink, gratuit, quelques demandes par jour)
const thCache = (() => { try { return JSON.parse(store.get('maison.thumbs') || '{}'); } catch (_) { return {}; } })();
const thLoading = new Map(), thRetried = new Set();
function saveThCache() {
  for (const k of Object.keys(thCache)) if (Date.now() - thCache[k].t > 24 * 3600e3) delete thCache[k];
  try { store.set('maison.thumbs', JSON.stringify(thCache)); } catch (_) {}
}
async function fetchThumb(url) {
  const v = videoInfo(url);
  if (v?.kind === 'tiktok') {
    try {
      const r = await fetch('https://www.tiktok.com/oembed?url=' + encodeURIComponent(url));
      if (r.ok) { const j = await r.json(); if (j && j.thumbnail_url) return j.thumbnail_url; }
    } catch (_) {}
  }
  try {
    const r = await fetch('https://api.microlink.io/?url=' + encodeURIComponent(url));
    if (r.ok) { const j = await r.json(); const u = j?.data?.image?.url; if (u) return u; }
  } catch (_) {}
  return '';
}
function resolveThumb(url, force) {
  const c = thCache[url];
  if (!force && c && Date.now() - c.t < (c.u ? 12 : 6) * 3600e3) return Promise.resolve(c.u);   // échec : on ne réessaie pas avant 6 h
  if (thLoading.has(url)) return thLoading.get(url);
  const pr = fetchThumb(url).then(u => { thCache[url] = { u, t: Date.now() }; saveThCache(); return u; }).finally(() => thLoading.delete(url));
  thLoading.set(url, pr);
  return pr;
}
function shareThumb(itemId, u) {
  // on range l'adresse de l'image dans l'élément : les autres membres n'ont pas à la rechercher
  const it = state.items.find(x => x.id === itemId);
  if (it && it.thumb !== u && state.code) { it.thumb = u; fire(updateDoc(ref('items', itemId), { thumb: u })); }
}
function hydrateThumbs(root = document) {
  root.querySelectorAll('img[data-resolve]:not([src])').forEach(img => {
    const url = img.dataset.resolve, id = img.dataset.item;
    resolveThumb(url).then(u => {
      if (!u) return;
      img.onload = () => { img.hidden = false; if (id) shareThumb(id, u); };
      img.onerror = () => { img.hidden = true; };
      img.src = u;
    });
  });
  // image déjà rangée mais périmée (les liens TikTok / Instagram expirent) : on en cherche une nouvelle, une fois
  root.querySelectorAll('img[data-stored]').forEach(img => {
    img.onerror = () => {
      img.hidden = true;
      const url = img.dataset.stored, id = img.dataset.item;
      if (thRetried.has(url)) return;
      thRetried.add(url);
      resolveThumb(url, true).then(u => {
        if (!u || u === img.getAttribute('src')) { if (id) shareThumb(id, ''); return; }
        img.onerror = () => { img.hidden = true; };
        img.onload = () => { img.hidden = false; if (id) shareThumb(id, u); };
        img.src = u;
      });
    };
  });
  root.querySelectorAll('.vthumb img[src]:not([data-stored])').forEach(img => { if (!img.onerror) img.onerror = () => { img.hidden = true; }; });
}

function hydrateMedia(root = document) {
  hydrateThumbs(root);
  root.querySelectorAll('img[data-media]:not([src])').forEach(img => {
    const id = img.dataset.media;
    if (mediaCache.has(id)) { img.src = mediaCache.get(id); return; }
    loadMedia(id).then(d => { if (d) document.querySelectorAll(`img[data-media="${CSS.escape(id)}"]`).forEach(x => { x.src = d; }); });
  });
}

}

// ----- Couleur de chaque personne (la même que son rond) et surlignage multicolore -----
const personColor = (id, a = 1, l = 58) => `hsl(${pHue(id)} 70% ${l}% / ${a})`;
function peopleGrad(ids, a) {
  if (!ids || !ids.length) return '';

// Ce qu'on affiche dans le rond d'une personne : son émoji si elle en a choisi un, sinon son initiale
const clipAvatar = v => { const g = graphemes(String(v || '').replace(/\s+/g, '')); return g.length && !/^[\p{L}\p{N}]$/u.test(g[0]) ? g[0] : g.slice(0, 2).join(''); };
function avatarOf(id, name) {
  if (id === meId && typeof state.profile?.avatar === 'string') return state.profile.avatar ? clipAvatar(state.profile.avatar) : initial(name || state.myName);
  const m = (state.members || []).find(x => x.id === id);

}

function submitAddItem(f, title) {

  if (!listId) return;
  const qtyEl = f.querySelector('[name="q_qty"]'), noteEl = f.querySelector('[name="q_note"]'), titleEl = f.querySelector('[name="q_title"]');

  fire(setDoc(doc(col('items')), {
    photoId,
    listId, sectionId: sheetSec || null, title: title.slice(0, 200), done: false, createdAt: Date.now(), order: Date.now(),
    qty: qtyEl.value.trim().slice(0, 30), note: noteEl.value.trim().slice(0, 500), emoji: sheetEmoji || null, important, link,
    byName: state.myName, by: meId,

  }));
  { const ln = state.lists.find(x => x.id === listId)?.name || 'une liste', asg = [...sheetPeople].filter(id => id !== meId), url = appLink('tab=lists&list=' + listId);
    if (asg.length) pushNotify('assign', { title: `📌 ${state.myName} te confie « ${title.slice(0, 60)} »`, body: `Dans ${ln}`, url, to: asg });
  }

    log.prepend(chip);

  const flash = $('#addFlash');

    flash.innerHTML = `✓ <b>${esc(title)}</b> ajouté${secName ? ` dans ${esc(secName)}` : ''}`;

let sortables = [];
function initSortables() {
  sortables.forEach(x => { try { x.destroy(); } catch (_) {} });
  sortables = [];
  if (typeof Sortable === 'undefined' || state.selecting) return;
  if (state.view !== 'list') {
    if (state.tab !== 'lists') return;
    screen.querySelectorAll('.lcol').forEach(el => sortables.push(Sortable.create(el, {
      animation: 200, ghostClass: 'drag-ghost', chosenClass: 'drag-chosen', dragClass: 'drag-fly',
      forceFallback: true, fallbackTolerance: 6, delay: 280, delayOnTouchOnly: true, draggable: '.lcard[data-list-id]',
      filter: '.lc-btn, .check', preventOnFilter: false,
      onStart() { state.dragging = true; document.body.classList.add('dragging'); navigator.vibrate?.(12); },
      onEnd() {
        state.dragging = false; document.body.classList.remove('dragging');
        saveListOrder();
        if (state.renderPending) { state.renderPending = false; render(); }
      }
    })));
    return;
  }
  const base = {
    animation: 180, ghostClass: 'drag-ghost', chosenClass: 'drag-chosen', dragClass: 'drag-fly',
    forceFallback: true, fallbackTolerance: 4, scroll: true, bubbleScroll: true,
    onStart() { state.dragging = true; document.body.classList.add('dragging'); },
  };
  const end = () => { state.dragging = false; document.body.classList.remove('dragging'); if (state.renderPending) { state.renderPending = false; render(); } };
  body.querySelectorAll('.card[data-drop]').forEach(el => sortables.push(Sortable.create(el, {
    ...base, group: 'items', handle: '.drag', draggable: '.irow',
    onEnd(e) { saveItemOrder(e.to); if (e.from !== e.to) saveItemOrder(e.from); end(); }
  })));
  const g = body.querySelector('#groups');
  if (g) sortables.push(Sortable.create(g, {
    ...base, group: 'secs', handle: '.sec-drag', draggable: '.grp[data-sec-id]',
    onEnd() { saveSectionOrder(g); end(); }
  }));
}
function saveListOrder() {
  const ids = [...screen.querySelectorAll('.lcard[data-list-id]')].map(el => el.dataset.listId);
  const b = writeBatch(db); let n = 0;
  ids.forEach((id, k) => {
    const l = state.lists.find(x => x.id === id);
    if (l && l.order !== k + 1) { b.update(ref('lists', id), { order: k + 1 }); l.order = k + 1; n++; }
  });
  if (n) fire(b.commit());
}
function saveItemOrder(box) {
  const sec = box.dataset.drop || null;
  const b = writeBatch(db); let n = 0;
  [...box.querySelectorAll('.irow[data-id]')].forEach((row, idx) => {
    const it = state.items.find(i => i.id === row.dataset.id);
    if (!it) return;
    const order = idx + 1;
    if (it.order !== order || (it.sectionId || null) !== sec) {
      b.update(ref('items', it.id), { order, sectionId: sec });
      it.order = order; it.sectionId = sec; n++;
    }
  });
  if (n) fire(b.commit());
}
function saveSectionOrder(box) {
  const b = writeBatch(db); let n = 0;
  [...box.querySelectorAll('.grp[data-sec-id]')].forEach((el, idx) => {
    const sct = state.sections.find(x => x.id === el.dataset.secId);
    if (!sct) return;
    const order = idx + 1;
    if (sct.order !== order) { b.update(ref('sections', sct.id), { order }); sct.order = order; n++; }
  });
  // les catégories vides (non affichées) passent après
  sectionsOf(state.listId).filter(x => !box.querySelector(`[data-sec-id="${CSS.escape(x.id)}"]`)).forEach((x, k) => {
    const order = 1000 + k;
    if (x.order < 1000) { b.update(ref('sections', x.id), { order }); x.order = order; n++; }
  });
  if (n) fire(b.commit());
}

function render() {
  if (state.dragging) { state.renderPending = true; return; }
  let key;
  if (!configured) key = 'setup';
  else if (!state.authReady) key = 'loading';
  else if (!state.user) key = 'auth-' + state.authMode;
  else if (!state.profile) key = 'loading';
  else if (state.blocked) key = 'blocked';
  else if (state.view === 'admin' && state.isAdmin) key = 'admin';
  else if (!state.code) key = 'onboard';
  else key = 'app';

  composer.hidden = true; fab.hidden = true;
  const selOn = key === 'app' && state.tab === 'lists' && state.view === 'list' && state.selecting;
  renderTabbar(key === 'app' && !selOn);
  renderSelbar(selOn);

  if (key === 'admin') {
    if (renderedKey !== 'admin') { screen.innerHTML = `<div class="anim-in">${renderAdminHead()}</div>`; renderedKey = 'admin'; }
    renderAdminBody();
    return;
  }
  if (key !== 'app') {
    body.innerHTML = '';
    // Ces écrans contiennent des champs : on ne les redessine que si l'écran change.
    if (renderedKey !== key) {
      screen.innerHTML = key === 'setup' ? renderSetup() : key === 'loading' ? renderLoading()
        : key.startsWith('auth-') ? renderAuth() : key === 'blocked' ? renderBlocked() : renderOnboarding();
      renderedKey = key;
    }
    return;
  }
  if (state.tab === 'home') {
    const anim = state.anim ? 'anim-' + state.anim : ''; state.anim = null;
    screen.innerHTML = `<div class="${anim}">${renderDashboard()}</div>`;
    body.innerHTML = '';
    composer.hidden = true;
    renderedKey = 'home';
    return;
  }
  if (state.tab === 'budget') {
    const anim = state.anim ? 'anim-' + state.anim : ''; state.anim = null;
    screen.innerHTML = `<div class="${anim}">${pageHead('Dépenses', 'Salaire moins charges fixes : ce qu\'il reste à chacun.')}</div>`;
    body.innerHTML = `<div class="${anim}">${renderBudget()}</div>`;
    composer.hidden = true;
    renderedKey = 'budget';
    return;
  }
  if (state.tab === 'humeur') {
    const anim = state.anim ? 'anim-' + state.anim : ''; state.anim = null;
    screen.innerHTML = `<div class="${anim}">${pageHead('Humeur', 'Comment ça va, vraiment&nbsp;?')}</div>`;
    body.innerHTML = `<div class="${anim}">${renderHumeur()}</div>`;
    composer.hidden = true;
    renderedKey = 'humeur';
    return;
  }
  if (state.tab === 'regles') {
    const anim = state.anim ? 'anim-' + state.anim : ''; state.anim = null;
    screen.innerHTML = `<div class="${anim}">${pageHead('Règles', 'Pour penser à celles qui les ont.')}</div>`;
    body.innerHTML = `<div class="${anim}">${renderRegles()}</div>`;
    composer.hidden = true;
    renderedKey = 'regles';
    return;
  }
  if (state.tab === 'cal') {
    const anim = state.anim ? 'anim-' + state.anim : ''; state.anim = null;
    screen.innerHTML = `<div class="${anim}">${renderCalendar()}</div>`;
    body.innerHTML = '';
    renderedKey = 'cal';
    return;
  }
  if (state.tab === 'notes') {
    // l'en-tête contient le champ de saisie : on ne le redessine pas à chaque nouveau message
    if (renderedKey !== 'notes') { screen.innerHTML = `<div class="${state.anim ? 'anim-' + state.anim : ''}">${renderNotesHead()}</div>`; showPendingPhoto(); showPendingAudio('wall'); showPendingTags(); }
    markMentionsSeen();
    state.anim = null;
    body.innerHTML = `<div class="wall">${renderWall()}</div>`;
    hydrateMedia(body);
    state.freshPosts = new Set();
    renderedKey = 'notes';
    return;
  }
  renderedKey = 'app';

  const list = currentList();
  if (list && state.pendingList === list.id) state.pendingList = null;
  if (state.view === 'list' && !list && !state.loading && state.pendingList !== state.listId) state.view = 'home';
  const inList = state.view === 'list' && list;
  const anim = state.loading ? '' : (state.anim ? 'anim-' + state.anim : '');
  if (!state.loading) state.anim = null;
  if (inList) {
    const hue = hueOf(list.id);
    screen.innerHTML = `<div class="view ${anim}" style="--h:${hue}">${renderListHead(list)}</div>`;
    body.innerHTML = `<div class="view ${anim}" style="--h:${hue}">${renderList(list)}</div>`;
    composer.classList.add('view');
    composer.style.setProperty('--h', hue);
    composer.hidden = false;
    renderSecChips(list);
  } else {
    const ae = document.activeElement, typing = ae?.id === 'listSearch';
    const caret = typing ? ae.selectionStart : 0;
    screen.innerHTML = `<div class="${anim}">${renderHome()}</div>`;
    body.innerHTML = '';
    filterHomeLists();
    if (typing) { const inp = $('#listSearch'); if (inp) { inp.focus({ preventScroll: true }); try { inp.setSelectionRange(caret, caret); } catch {} } }
    composer.classList.remove('view');
  }
  state.fresh = new Set();
  initSortables();
  hydrateMedia(body);
  updateStuck();
}

// Glisser la fenêtre vers le bas pour la fermer
(() => {
  let y0 = null, dy = 0;
  sheet.addEventListener('touchstart', e => {
    if (sheet.scrollTop > 0 || e.target.closest('input, textarea, .emo-grid, .dd-list')) { y0 = null; return; }
    y0 = e.touches[0].clientY; dy = 0; sheet.style.transition = 'none';
  }, { passive: true });
  sheet.addEventListener('touchmove', e => {
    if (y0 === null) return;
    dy = Math.max(0, e.touches[0].clientY - y0);
    sheet.style.transform = dy ? `translateY(${dy}px)` : '';
  }, { passive: true });
  sheet.addEventListener('touchend', () => {
    if (y0 === null) return;
    sheet.style.transition = 'transform .2s ease';
    if (dy > 90) closeSheet(); else sheet.style.transform = '';
    y0 = null;
  });
})();

overlay.addEventListener('click', e => {
  const t = e.target;
  if (t === overlay || t.closest('[data-close]')) return closeSheet();

  const emo = t.closest('[data-emo]');
  if (emo) return setEmoji(emo.dataset.emo);
  if (t.closest('[data-emo-none]')) return setEmoji(null);
  if (t.closest('[data-emo-toggle]')) { sheet.querySelector('.emo-wrap')?.toggleAttribute('hidden'); return; }

  if (t.closest('[data-dd-toggle]')) return setDdOpen(sheet.querySelector('.dd-panel')?.hidden);
  if (t.closest('[data-dd-close]')) return setDdOpen(false);
  const opt = t.closest('[data-dd-opt]');
  if (opt) return chooseSection(opt.dataset.ddOpt);
  if (t.closest('[data-dd-create]')) {
    const name = (sheet.querySelector('[data-dd-search]')?.value || '').trim().slice(0, 40);
    if (!name) return;
    const emo = clipIcon(ddNewEmoji) || '';
    const newId = addSection(sheetListId, name, emo);
    ddNewEmoji = ''; ddIconManual = false;
    if (sheetKind === 'draftCat' || sheetKind === 'bulkCat') return chooseSection(newId);
    sheetSec = newId;
    sheet.querySelector('[data-dd-label]').innerHTML = `<span class="e">${esc(emo)}</span>${esc(name)}`;
    return setDdOpen(false);
  }

  if (t.closest('[data-share]')) {
    navigator.share({ title: 'Maison', text: inviteText() }).catch(() => {});
    return;
  }
  if (t.closest('[data-copy]')) return copyInvite();
  const nc = t.closest('[data-new-code]');
  if (nc && amAdmin()) {
    if (!nc.classList.contains('sure')) { nc.classList.add('sure'); nc.textContent = 'Confirmer : nouveau code'; return; }
    changeJoinCode(); toast('Nouveau code créé. L\'ancien ne marche plus.');
    setTimeout(() => openInviteSheet(), 400); return;
  }
  const mg = t.closest('[data-manage]');
  if (mg && amAdmin()) return openManageMember(mg.dataset.manage);
  if (t.closest('[data-back-members]')) return openMembersSheet();
  const sa = t.closest('[data-set-admin]');
  if (sa && amAdmin()) { setAdmin(sa.dataset.setAdmin, sa.dataset.on === '1'); return openMembersSheet(); }
  const rm = t.closest('[data-remove-member]');
  if (rm && amAdmin()) {
    if (!rm.classList.contains('sure')) { rm.classList.add('sure'); rm.textContent = 'Confirmer : retirer de la maison'; return; }
    removeMember(rm.dataset.removeMember); return openMembersSheet();
  }
  const tr = t.closest('[data-transfer]');
  if (tr) {
    transferTo = tr.dataset.transfer;
    sheet.querySelectorAll('[data-transfer]').forEach(b => b.classList.toggle('on', b === tr));

      closeSheet(); break;

    case 'newSec': {
      addSection(state.listId, value.slice(0, 40), sheetEmoji);
      closeSheet(); toast('Catégorie créée. Touche un élément pour l\'y ranger.'); break;
    }
    case 'editSec': {

      if (s && (s.name !== name || s.emoji !== sheetEmoji)) fire(updateDoc(ref('sections', s.id), { name, emoji: sheetEmoji }));
      closeSheet(); break;
    }
    case 'editItem': {
      const it = state.items.find(x => x.id === sheetTarget), title = value.slice(0, 200);
      const qty = (f.querySelector('[name="q_qty"]')?.value || '').trim().slice(0, 30);

      const asg = [...sheetPeople];

      const link = normLink(f.querySelector('[name="q_link"]')?.value);
      const added = asg.some(id => !(it?.assignees || []).includes(id));

      if (sheetPhoto?.data) photoId = saveMedia(sheetPhoto); else if (!sheetPhoto) photoId = null;
      const photoChanged = it && photoId !== it.photoId;
      if (photoChanged && it.photoId) fire(deleteDoc(ref('media', it.photoId)));
      if (it && (it.title !== title || (it.sectionId || null) !== sheetSec || (it.emoji || null) !== emoji || it.qty !== qty || it.note !== note || asgChanged || photoChanged || it.important !== important || (it.link || '') !== link)) {
        fire(updateDoc(ref('items', it.id), { title, sectionId: sheetSec, emoji, qty, note, assignees: asg, photoId, important, link,
          ...(added ? { assignedAt: Date.now(), assignedBy: state.myName } : {}) }));

      const it = state.items.find(i => i.id === id);
      if (!it || pendingToggle.has(id)) break;
      navigator.vibrate?.(10);

        // petite animation avant de passer dans « Cochés »

        el.closest('.irow')?.classList.add('checking');

    case 'editItem': { const it = state.items.find(i => i.id === id); if (it) openItemSheet(it); break; }
