<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maison">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F6F3EE">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Maison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F3EE; --card:#FFFFFF; --ink:#1F1B16; --muted:#8A8178; --line:#ECE6DD;
    --accent:#2F6B4F; --shadow:0 1px 2px rgba(31,27,22,.05), 0 4px 14px rgba(31,27,22,.04);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141210; --card:#1F1C19; --ink:#F2EDE6; --muted:#9A9087; --line:#2E2A26; --accent:#5FA883; --shadow:none; }
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{background:var(--bg);color:var(--ink)}
  body{font-family:Inter,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.4;min-height:100vh;
       padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
  button{font:inherit;color:inherit;cursor:pointer}
  .wrap{max-width:560px;margin:0 auto;padding:22px 18px 80px}

  h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:34px;letter-spacing:-.02em;line-height:1.1;word-break:break-word}
  h2{font-size:18px;font-weight:600;margin-bottom:12px}
  .sub{color:var(--muted);margin-top:6px;font-size:15px}
  .banner{margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-size:14px;color:var(--muted)}

  .card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
  .pad{padding:20px 18px}
  .muted{color:var(--muted)}
  .sec{margin-top:24px}
  .stack > * + *{margin-top:10px}

  .hometop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .hometop .btns{display:flex;gap:4px;margin:-6px -8px 0 0}

  /* Accueil */
  .lrow{display:flex;align-items:center;gap:14px;padding:13px 16px;width:100%;background:none;border:0;text-align:left}
  .lrow + .lrow{border-top:1px solid var(--line)}
  .lrow:active{background:color-mix(in srgb, var(--ink) 4%, transparent)}
  .tile{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;font-size:23px;line-height:1;
        background:color-mix(in srgb, var(--accent) 10%, var(--card))}
  .grow{flex:1;min-width:0}
  .lname{font-weight:600;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lmeta{color:var(--muted);font-size:14px;margin-top:1px}
  .chev{color:var(--muted);flex:none}

  .fab{position:fixed;right:max(20px, env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));
       background:var(--accent);color:#fff;border:0;border-radius:999px;padding:14px 20px 14px 16px;font-weight:600;font-size:16px;
       box-shadow:0 8px 24px color-mix(in srgb, var(--accent) 40%, transparent);display:flex;gap:8px;align-items:center;z-index:5}
  .fab svg{width:20px;height:20px}

  .empty{text-align:center;padding:34px 22px}
  .empty p{color:var(--muted);margin:8px 0 18px}
  .btn{border:0;border-radius:13px;padding:12px 18px;font-weight:600;font-size:15px}
  .primary{background:var(--accent);color:#fff}
  .ghost{background:color-mix(in srgb, var(--ink) 7%, transparent)}
  .danger{background:color-mix(in srgb, #C0392B 12%, transparent);color:#C0392B}
  .danger.sure{background:#C0392B;color:#fff}
  .full{width:100%}

  /* Vue d'une liste */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin:-8px -8px 14px}
  .back,.iconbtn{background:none;border:0;color:var(--accent);font-weight:500;font-size:17px;display:flex;align-items:center;gap:2px;padding:8px}
  .back svg,.iconbtn svg{width:22px;height:22px}
  .ltitle{display:flex;align-items:center;gap:12px}

  .grp{margin-top:22px}
  .grp-h{display:flex;align-items:center;gap:8px;margin:0 4px 9px;font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
  .grp-h .e{font-size:16px;letter-spacing:0}
  .grp-h .n{color:var(--muted);font-weight:500;letter-spacing:0}
  .grp-h::after{content:"";flex:1;height:1px;background:var(--line);margin-left:4px}
  .grp-h.soft{color:var(--muted)}
  .grp-h .act{margin-left:auto;order:2}
  .link{background:none;border:0;color:var(--accent);font-size:14px;font-weight:500;padding:2px 4px;text-transform:none;letter-spacing:0}

  .irow{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:54px}
  .irow + .irow{border-top:1px solid var(--line)}
  .check{width:27px;height:27px;border-radius:50%;border:2px solid color-mix(in srgb, var(--muted) 55%, transparent);flex:none;
         display:grid;place-items:center;background:none;transition:all .15s}
  .check svg{width:15px;height:15px;color:#fff}
  .check.on{background:var(--accent);border-color:var(--accent)}
  .itext{flex:1;min-width:0;cursor:pointer}
  .ititle{font-size:17px;word-break:break-word}
  .done .ititle{color:var(--muted);text-decoration:line-through}
  .by{font-size:12.5px;color:var(--muted);margin-top:1px}

  /* Barre d'ajout */
  .composer{position:sticky;top:0;z-index:6;margin:14px -18px 0;padding:10px 18px 10px;
            background:color-mix(in srgb, var(--bg) 86%, transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  .composer.stuck{box-shadow:0 8px 18px -14px rgba(31,27,22,.35)}
  .composer form{display:flex;gap:8px;align-items:center;background:var(--card);border-radius:16px;
                 padding:5px 5px 5px 16px;box-shadow:0 1px 2px rgba(31,27,22,.05), 0 6px 18px rgba(31,27,22,.06);border:1px solid var(--line);
                 transition:border-color .2s, box-shadow .2s}
  .composer form:focus-within{border-color:var(--lc);box-shadow:0 0 0 4px color-mix(in srgb, var(--lc) 16%, transparent)}
  .composer input{flex:1;min-width:0;border:0;background:none;font:16px Inter,system-ui,sans-serif;color:var(--ink);outline:none;padding:9px 0}
  .composer input::placeholder{color:var(--muted)}
  .composer form button{background:var(--lc);color:#fff;border:0;border-radius:12px;width:42px;height:42px;display:grid;place-items:center;flex:none;transition:transform .12s}
  .composer form button:active{transform:scale(.9)}
  .composer form button svg{width:20px;height:20px}

  .chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .composer .chips{margin-top:9px;padding-bottom:2px}
  .chip{flex:none;border:1px solid var(--line);background:var(--card);padding:7px 12px;border-radius:999px;font-weight:500;font-size:13.5px;white-space:nowrap}
  .chip.add{border-style:dashed;color:var(--muted);background:transparent}

  /* Feuille du bas */
  .overlay{position:fixed;inset:0;background:rgba(20,16,12,.42);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  .sheet{background:var(--card);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;border-radius:24px 24px 0 0;
         padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,.8,.3,1)}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .sheet{position:relative}
  .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:-10px auto 12px}
  .sheet-x{position:sticky;top:0;float:right;z-index:3;width:36px;height:36px;margin:-6px -6px 0 8px;border:0;border-radius:50%;
           display:grid;place-items:center;background:color-mix(in srgb, var(--ink) 8%, var(--card));color:var(--ink)}
  .sheet-x svg{width:18px;height:18px}
  .sheet-x:active{transform:scale(.9)}
  .sheet h3{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:24px;margin-bottom:16px}
  .field{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:13px;padding:13px 14px;font:16px Inter,system-ui,sans-serif;outline:none}
  .field:focus{border-color:var(--accent)}
  .field.err{border-color:#C0392B}
  .label{font-size:13px;color:var(--muted);font-weight:500;margin:18px 2px 8px}
  .actions{display:flex;gap:10px;margin-top:20px}
  .actions .btn{flex:1}
  .sep{height:1px;background:var(--line);margin:22px 0 6px}
  .linkbox{font-size:14px;word-break:break-all;padding:12px 14px;border-radius:13px;background:var(--bg);border:1px solid var(--line);user-select:all;-webkit-user-select:all}

  /* Émojis */
  .emo-row{display:flex;gap:10px;align-items:center}
  .emo-big{width:52px;height:52px;flex:none;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:28px;line-height:1;display:grid;place-items:center}
  .emo-wrap{margin-top:12px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
  .emo-grid{max-height:210px;overflow-y:auto;padding:4px 8px 8px}
  .emo-g{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:10px 4px 4px}
  .emo-cells{display:grid;grid-template-columns:repeat(auto-fill, minmax(40px, 1fr))}
  .emo{height:42px;border:0;background:none;border-radius:10px;font-size:24px;line-height:1}
  .emo:active,.emo.on{background:color-mix(in srgb, var(--accent) 16%, transparent)}
  .emo-custom{border:0;border-top:1px solid var(--line);border-radius:0 0 14px 14px;background:transparent}

  .srow{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
  .srow-btn{flex:1;display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;padding:11px 2px;font-size:16px;min-width:0}
  .srow-btn .e{font-size:20px;width:26px;text-align:center}
  .srow-btn .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .del{background:none;border:0;color:var(--muted);padding:8px;flex:none}
  .del svg{width:18px;height:18px}
  .hint{font-size:13.5px;color:var(--muted);margin-top:4px}

  /* Liste déroulante */
  .dd-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--bg);
          border-radius:13px;padding:13px 14px;font-size:16px;text-align:left}
  .dd-btn .v{display:flex;align-items:center;gap:10px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dd-btn svg{width:18px;height:18px;color:var(--muted);flex:none;transition:transform .15s}
  .dd.open .dd-btn{border-color:var(--accent)}
  .dd.open .dd-btn svg{transform:rotate(180deg)}
  .dd-panel{margin-top:8px;border:1px solid var(--line);border-radius:14px;background:var(--bg);overflow:hidden}
  .dd-search{border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent}
  .dd-search:focus{border-color:var(--line)}
  .dd-list{max-height:240px;overflow-y:auto}
  .dd-opt{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:12px 14px;text-align:left;font-size:16px}
  .dd-opt + .dd-opt{border-top:1px solid var(--line)}
  .dd-opt:active{background:color-mix(in srgb, var(--accent) 10%, transparent)}
  .dd-opt .e{width:24px;text-align:center;font-size:19px;flex:none}
  .dd-opt .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dd-opt .ck{margin-left:auto;color:var(--accent);flex:none;display:flex}
  .dd-opt .ck svg{width:18px;height:18px}
  .dd-opt.create{color:var(--accent);font-weight:500}
  .dd-empty{padding:12px 14px;color:var(--muted);font-size:14px}

  .logo{font-size:52px;margin-bottom:10px}

  /* Couleur propre à chaque liste (--h = teinte) */
  :root{--lc:var(--accent)}
  .view{--lc:hsl(var(--h,152) 45% 38%)}
  @media (prefers-color-scheme: dark){ .view{--lc:hsl(var(--h,152) 45% 60%)} }
  .hello{color:var(--muted);font-size:15px;font-weight:500;margin-bottom:4px}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
  .lcard{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;border:0;border-radius:22px;
         padding:16px 16px 15px;min-height:132px;background:hsl(var(--h) 60% 94%);color:var(--ink);overflow:hidden;
         transition:transform .15s cubic-bezier(.3,.7,.4,1), box-shadow .2s}
  .lcard::after{content:"";position:absolute;right:-26px;top:-26px;width:90px;height:90px;border-radius:50%;background:hsl(var(--h) 60% 88%);opacity:.7}
  .lcard:active{transform:scale(.96)}
  .lcard .lemo{position:relative;z-index:1;width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:28px;line-height:1;
               background:var(--card);box-shadow:0 2px 8px hsl(var(--h) 40% 40% / .14)}
  .lcard .lname{position:relative;z-index:1;font-weight:600;font-size:17px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal}
  .lcard .lmeta{position:relative;z-index:1;margin-top:auto;font-size:13.5px;color:hsl(var(--h) 30% 35%)}
  .lcard.add{background:transparent;border:1.5px dashed var(--line);align-items:center;justify-content:center;color:var(--muted);font-weight:500}
  .lcard.add::after{display:none}
  .lcard.add .plus{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb, var(--accent) 12%, transparent);color:var(--accent);font-size:26px;line-height:1}
  @media (prefers-color-scheme: dark){
    .lcard{background:hsl(var(--h) 22% 17%)}
    .lcard::after{background:hsl(var(--h) 25% 22%)}
    .lcard .lemo{background:hsl(var(--h) 20% 23%);box-shadow:none}
    .lcard .lmeta{color:hsl(var(--h) 20% 70%)}
  }

  .view .ltitle .tile{width:54px;height:54px;border-radius:17px;font-size:30px;background:hsl(var(--h) 60% 92%)}
  @media (prefers-color-scheme: dark){ .view .ltitle .tile{background:hsl(var(--h) 22% 20%)} }
  .view .back{color:var(--lc)}
  .view .iconbtn{color:var(--lc)}
  .view .check.on{background:var(--lc);border-color:var(--lc)}
  .view .grp-h:not(.soft){color:var(--lc)}
  .view .grp-h:not(.soft)::after{background:color-mix(in srgb, var(--lc) 28%, var(--line))}
  .view .link{color:var(--lc)}

  /* Éléments : émoji + quantité */
  .iline{display:flex;align-items:center;gap:10px;min-width:0}
  .iemo{font-size:21px;line-height:1;flex:none;width:26px;text-align:center}
  .ititle{flex:1;min-width:0}
  .qty{flex:none;margin-left:auto;font-size:13.5px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap;max-width:45%;overflow:hidden;text-overflow:ellipsis;
       color:var(--lc);background:color-mix(in srgb, var(--lc) 12%, transparent)}
  .done .qty{color:var(--muted);background:color-mix(in srgb, var(--muted) 12%, transparent)}
  .done .iemo{opacity:.5}
  .emo-big.none{color:var(--muted);font-size:22px}
  .emo-none{display:block;width:calc(100% - 16px);margin:8px 8px 0;border:1px dashed var(--line);background:none;border-radius:10px;padding:8px;font-size:14px;color:var(--muted)}

  /* Commentaire */
  .note{font-size:14px;line-height:1.35;color:var(--muted);margin-top:3px;white-space:pre-line;
        display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .note.indent{padding-left:36px}
  .done .note{opacity:.7}
  textarea.field{resize:vertical;min-height:84px;line-height:1.4}

  /* Membres */
  .members-btn{padding:6px 8px}
  .avatars{display:flex;align-items:center}
  .avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:600;font-size:13px;color:#fff;
          background:hsl(var(--h,152) 45% 45%);border:2px solid var(--bg)}
  .avatars .avatar + .avatar{margin-left:-9px}
  .avatar.more{background:var(--muted)}
  .avatar.lg{width:42px;height:42px;font-size:17px;border:0}
  .avatar.off{background:color-mix(in srgb, var(--muted) 45%, transparent)}
  .mrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .mname{font-weight:600;font-size:16px}
  .mdev{font-size:13.5px;margin-top:3px}
  .kick{flex:none;border:1px solid var(--line);background:none;color:var(--muted);border-radius:10px;padding:7px 11px;font-size:13.5px;font-weight:500}
  .kick.sure{background:#C0392B;border-color:#C0392B;color:#fff}

  /* Animations */
  @keyframes viewIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
  @keyframes viewBack{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
  @keyframes rise{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
  @keyframes enter{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}
  .anim-in{animation:viewIn .3s cubic-bezier(.2,.8,.3,1)}
  .anim-back{animation:viewBack .3s cubic-bezier(.2,.8,.3,1)}
  .anim-in .lcard,.anim-back .lcard,.anim-first .lcard{animation:rise .42s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i,0) * 45ms)}
  .irow.enter{animation:enter .35s cubic-bezier(.2,.8,.3,1)}
  .irow{transition:opacity .25s, background-color .25s}
  .irow.checking{opacity:.55}
  .irow.checking .check{animation:pop .32s ease}
  .irow.checking .ititle{text-decoration:line-through;color:var(--muted)}
  .check{transition:background-color .2s, border-color .2s, transform .12s}
  .check:active{transform:scale(.88)}
  .itext:active{opacity:.6}
  @media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
  .housebtn{background:none;border:0;display:flex;align-items:center;gap:6px;text-align:left;padding:0;max-width:100%}
  .housebtn h1{min-width:0}
  .housebtn .caret{display:flex;flex:none;color:var(--muted)}
  .housebtn .caret svg{width:24px;height:24px}
  .star{font-size:24px;line-height:1;color:var(--muted);padding:8px 10px}
  .star.on{color:#D9A21B}
  .toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);
         padding:11px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:calc(100% - 40px);text-align:center}
</style>
</head>
<body>
  <main class="wrap" id="app">
    <div id="screen"></div>
    <div class="composer" id="composer" hidden>
      <form id="composerForm" autocomplete="off">
        <input id="newItem" type="text" maxlength="200" placeholder="Ajouter un élément…" enterkeyhint="send">
        <button type="submit" aria-label="Ajouter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      </form>
      <nav class="chips" id="secChips"></nav>
    </div>
    <div id="body"></div>
  </main>

  <button class="fab" id="fab" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    Nouvelle liste
  </button>

  <div class="overlay" id="overlay" hidden><div class="sheet" id="sheet"></div></div>
  <div class="toast" id="toast" hidden></div>

<script type="module">
import { firebaseConfig } from './firebase-config.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {
  initializeFirestore, getFirestore, persistentLocalCache, persistentMultipleTabManager,
  collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, writeBatch
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

// ================== Outils ==================
const ICON = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',

function firstGrapheme(s) {
  s = String(s || '').trim();
  if (!s) return '';
  if (window.Intl && Intl.Segmenter) {
    const it = new Intl.Segmenter(undefined, { granularity: 'grapheme' }).segment(s)[Symbol.iterator]().next();
    return it.value ? it.value.segment : '';
  }
  return Array.from(s)[0];
}

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (_) {} }
};

function newCode() {
  const abc = 'abcdefghjkmnpqrstuvwxyz23456789';
  const bytes = crypto.getRandomValues(new Uint8Array(20));
  return Array.from(bytes, b => abc[b % abc.length]).join('');
}
function paramFrom(text, key) {
  const m = String(text || '').trim().match(new RegExp('[?&#]' + key + '=([a-z0-9]{16,40})', 'i'));
  return m ? m[1].toLowerCase() : null;
}
function codeFrom(text) {
  const p = paramFrom(text, 'maison');
  if (p) return p;
  const t = String(text || '').trim();
  return /^[a-z0-9]{16,40}$/i.test(t) ? t.toLowerCase() : null;
}

const HUES = [152, 211, 26, 338, 266, 188, 44, 4, 120, 290];
function hueOf(id) { let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return HUES[h % HUES.length]; }

const configured = firebaseConfig && firebaseConfig.projectId && !String(firebaseConfig.projectId).includes('COLLE');
if (configured) {
  const app = initializeApp(firebaseConfig);

const col = name => collection(db, 'households', state.code, name);
const ref = (name, id) => doc(db, 'households', state.code, name, id);
const houseRef = () => doc(db, 'households', state.code);

function onWriteError(e) {
  console.error(e);
  if (e && e.code === 'permission-denied') toast('Accès refusé : vérifie les règles Firebase.');
  else toast("Ça n'a pas marché, réessaie.");
}
// Les écritures s'affichent tout de suite (même hors connexion) et partent dès que possible.
const fire = p => { p.catch(onWriteError); };

function subscribe() {
  unsubs.forEach(u => u()); unsubs = [];
  state.loading = true; state.houseChecked = false; state.houseMissing = false;
  const have = {};
  const kinds = ['lists', 'sections', 'items'];
  const got = k => { have[k] = true; if (kinds.every(x => have[x])) state.loading = false; render(); };
  const err = e => { console.error(e); state.loading = false; state.error = e && e.code === 'permission-denied'
      ? 'Accès refusé : vérifie les règles Firebase.' : 'Impossible de charger les listes pour le moment.'; render(); };

  unsubs.push(onSnapshot(houseRef(), { includeMetadataChanges: true }, snap => {
    if (snap.exists()) {
      state.house = snap.data(); state.houseMissing = false; state.houseChecked = true;
      if (typeof state.house.name === 'string') rememberHouse(state.code, state.house.name);
    }
    else if (!snap.metadata.fromCache) { state.house = null; state.houseMissing = true; state.houseChecked = true; }
    render();
  }, err));

  unsubs.push(onSnapshot(col('members'), snap => {
    state.members = snap.docs.map(d => {
      const v = d.data();
      const devs = v.devices && typeof v.devices === 'object' ? Object.entries(v.devices) : [];
      return {
        id: d.id, name: str(v.name, "Quelqu'un"), removed: v.removed === true,
        devices: devs.map(([k, x]) => ({ id: k, label: str(x && x.label, 'Appareil'), lastSeen: Number(x && x.lastSeen) || 0 }))
                     .sort((a, b) => b.lastSeen - a.lastSeen)
      };
    });
    const mine = state.members.find(m => m.id === meId);
    if (mine && mine.removed) {
      const name = state.house?.name || 'la maison';
      forgetHouse(state.code);
      toast(`Tu as été retiré de « ${name} ».`);
      return;
    }
    render();
    if (sheetKind === 'members') openMembersSheet();
  }, e => console.error('membres', e)));

  unsubs.push(onSnapshot(query(col('lists'), orderBy('createdAt')), snap => {
    state.lists = snap.docs.map(d => { const v = d.data(); return { id: d.id, name: str(v.name, 'Sans nom'), emoji: str(v.emoji, '📋') }; });
    got('lists');
  }, err));
  unsubs.push(onSnapshot(query(col('sections'), orderBy('createdAt')), snap => {
    state.sections = snap.docs.map(d => { const v = d.data(); return { id: d.id, listId: v.listId, name: str(v.name, 'Sans nom'), emoji: str(v.emoji, '🏷️') }; });
    got('sections');
  }, err));
  unsubs.push(onSnapshot(query(col('items'), orderBy('createdAt')), snap => {
    const fresh = new Set();
    for (const d of snap.docs) { if (itemsPrimed && !seenItems.has(d.id)) fresh.add(d.id); seenItems.add(d.id); }
    itemsPrimed = true; state.fresh = fresh;
    state.items = snap.docs.map(d => {
      const v = d.data();
      return { id: d.id, listId: v.listId, sectionId: typeof v.sectionId === 'string' ? v.sectionId : null,
               title: String(v.title ?? ''), done: v.done === true, byName: typeof v.byName === 'string' ? v.byName : '',
               by: typeof v.by === 'string' ? v.by : null,
               emoji: typeof v.emoji === 'string' && v.emoji ? v.emoji : null,
               qty: typeof v.qty === 'string' ? v.qty.trim() : '',
               note: typeof v.note === 'string' ? v.note.trim() : '' };
    });
    got('items');
  }, err));
}

  } catch (_) { return []; }
}

// ----- Identité personnelle : la même personne sur tous ses appareils -----
// Ton profil (prénom, maisons, favorite) est rangé en ligne sous un code secret à toi.

let deviceId = store.get('maison.device');
if (!deviceId) { deviceId = newCode(); store.set('maison.device', deviceId); }
function deviceLabel() {
  const ua = navigator.userAgent;
  if (/iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return 'iPad';
  if (/iPhone/.test(ua)) return 'iPhone';
  if (/Android/.test(ua)) return /Mobile/.test(ua) ? 'Téléphone Android' : 'Tablette Android';
  if (/Macintosh/.test(ua)) return 'Mac';
  if (/Windows/.test(ua)) return 'PC Windows';
  return 'Appareil';
}
const deviceIcon = label => /iPad|Tablette/.test(label) ? '📱' : /iPhone|Téléphone/.test(label) ? '📱' : /Mac|PC/.test(label) ? '💻' : '🔹';
let lastTouch = 0;
function touchMember(force) {
  if (!db || !state.code || !meId || !state.myName) return;
  const now = Date.now();
  if (!force && now - lastTouch < 10 * 60 * 1000) return;
  lastTouch = now;
  fire(setDoc(ref('members', meId), { name: state.myName, devices: { [deviceId]: { label: deviceLabel(), lastSeen: now } } }, { merge: true }));
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') touchMember(false); });
function ago(ts) {
  if (!ts) return '';
  const s = (Date.now() - ts) / 1000;
  if (s < 15 * 60) return 'actif récemment';
  if (s < 3600) return `vu il y a ${Math.round(s / 60)} min`;
  if (s < 86400) return `vu il y a ${Math.round(s / 3600)} h`;
  if (s < 172800) return 'vu hier';
  return 'vu le ' + new Date(ts).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
}
let unsubMe = null, firstProfile = true, profileReady = false, lastProfileJson = '';
const personRef = () => doc(db, 'people', meId);
const profileData = () => ({ name: state.myName || '', houses: houses.map(h => ({ code: h.code, name: h.name || '' })), fav: fav || null });

function pushProfile() {
  if (!db || !meId || !profileReady) return;   // jamais avant d'avoir lu le profil en ligne
  const data = profileData(), j = JSON.stringify(data);
  if (j === lastProfileJson) return;
  lastProfileJson = j;
  fire(setDoc(personRef(), { ...data, updatedAt: Date.now() }));
}
const saveHouses = () => { saveLocal(); pushProfile(); };

function watchProfile() {
  if (!db || !meId) return;
  if (unsubMe) unsubMe();
  firstProfile = true; profileReady = false; lastProfileJson = '';
  unsubMe = onSnapshot(personRef(), snap => {
    if (!snap.exists()) { if (!snap.metadata.fromCache) { firstProfile = false; profileReady = true; pushProfile(); } return; }
    profileReady = true;
    const p = snap.data();
    const remote = Array.isArray(p.houses) ? p.houses.filter(h => h && typeof h.code === 'string').map(h => ({ code: h.code, name: String(h.name || '') })) : [];
    if (firstProfile) {
      // Première synchro : on fusionne ce que cet appareil connaît avec ton profil.
      for (const h of houses) if (!remote.some(r => r.code === h.code)) remote.push(h);
      firstProfile = false;
    }
    houses = remote;
    if (p.fav && houses.some(h => h.code === p.fav)) fav = p.fav;
    else if (!houses.some(h => h.code === fav)) fav = houses[0]?.code || null;
    if (typeof p.name === 'string' && p.name.trim()) { state.myName = p.name; store.set('maison.name', p.name); }
    lastProfileJson = JSON.stringify({ name: typeof p.name === 'string' ? p.name : '', houses: Array.isArray(p.houses) ? p.houses.map(h => ({ code: h.code, name: h.name || '' })) : [], fav: p.fav || null });
    saveLocal();
    pushProfile();   // n'écrit que si la fusion a ajouté quelque chose
    if (!state.code && houses.length) enterHouse(fav || houses[0].code);
    else { renderedKey = renderedKey === 'askName' ? '' : renderedKey; render(); }
  }, e => console.error(e));
}

function adoptMe(id) {
  meId = id;
  store.set('maison.me', id);
  keepCodeInUrl();
  watchProfile();
}

function rememberHouse(code, name) {
  const h = houses.find(x => x.code === code);
  if (h) { if (name && h.name !== name) h.name = name; }
  else houses.push({ code, name: name || '' });
  if (!fav || !houses.some(x => x.code === fav)) fav = code;
  saveHouses();
}

function enterHouse(code) {
  state.code = code;
  rememberHouse(code);
  store.set('maison.code', code);
  keepCodeInUrl();
  state.view = 'home'; state.lists = []; state.sections = []; state.items = []; state.house = null; state.members = [];
  seenItems.clear(); itemsPrimed = false; state.anim = 'first';
  subscribe();
  touchMember(true);
  render();
}

function createHouse(name) {
  const code = newCode();
  fire(setDoc(doc(db, 'households', code), { name: name.slice(0, 40), createdAt: Date.now() }));
  enterHouse(code);
  rememberHouse(code, name.slice(0, 40));
  setTimeout(openInviteSheet, 400);
}

// Retire la maison de cet iPhone (les listes restent en ligne pour les autres)
function forgetHouse(code) {
  houses = houses.filter(h => h.code !== code);
  if (fav === code) fav = houses[0]?.code || null;
  saveHouses();
  closeSheet();
  if (houses.length) { enterHouse(fav || houses[0].code); return; }
  unsubs.forEach(u => u()); unsubs = [];
  state.code = null; state.house = null;
  store.set('maison.code', null);
  keepCodeInUrl();
  render();
}
const leaveHouse = () => forgetHouse(state.code);

screen.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, v = n => (f.querySelector(`[name="${n}"]`)?.value || '').trim();
  const need = n => { const el = f.querySelector(`[name="${n}"]`); if (!el.value.trim()) { el.classList.add('err'); el.focus(); return true; } return false; };

  if (f.dataset.form === 'create') {
    if (need('house') || need('me')) return;
    state.myName = v('me').slice(0, 30); store.set('maison.name', state.myName);
    createHouse(v('house'));
  } else if (f.dataset.form === 'join') {
    const code = codeFrom(v('link'));
    if (!code) { const el = f.querySelector('[name="link"]'); el.classList.add('err'); el.focus(); toast('Ce lien ne semble pas valide.'); return; }
    if (need('me')) return;
    state.myName = v('me').slice(0, 30); store.set('maison.name', state.myName);
    enterHouse(code);
  } else if (f.dataset.form === 'name') {
    if (need('me')) return;
    state.myName = v('me').slice(0, 30); store.set('maison.name', state.myName);
    pushProfile();
    touchMember(true);
    renderedKey = ''; render();
  } else if (f.dataset.form === 'me') {
    const id = paramFrom(v('link'), 'moi');
    if (!id) { const el = f.querySelector('[name="link"]'); el.classList.add('err'); el.focus(); toast("Ce n'est pas un lien personnel valide."); return; }
    adoptMe(id);
    toast('Profil retrouvé, tes maisons arrivent…');
  }
});

const initial = name => (Array.from(String(name || '?').trim())[0] || '?').toUpperCase();
function avatarStack() {
  const ms = (state.members || []).filter(m => !m.removed);
  if (!ms.length) return ICON.people;
  const shown = ms.slice(0, 3).map(m => `<span class="avatar" style="--h:${hueOf(m.id)}">${esc(initial(m.name))}</span>`).join('');
  return `<span class="avatars">${shown}${ms.length > 3 ? `<span class="avatar more">+${ms.length - 3}</span>` : ''}</span>`;
}

function renderHome() {
  const cnt = {};
  for (const i of state.items) {
    const c = cnt[i.listId] || (cnt[i.listId] = { todo: 0, done: 0 });
    i.done ? c.done++ : c.todo++;
  }
  let h = `<header class="hometop"><div class="grow">
      ${state.myName ? `<div class="hello">Bonjour ${esc(state.myName)} 👋</div>` : ''}
      <button class="housebtn" data-action="houses" aria-label="Mes maisons"><h1>${esc(state.house?.name || 'Maison')}</h1><span class="caret">${ICON.down}</span></button>
      ${state.loading ? '<p class="sub">Chargement…</p>' : ''}</div>
      <div class="btns">
        <button class="iconbtn members-btn" data-action="members" aria-label="Membres">${avatarStack()}</button>
        <button class="iconbtn" data-action="settings" aria-label="Réglages">${ICON.gear}</button>
      </div></header>`;
  if (state.error) h += `<div class="banner">${esc(state.error)}</div>`;
  if (state.loading) return h;

  if (!state.lists.length) {
    return h + `<div class="card empty" style="margin-top:22px"><div style="font-size:40px">📝</div>
      <p>Aucune liste pour l'instant.</p>
      <button class="btn primary" data-action="newList">Créer ma première liste</button></div>`;
  }
  h += `<section class="grid">${state.lists.map((l, idx) => {
    const k = cnt[l.id] || { todo: 0, done: 0 };
    const meta = k.todo ? `${k.todo} à faire` : (k.done ? 'Tout est fait ✓' : 'Vide');
    return `<button class="lcard" style="--h:${hueOf(l.id)};--i:${idx}" data-action="open" data-id="${esc(l.id)}">
      <span class="lemo">${esc(l.emoji)}</span>
      <span class="lname">${esc(l.name)}</span>
      <span class="lmeta">${meta}</span></button>`;
  }).join('')}
    <button class="lcard add" style="--i:${state.lists.length}" data-action="newList"><span class="plus">+</span>Nouvelle liste</button>
  </section>`;
  return h;
}

function itemRow(i) {
  const mine = i.by ? i.by === meId : i.byName === state.myName;
  const by = i.byName && !mine ? `<div class="by">ajouté par ${esc(i.byName)}</div>` : '';
  return `<div class="irow ${i.done ? 'done' : ''} ${state.fresh.has(i.id) ? 'enter' : ''}">
    <button class="check ${i.done ? 'on' : ''}" data-action="toggle" data-id="${esc(i.id)}" aria-label="${i.done ? 'Décocher' : 'Cocher'}">${i.done ? ICON.check : ''}</button>
    <div class="itext" data-action="editItem" data-id="${esc(i.id)}">
      <div class="iline">${i.emoji ? `<span class="iemo">${esc(i.emoji)}</span>` : ''}<span class="ititle">${esc(i.title)}</span>${i.qty ? `<span class="qty">${esc(i.qty)}</span>` : ''}</div>
      ${i.note ? `<div class="note ${i.emoji ? 'indent' : ''}">${esc(i.note)}</div>` : ''}
      ${by}
    </div>
  </div>`;
}

const group = (head, items, cls = '') => `<section class="grp"><div class="grp-h ${cls}">${head}<span class="n">${items.length}</span></div>
  <div class="card">${items.map(itemRow).join('')}</div></section>`;

function renderListHead(l) {
  return `<div class="topbar">
      <button class="back" data-action="back">${ICON.back}Listes</button>
      <button class="iconbtn" data-action="listMenu" aria-label="Modifier la liste">${ICON.more}</button>
    </div>
    <header class="ltitle"><span class="tile">${esc(l.emoji)}</span><div class="grow"><h1 style="font-size:30px">${esc(l.name)}</h1></div></header>`;
}

function renderList(l) {
  const its = state.items.filter(i => i.listId === l.id);
  const todo = its.filter(i => !i.done), done = its.filter(i => i.done);
  const secs = sectionsOf(l.id), secIds = new Set(secs.map(s => s.id));
  let h = '';

  if (!todo.length) {
    h += `<section class="sec"><div class="card"><div class="pad muted">${
      done.length ? 'Plus rien à faire ici.' : 'Ajoute un premier élément juste au-dessus.'}</div></div></section>`;
  } else {
    const groups = secs.map(s => ({ s, items: todo.filter(i => i.sectionId === s.id) })).filter(g => g.items.length);
    const loose = todo.filter(i => !secIds.has(i.sectionId));
    if (!groups.length) h += `<section class="sec"><div class="card">${loose.map(itemRow).join('')}</div></section>`;
    else {
      for (const g of groups) h += group(`<span class="e">${esc(g.s.emoji)}</span>${esc(g.s.name)}`, g.items);
      if (loose.length) h += group('Sans catégorie', loose, 'soft');
    }
  }
  if (done.length) {
    h += `<section class="grp" style="margin-top:30px"><div class="grp-h soft">Cochés<span class="n">${done.length}</span>
        <button class="link act" data-action="clearDone">Tout effacer</button></div>
      <div class="card">${done.map(itemRow).join('')}</div></section>`;
  }
  return h;
}

function renderSecChips(l) {
  const n = sectionsOf(l.id).length;
  secChips.innerHTML =
    `<button type="button" class="chip" data-sec-manage>🏷️ Catégories${n ? ` (${n})` : ''}</button>` +
    `<button type="button" class="chip add" data-sec-new>+ Ajouter une catégorie</button>`;
}

function render() {
  let key;
  if (!configured) key = 'setup';
  else if (!state.code) key = 'welcome';
  else if (state.houseMissing) key = 'missing';
  else if (!state.myName) key = 'askName';
  else key = 'app';

  composer.hidden = true; fab.hidden = true;

  if (key !== 'app') {
    body.innerHTML = '';
    // Ces écrans contiennent des champs : on ne les redessine que si l'écran change.
    if (renderedKey !== key) {
      screen.innerHTML = key === 'setup' ? renderSetup() : key === 'welcome' ? renderWelcome()
        : key === 'missing' ? renderMissing() : renderAskName();
      renderedKey = key;
    }
    const hn = $('#houseName');
    if (hn && state.house?.name) hn.textContent = state.house.name;
    return;
  }
  renderedKey = 'app';

  const list = currentList();
  if (state.view === 'list' && !list && !state.loading) state.view = 'home';
  const inList = state.view === 'list' && list;
  const anim = state.loading ? '' : (state.anim ? 'anim-' + state.anim : '');
  if (!state.loading) state.anim = null;
  if (inList) {
    const hue = hueOf(list.id);
    screen.innerHTML = `<div class="view ${anim}" style="--h:${hue}">${renderListHead(list)}</div>`;
    body.innerHTML = `<div class="view ${anim}" style="--h:${hue}">${renderList(list)}</div>`;
    composer.classList.add('view');
    composer.style.setProperty('--h', hue);
    composer.hidden = false;
    renderSecChips(list);
  } else {
    screen.innerHTML = `<div class="${anim}">${renderHome()}</div>`;
    body.innerHTML = '';
  }
  state.fresh = new Set();
  updateStuck();
}

function updateStuck() {
  if (composer.hidden) return;
  composer.classList.toggle('stuck', composer.getBoundingClientRect().top <= 1);
}
window.addEventListener('scroll', updateStuck, { passive: true });

function go(view, listId) {
  state.anim = view === 'list' ? 'in' : 'back';
  state.view = view;
  if (listId) state.listId = listId;
  render();
  window.scrollTo(0, 0);
}

// ================== Écritures ==================
function toggle(id) {
  const it = state.items.find(i => i.id === id);
  if (it) fire(updateDoc(ref('items', id), { done: !it.done }));
}
function clearDone() {
  const b = writeBatch(db);
  state.items.filter(i => i.listId === state.listId && i.done).forEach(i => b.delete(ref('items', i.id)));
  fire(b.commit());
}
function deleteSection(id) {
  const b = writeBatch(db);
  state.items.filter(i => i.sectionId === id).forEach(i => b.update(ref('items', i.id), { sectionId: null }));
  b.delete(ref('sections', id));
  fire(b.commit());
}
function deleteList(id) {
  const b = writeBatch(db);
  state.items.filter(i => i.listId === id).forEach(i => b.delete(ref('items', i.id)));
  sectionsOf(id).forEach(s => b.delete(ref('sections', s.id)));
  b.delete(ref('lists', id));
  fire(b.commit());
  closeSheet(); go('home');
}
function addSection(listId, name, emoji) {
  const r = doc(col('sections'));
  fire(setDoc(r, { listId, name, emoji, createdAt: Date.now() }));
  return r.id;
}

// Glisser la fenêtre vers le bas pour la fermer
(() => {
  let y0 = null, dy = 0;
  sheet.addEventListener('touchstart', e => {
    if (sheet.scrollTop > 0 || e.target.closest('input, textarea, .emo-grid, .dd-list')) { y0 = null; return; }
    y0 = e.touches[0].clientY; dy = 0; sheet.style.transition = 'none';
  }, { passive: true });
  sheet.addEventListener('touchmove', e => {
    if (y0 === null) return;
    dy = Math.max(0, e.touches[0].clientY - y0);
    sheet.style.transform = dy ? `translateY(${dy}px)` : '';
  }, { passive: true });
  sheet.addEventListener('touchend', () => {
    if (y0 === null) return;
    sheet.style.transition = 'transform .2s ease';
    if (dy > 90) closeSheet(); else sheet.style.transform = '';
    y0 = null;
  });
})();

      <div class="label">Commentaire</div>
      <textarea class="field note-field" name="note" maxlength="500" rows="3" placeholder="Des détails, une précision… (ex. la marque, où ranger, comment faire)">${esc(item.note)}</textarea>
      <div class="label">Quantité</div>
      <input class="field" name="qty" maxlength="30" placeholder="ex. 2, 500 g, 5 vis, 1 kilo…" value="${esc(item.qty)}" autocomplete="off">
      <div class="label">Catégorie</div>
      <div class="dd" data-dd>
        <button type="button" class="dd-btn" data-dd-toggle><span class="v" data-dd-label>${ddLabel()}</span>${ICON.down}</button>
        <div class="dd-panel" hidden>
          <input class="field dd-search" data-dd-search type="search" placeholder="Rechercher ou créer une catégorie…" autocomplete="off" enterkeyhint="done">
          <div class="dd-list" data-dd-list></div>
        </div>
      </div>
      ${actions('Enregistrer')}
    </form>
    <div class="sep" style="margin-bottom:16px"></div>
    <button type="button" class="btn danger full" data-delete-item>Supprimer l'élément</button>`);
}

function setEmoji(e) {
  sheetEmoji = e || null;
  const big = sheet.querySelector('[data-emo-toggle]');
  if (big) { big.textContent = e || '＋'; big.classList.toggle('none', !e); }
  sheet.querySelectorAll('[data-emo]').forEach(b => b.classList.toggle('on', b.dataset.emo === e));
}

async function copyInvite() {
  try { await navigator.clipboard.writeText(inviteUrl()); toast('Lien copié.'); }
  catch (_) { toast('Sélectionne le lien et copie-le.'); }
}

overlay.addEventListener('click', e => {
  const t = e.target;
  if (t === overlay || t.closest('[data-close]')) return closeSheet();

  const emo = t.closest('[data-emo]');
  if (emo) return setEmoji(emo.dataset.emo);
  if (t.closest('[data-emo-none]')) return setEmoji(null);
  if (t.closest('[data-emo-toggle]')) { sheet.querySelector('.emo-wrap')?.toggleAttribute('hidden'); return; }

  if (t.closest('[data-dd-toggle]')) return setDdOpen(sheet.querySelector('.dd-panel')?.hidden);
  const opt = t.closest('[data-dd-opt]');
  if (opt) return chooseSection(opt.dataset.ddOpt);
  if (t.closest('[data-dd-create]')) {
    const name = (sheet.querySelector('[data-dd-search]')?.value || '').trim().slice(0, 40);
    if (!name) return;
    sheetSec = addSection(sheetListId, name, '🏷️');
    sheet.querySelector('[data-dd-label]').innerHTML = `<span class="e">🏷️</span>${esc(name)}`;
    return setDdOpen(false);
  }

  if (t.closest('[data-share]')) {
    navigator.share({ title: 'Maison', text: `Rejoins la maison « ${state.house?.name || 'Maison'} » pour partager nos listes :`, url: inviteUrl() }).catch(() => {});
    return;
  }
  if (t.closest('[data-copy]')) return copyInvite();
  if (t.closest('[data-leave]')) return leaveHouse();

  if (t.closest('[data-share-me]')) {
    navigator.share({ title: 'Maison', text: 'Mon lien personnel Maison (à ouvrir sur mon autre appareil) :', url: meUrl() }).catch(() => {});
    return;
  }
  if (t.closest('[data-copy-me]')) {
    navigator.clipboard.writeText(meUrl()).then(() => toast('Lien copié.'), () => toast('Sélectionne le lien et copie-le.'));
    return;
  }
  const go = t.closest('[data-go]');
  if (go) { closeSheet(); if (go.dataset.go !== state.code) enterHouse(go.dataset.go); return; }
  const favBtn = t.closest('[data-fav]');
  if (favBtn) { fav = favBtn.dataset.fav; saveHouses(); openHousesSheet(); toast('Maison favorite enregistrée.'); return; }
  if (t.closest('[data-open-create]')) return openCreateHouseSheet();
  if (t.closest('[data-open-invite]')) return openInviteSheet();
  const kick = t.closest('[data-kick]');
  if (kick) {
    if (!kick.classList.contains('sure')) { kick.classList.add('sure'); kick.textContent = 'Confirmer'; return; }
    fire(updateDoc(ref('members', kick.dataset.kick), { removed: true, removedAt: Date.now(), removedBy: state.myName }));
    toast('Personne retirée de la maison.');
    return;
  }
  const unkick = t.closest('[data-unkick]');
  if (unkick) { fire(updateDoc(ref('members', unkick.dataset.unkick), { removed: false })); return; }
  if (t.closest('[data-open-join]')) return openJoinHouseSheet();

  if (t.closest('[data-sec-new]')) return openSectionSheet(null);
  const edit = t.closest('[data-sec-edit]');
  if (edit) { const s = state.sections.find(x => x.id === edit.dataset.secEdit); if (s) openSectionSheet(s); return; }

  const delSec = t.closest('[data-del-sec]');
  if (delSec) {
    deleteSection(delSec.dataset.delSec);
    delSec.closest('.srow')?.remove();
    toast('Catégorie supprimée. Ses éléments sont gardés.');
    return;
  }
  const delSecSure = t.closest('[data-del-sec-sure]');
  if (delSecSure) {
    if (!delSecSure.classList.contains('sure')) { delSecSure.classList.add('sure'); delSecSure.textContent = 'Confirmer la suppression'; }
    else { deleteSection(delSecSure.dataset.delSecSure); closeSheet(); toast('Catégorie supprimée. Ses éléments sont gardés.'); }
    return;
  }
  const delList = t.closest('[data-delete-list]');
  if (delList) {
    if (!delList.classList.contains('sure')) { delList.classList.add('sure'); delList.textContent = 'Confirmer : supprimer la liste et tout son contenu'; }
    else deleteList(state.listId);
    return;
  }
  if (t.closest('[data-delete-item]')) {
    const id = sheetTarget; closeSheet();
    fire(deleteDoc(ref('items', id)));
  }
});

overlay.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('[data-dd-search]')) {
    e.preventDefault();
    sheet.querySelector('[data-dd-list] .dd-opt')?.click();
  }
});
overlay.addEventListener('input', e => {
  if (e.target.matches('[data-dd-search]')) return renderDdList();
  if (e.target.matches('[data-emo-custom]')) { const g = firstGrapheme(e.target.value); if (g) setEmoji(g); }
  e.target.classList?.remove('err');
});

overlay.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;

  if (f.dataset.form === 'joinHouse') {
    const el = f.querySelector('[name="link"]');
    const code = codeFrom(el.value);
    if (!code) { el.classList.add('err'); el.focus(); toast('Ce lien ne semble pas valide.'); return; }
    closeSheet(); enterHouse(code);
    return;
  }

  const field = f.querySelector('[name="name"], [name="title"], [name="house"]');
  const value = (field?.value || '').trim();
  if (!value) { field?.classList.add('err'); field?.focus(); return; }

  if (f.dataset.form === 'createHouse') { closeSheet(); createHouse(value); return; }

  switch (f.dataset.form) {
    case 'newList': {
      const r = doc(col('lists'));
      fire(setDoc(r, { name: value.slice(0, 60), emoji: sheetEmoji, createdAt: Date.now() }));
      closeSheet(); go('list', r.id);
      break;
    }
    case 'editList': {
      const l = state.lists.find(x => x.id === sheetTarget), name = value.slice(0, 60);
      if (l && (l.name !== name || l.emoji !== sheetEmoji)) fire(updateDoc(ref('lists', l.id), { name, emoji: sheetEmoji }));
      closeSheet(); break;
    }
    case 'newSec': {
      addSection(state.listId, value.slice(0, 40), sheetEmoji);
      closeSheet(); toast('Catégorie créée. Touche un élément pour l\'y ranger.'); break;
    }
    case 'editSec': {
      const s = state.sections.find(x => x.id === sheetTarget), name = value.slice(0, 40);
      if (s && (s.name !== name || s.emoji !== sheetEmoji)) fire(updateDoc(ref('sections', s.id), { name, emoji: sheetEmoji }));
      closeSheet(); break;
    }
    case 'editItem': {
      const it = state.items.find(x => x.id === sheetTarget), title = value.slice(0, 200);
      const qty = (f.querySelector('[name="qty"]')?.value || '').trim().slice(0, 30);
      const emoji = sheetEmoji || null;
      const note = (f.querySelector('[name="note"]')?.value || '').trim().slice(0, 500);
      if (it && (it.title !== title || (it.sectionId || null) !== sheetSec || (it.emoji || null) !== emoji || it.qty !== qty || it.note !== note)) {
        fire(updateDoc(ref('items', it.id), { title, sectionId: sheetSec, emoji, qty, note }));
      }
      closeSheet(); break;
    }
    case 'settings': {
      const me = (f.querySelector('[name="me"]').value || '').trim().slice(0, 30);
      if (me) { state.myName = me; store.set('maison.name', me); pushProfile(); touchMember(true); }
      const house = value.slice(0, 40);
      if (house !== state.house?.name) fire(updateDoc(houseRef(), { name: house }));
      closeSheet(); render(); break;
    }
  }
});

document.addEventListener('keydown', e => { if (e.key === 'Escape' && !overlay.hidden) closeSheet(); });

// ================== Interactions ==================
const pendingToggle = new Set();
app.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const id = el.dataset.id;
  switch (el.dataset.action) {
    case 'open': go('list', id); break;
    case 'back': go('home'); break;
    case 'toggle': {
      const it = state.items.find(i => i.id === id);
      if (!it || pendingToggle.has(id)) break;
      if (!it.done) {
        // petite animation avant de passer dans « Cochés »
        pendingToggle.add(id);
        el.classList.add('on'); el.innerHTML = ICON.check;
        el.closest('.irow')?.classList.add('checking');
        setTimeout(() => { pendingToggle.delete(id); toggle(id); }, 300);
      } else toggle(id);
      break;
    }
    case 'editItem': { const it = state.items.find(i => i.id === id); if (it) openItemSheet(it); break; }
    case 'clearDone': clearDone(); break;
    case 'listMenu': { const l = currentList(); if (l) openListSheet(l); break; }
    case 'newList': openListSheet(null); break;
    case 'invite': openInviteSheet(); break;
    case 'members': openMembersSheet(); break;
    case 'settings': openSettingsSheet(); break;
    case 'leave': leaveHouse(); break;
    case 'houses': openHousesSheet(); break;
  }
});
app.addEventListener('input', e => e.target.classList?.remove('err'));

fab.addEventListener('click', () => openListSheet(null));

secChips.addEventListener('mousedown', e => { if (document.activeElement === input) e.preventDefault(); });
secChips.addEventListener('click', e => {
  if (e.target.closest('[data-sec-new]')) return openSectionSheet(null);
  if (e.target.closest('[data-sec-manage]')) return openSectionsSheet();
});

$('#composerForm').addEventListener('submit', e => {
  e.preventDefault();
  const title = input.value.trim().slice(0, 200);
  if (!title || !state.listId) return;
  input.value = ''; input.focus();
  fire(setDoc(doc(col('items')), { listId: state.listId, sectionId: null, title, done: false, createdAt: Date.now(), byName: state.myName, by: meId }));
});

// ================== Démarrage ==================
if (configured) {
  // Ton identité : celle du lien personnel ouvert, sinon celle de cet appareil, sinon une nouvelle.
  const meFromUrl = paramFrom(location.search, 'moi') || paramFrom(location.hash, 'moi');
  if (meFromUrl) { meId = meFromUrl; store.set('maison.me', meId); }
  if (!meId) { meId = newCode(); store.set('maison.me', meId); }
  watchProfile();

  const fromUrl = codeFrom(location.search) || codeFrom(location.hash);
  // Nouveau lien d'invitation → on ouvre cette maison. Sinon → la maison favorite.
  const isNewInvite = fromUrl && !houses.some(h => h.code === fromUrl);
  const code = isNewInvite ? fromUrl : (fav || houses[0]?.code || fromUrl);
  if (code) enterHouse(code);
}
render();
</script>
</body>
</html>
