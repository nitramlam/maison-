// ================== Résumé du jour (accueil) ==================
function relDay(date) {
  const diff = Math.round((fromYmd(date) - fromYmd(todayYmd())) / 864e5);
  if (diff === 1) return 'demain';
  if (diff === 2) return 'après-demain';
  return fromYmd(date).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric' });
}
function todayWidget() {
  const now = new Date(), today = todayYmd();
  const in7 = ymd(new Date(now.getFullYear(), now.getMonth(), now.getDate() + 7));
  const evToday = state.events.filter(e => !isBirthday(e) && occursOn(e, today)).sort(evSort);
  const tomorrow = addDays(today, 1);
  const next = state.events.map(e => ({ ...e, _on: e.repeat ? nextOccurrence(e, tomorrow) : (e.date > today ? e.date : null) }))
    .filter(e => e._on && e._on <= in7).sort((a, b) => a._on < b._on ? -1 : a._on > b._on ? 1 : evSort(a, b));
  const hl = (e, inner) => (e.people || []).length ? `<span class="hl" style="background:${peopleGrad(e.people, .32)}">${inner}</span>` : inner;
  const line = (e, when) => `<div class="tdline">${hl(e, `${e.emoji ? esc(e.emoji) + ' ' : ''}${esc(e.title)}`)}<small>${when}</small></div>`;
  let body;
  if (evToday.length) {
    body = evToday.slice(0, 2).map(e => line(e, e.allDay ? 'Journée' : esc(e.time))).join('')
      + (evToday.length > 2 ? `<div class="tdmore">+ ${evToday.length - 2} autre${evToday.length - 2 > 1 ? 's' : ''}</div>` : '');
  } else if (next.length) {
    body = `<div class="tdnone">Rien aujourd'hui</div>` + line(next[0], relDay(next[0]._on));
  } else body = `<div class="tdnone">Rien de prévu 🌿</div>`;
  return `<div class="homerow sec">
    <div class="card todaycard tdsmall" role="button" tabindex="0" data-action="goCal">
      <div class="tdhead">
        <span class="tdcal"><small>${now.toLocaleDateString('fr-FR', { month: 'short' }).replace('.', '')}</small><b>${now.getDate()}</b></span>
        <div class="grow"><div class="tdtitle">${cap(now.toLocaleDateString('fr-FR', { weekday: 'long' }))}</div></div>
      </div>
      <div class="tdbody">${body}</div>
    </div>
    ${weatherCard()}
    ${birthdayCard()}
    ${periodHomeCard()}
  </div>`;
}
// ================== Anniversaires (à part du calendrier) ==================
function birthdays() {
  const arr = Array.isArray(state.house?.birthdays) ? state.house.birthdays : [];
  return arr.filter(x => x && typeof x.name === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(x.date || ''))
    .map(x => ({ id: String(x.id || x.name), name: x.name.slice(0, 40), date: x.date, noYear: x.noYear === true }));
}
function bdNext(b, from) {     // prochaine date (>= from) de l'anniversaire
  const fy = Number(from.slice(0, 4));
  for (let y = fy; y <= fy + 1; y++) {
    let md = b.date.slice(5);
    const leap = (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
    if (md === '02-29' && !leap) md = '02-28';
    const d = `${y}-${md}`;
    if (d >= from) return d;
  }
  return null;
}

  const c = Number(code);
  const kind = c === 0 ? 'clear' : (c === 1 || c === 2) ? 'partly' : c === 3 ? 'cloudy' : (c === 45 || c === 48) ? 'fog'
    : (c >= 95) ? 'storm' : ((c >= 71 && c <= 77) || c === 85 || c === 86) ? 'snow' : (c >= 51 && c <= 67) || (c >= 80 && c <= 82) ? 'rain' : 'cloudy';
  const sky = day ? '<span class="wa-sun">☀️</span>' : '<span class="wa-moon">🌙</span>';
  const cloud = (cls = '') => `<span class="wa-cloud ${cls}">☁️</span>`;
  const drops = n => Array.from({ length: n }, (_, i) => `<i class="wa-drop" style="--i:${i}"></i>`).join('');
  const flakes = n => Array.from({ length: n }, (_, i) => `<i class="wa-flake" style="--i:${i}">❄</i>`).join('');
  const inner = {
    clear: sky,
    partly: sky.replace('class="', 'class="small ') + cloud('front'),
    cloudy: cloud('back') + cloud('front'),
    fog: cloud('back') + '<i class="wa-fog" style="--i:0"></i><i class="wa-fog" style="--i:1"></i><i class="wa-fog" style="--i:2"></i>',
    rain: cloud('top') + drops(4),

  return `<span class="wxa ${kind}" aria-hidden="true">${inner}</span>`;
}

function moodStats(m) {

// ================== Règles : suivi des cycles (privé ou partagé avec la maison) ==================
// Un suivi = { id, name, periods:[{ id, start, end|null, flow, days:{ymd:flow} }] }
// Privé : dans le profil (users/{moi}.cycles) — Partagé : dans la fiche membre de la maison (members/{auteur}.cycles), modifiable par tous.
const FLOWS = [['petit', 'Petit'], ['moyen', 'Moyen'], ['fort', 'Fort']];
const FLOW_LABEL = { petit: 'Petit', moyen: 'Moyen', fort: 'Fort' };
const cleanFlow = f => FLOW_LABEL[f] ? f : 'moyen';
const isYmd = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
function cleanTrackers(arr) {
  return (Array.isArray(arr) ? arr : []).filter(t => t && typeof t.id === 'string').slice(0, 12).map(t => ({
    id: t.id, name: str(t.name, 'Moi').slice(0, 30),
    periods: (Array.isArray(t.periods) ? t.periods : []).filter(p => p && isYmd(p.start)).map(p => ({
      id: String(p.id || p.start), start: p.start, end: isYmd(p.end) && p.end >= p.start ? p.end : null, flow: cleanFlow(p.flow),
      days: p.days && typeof p.days === 'object' ? Object.fromEntries(Object.entries(p.days).filter(([k, v]) => isYmd(k) && FLOW_LABEL[v])) : {}
    })).sort((a, b) => a.start < b.start ? 1 : -1).slice(0, 40)
  }));
}
// Tous les suivis visibles : les miens (privés) + ceux partagés dans la maison
function allTrackers() {
  const mine = cleanTrackers(state.profile?.cycles).map(t => ({ ...t, owner: null }));
  const shared = [];
  for (const m of state.members || []) for (const t of m.cycles || []) shared.push({ ...t, owner: m.id });
  return [...mine, ...shared];
}
function saveTracker(t, remove) {
  const strip = x => ({ id: x.id, name: x.name, periods: x.periods });
  if (!t.owner) {
    const list = cleanTrackers(state.profile?.cycles).filter(x => x.id !== t.id);
    if (!remove) list.push(strip(t));
    if (state.profile) state.profile.cycles = list;
    fire(updateDoc(userRef(), { cycles: list }));
  } else {
    const m = (state.members || []).find(x => x.id === t.owner);
    const list = (m?.cycles || []).filter(x => x.id !== t.id);
    if (!remove) list.push(strip(t));
    if (m) m.cycles = list;
    fire(updateDoc(ref('members', t.owner), { cycles: list.map(strip) }));
  }
  renderedKey = ''; render();
}
const findTracker = id => allTrackers().find(t => t.id === id);
// Statistiques et prévision
function cycleStats(t) {
  const ps = [...t.periods].sort((a, b) => a.start < b.start ? -1 : 1);
  const today = todayYmd();
  const cycles = [];
  for (let i = 1; i < ps.length; i++) { const d = dayDiff(ps[i - 1].start, ps[i].start); if (d >= 15 && d <= 60) cycles.push(d); }
  const durs = ps.filter(p => p.end).map(p => dayDiff(p.start, p.end) + 1);
  const avg = a => a.length ? Math.round(a.slice(-6).reduce((x, y) => x + y, 0) / Math.min(a.length, 6)) : 0;
  // Moyenne pondérée des 6 derniers cycles : les plus récents comptent plus
  const recent = cycles.slice(-6);
  const wsum = recent.reduce((t, _, i) => t + i + 1, 0);
  const cycle = recent.length ? Math.round(recent.reduce((t, c, i) => t + c * (i + 1), 0) / wsum) : 0;
  const dur = avg(durs) || 5;
  // Écart (variabilité) : sert à donner une fourchette
  const sd = recent.length >= 2 ? Math.sqrt(recent.reduce((t, c) => t + (c - cycle) ** 2, 0) / recent.length) : 0;
  const spread = recent.length >= 2 ? Math.min(7, Math.max(1, Math.round(sd))) : 3;
  const estimate = !cycle;                // pas encore assez de données : 28 jours par défaut
  const useCycle = cycle || 28;
  const current = ps.find(p => !p.end) || null;
  const last = ps[ps.length - 1];
  let next = null, late = 0;
  if (last) {
    next = addDays(last.start, useCycle);
    const over = dayDiff(next, today);
    // Pas encore arrivées alors qu'elles étaient prévues (jusqu'à 10 j) : on signale le retard
    if (!current && over > 0 && over <= 10) late = over;
    else while (next < (current ? addDays(today, 1) : today)) next = addDays(next, useCycle);
  }
  return { cycle, useCycle, dur, current, next, spread, estimate, late, regular: recent.length >= 2 && sd <= 3, n: recent.length,
           day: current ? dayDiff(current.start, today) + 1 : 0 };
}
const dayFlow = (p, d) => p.days[d] || p.flow;
const relIn = d => { const n = dayDiff(todayYmd(), d); return n === 0 ? "aujourd'hui" : n === 1 ? 'demain' : n < 0 ? `il y a ${-n} j` : `dans ${n} j`; };
// Faux événements pour le calendrier (non enregistrés)
function periodEvents() {
  const out = [], today = todayYmd();
  for (const t of allTrackers()) {
    const st = cycleStats(t), who = t.name;
    for (const p of t.periods) out.push({ id: 'period-' + t.id + '-' + p.id, title: `Règles · ${who}`, emoji: '🩸', date: p.start, endDate: p.end || (today > p.start ? today : ''),
      allDay: true, time: '', end: '', note: p.end ? '' : 'En cours', byName: '', people: [], repeat: '', _period: t.id });
    if (st.next) out.push({ id: 'period-' + t.id + '-next', title: `Règles prévues · ${who}${st.estimate ? ' (estimation)' : ''}`, emoji: '🩸', date: st.next, endDate: addDays(st.next, st.dur - 1),
      allDay: true, time: '', end: '', note: 'Prévision', byName: '', people: [], repeat: '', _period: t.id });
  }
  return out;
}
// Bandeau de l'accueil : règles en cours ou prévues dans les 3 jours
function reglesTileText() {
  const ts = allTrackers();
  if (!ts.length) return 'Suivi des cycles';
  return ts.slice(0, 2).map(t => { const st = cycleStats(t);
    return esc(t.name) + ' · ' + (st.current ? `jour ${st.day}` : st.late ? `en retard de ${st.late} j` : st.next ? relIn(st.next) : 'rien d\'enregistré'); }).join(' · ');
}
function periodHomeCard() {
  const lines = [];
  for (const t of allTrackers()) {
    const st = cycleStats(t);
    if (st.current) lines.push(`${esc(t.name)} : règles, jour ${st.day}`);
    else if (st.next && dayDiff(todayYmd(), st.next) <= 3) lines.push(`${esc(t.name)} : règles prévues ${relIn(st.next)}`);
  }
  if (!lines.length) return '';
  return `<button type="button" class="card bdaycard pdhome" data-go-tab="regles"><span class="bdic">🩸</span><span class="grow"><b>Règles</b>
    <small>${lines.join(' · ')}</small></span><span class="chev">${ICON.chev}</span></button>`;
}
function predictBox(st) {
  const from = addDays(st.next, -st.spread), to = addDays(st.next, st.spread);
  return `<div class="pdpred">
    <small>${st.late ? `En retard de ${st.late} jour${st.late > 1 ? 's' : ''} sur la prévision` : 'Prochaines règles prévues'}</small>
    <b>${st.late ? 'Bientôt' : cap(relIn(st.next))}</b>
    <span>vers le <b>${fmtShort(st.next)}</b> · entre le ${fmtShort(from)} et le ${fmtShort(to)}</span>
    <em>${st.estimate ? 'Estimation sur un cycle de 28 jours : elle deviendra précise après les prochaines règles.'
      : `Calculé sur ${st.n} cycle${st.n > 1 ? 's' : ''} (moyenne de ${st.cycle} jours, les plus récents comptent plus).`}</em></div>`;
}
function flowDots(p) {
  const end = p.end || todayYmd(), n = Math.min(dayDiff(p.start, end) + 1, 14), out = [];
  for (let i = 0; i < n; i++) out.push(`<i class="fd ${dayFlow(p, addDays(p.start, i))}"></i>`);
  return `<span class="fdots">${out.join('')}</span>`;
}
function renderRegles() {
  const ts = allTrackers();
  let h = '';
  if (!ts.length) {
    h += `<div class="card pad pdintro"><div class="pdbig">🩸</div><b>Suis les règles de quelqu'un</b>
      <p class="hint">Pour toi ou pour une autre personne. Privé par défaut ; tu peux aussi le partager avec la maison pour que tout le monde y pense.</p>

    if (st.current) {

    } else {

    }
    if (st.cycle || t.periods.some(p => p.end)) h += `<div class="pdstats"><span><b>${st.dur} j</b><small>durée moyenne</small></span><span><b>${st.cycle ? st.cycle + ' j' : '—'}</b><small>cycle moyen</small></span>${st.n >= 2 ? `<span><b>${st.regular ? 'Régulier' : '± ' + st.spread + ' j'}</b><small>${st.regular ? 'cycle' : 'variation'}</small></span>` : ''}</div>`;
    if (t.periods.length) h += `<div class="pdhist">${t.periods.slice(0, 8).map(p => {

      return `<button type="button" class="exrow" data-pd-period="${esc(p.id)}" data-t="${esc(t.id)}"><span class="grow"><b>${fmtShort(p.start)}${p.end ? ' → ' + fmtShort(p.end) : ' · en cours'}</b>
        <small>${n} jour${n > 1 ? 's' : ''} · flux ${FLOW_LABEL[p.flow].toLowerCase()}</small></span>${flowDots(p)}<span class="pdedit">✏️</span></button>`; }).join('')}<p class="hint pdhint">Touche une ligne pour la modifier ou la supprimer.</p></div>`;
    h += `</section>`;
  }
  h += `<button type="button" class="link" data-pd-newtracker style="display:block;margin:6px auto 30px">＋ Suivre une autre personne</button>`;
  return h;
}

document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-pd-newtracker]')) { openTrackerSheet(null); return; }
  const th = t.closest('[data-pd-tracker]'); if (th) { const x = findTracker(th.dataset.pdTracker); if (x) openTrackerSheet(x); return; }
  const ps = t.closest('[data-pd-start]'); if (ps) { const x = findTracker(ps.dataset.pdStart); if (x) openPeriodSheet(x, null); return; }
  const pp = t.closest('[data-pd-period]'); if (pp) { const x = findTracker(pp.dataset.t), p = x?.periods.find(y => y.id === pp.dataset.pdPeriod); if (p) openPeriodSheet(x, p); return; }
  const fl = t.closest('[data-pd-flow]');
  if (fl) { const x = findTracker(fl.dataset.t), st = x && cycleStats(x); if (!st?.current) return;
    st.current.days = { ...st.current.days, [todayYmd()]: fl.dataset.pdFlow }; saveTracker(x); return; }
  const en = t.closest('[data-pd-end]');
  if (en) { const x = findTracker(en.dataset.pdEnd), st = x && cycleStats(x); if (!st?.current) return;

    const sp = t.closest('[data-pd-step]'); if (sp) { const i = sheet.querySelector('[name="dur"]'); i.value = Math.min(15, Math.max(1, (parseInt(i.value) || 1) + Number(sp.dataset.pdStep))); return; }

});

document.addEventListener('submit', e => {

// L'iPhone garde souvent l'ancienne page en mémoire : on vérifie s'il existe une version plus récente et on recharge.
const APP_VERSION = '20 nov. 18 h 30';
let updChecking = false, updLast = 0;
async function checkUpdate() {
  if (updChecking || Date.now() - updLast < 60 * 1000 || !navigator.onLine) return;
  updChecking = true; updLast = Date.now();
  try {
    const r = await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' });
    if (r.ok) {
      const txt = await r.text();
      const m = txt.match(/const APP_VERSION = '([^']+)'/);
      if (m && m[1] !== APP_VERSION && !sheetKind && !rec.on) {
        toast('Nouvelle version, mise à jour…');
        setTimeout(() => location.reload(), 900);
      }
    }
  } catch (_) {}
  updChecking = false;
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });

const pad2 = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const fromYmd = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const todayYmd = () => ymd(new Date());

  || ((a.allDay ? 0 : 1) - (b.allDay ? 0 : 1)) || String(a.time).localeCompare(String(b.time));
const evTime = e => e.allDay ? 'Journée' : (e.time || '') + (e.end ? `<small>${e.end}</small>` : '');

function eventCard(e, showDate) {

// ----- Événements : on ne garde en direct que les 2 derniers mois et le futur -----
function evFromDoc(d) {
  const v = d.data();
  return { id: d.id, title: str(v.title, 'Sans titre'), emoji: typeof v.emoji === 'string' && v.emoji ? v.emoji : null,
               date: typeof v.date === 'string' ? v.date : '', allDay: v.allDay !== false, time: typeof v.time === 'string' ? v.time : '',
               end: typeof v.end === 'string' ? v.end : '', note: typeof v.note === 'string' ? v.note : '', byName: typeof v.byName === 'string' ? v.byName : '',
               people: Array.isArray(v.people) ? v.people.filter(x => typeof x === 'string') : [],
               endDate: typeof v.endDate === 'string' && v.endDate > (v.date || '') ? v.endDate : '', repeat: REPEATS.includes(v.repeat) ? v.repeat : '' };
    }
// ----- Plusieurs jours / répétition (semaine, mois, année) -----
const REPEATS = ['week', 'month', 'year'];
const REPEAT_LABEL = { week: 'Chaque semaine', month: 'Chaque mois', year: 'Chaque année' };
const addDays = (s, n) => { const d = fromYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const dayDiff = (a, b) => Math.round((fromYmd(b) - fromYmd(a)) / 86400000);
const lastDayOf = (y, m) => new Date(y, m, 0).getDate();   // m : 1..12
// Est-ce qu'une répétition commence ce jour-là ?
function startsOn(e, day) {
  if (day < e.date) return false;
  if (!e.repeat) return day === e.date;
  if (e.repeat === 'week') return dayDiff(e.date, day) % 7 === 0;
  const [, , d0] = e.date.split('-').map(Number), [y, m, d] = day.split('-').map(Number);
  const want = Math.min(d0, lastDayOf(y, m));   // 31 → dernier jour du mois, 29 févr. → 28
  if (e.repeat === 'month') return d === want;
  return m === Number(e.date.slice(5, 7)) && d === want;
}
function occursOn(e, day) {
  if (!e.repeat) return day >= e.date && day <= (e.endDate || e.date);
  const len = e.endDate ? Math.min(dayDiff(e.date, e.endDate), 30) : 0;
  for (let k = 0; k <= len; k++) if (startsOn(e, addDays(day, -k))) return true;
  return false;
}
function nextOccurrence(e, from) {   // première date >= from où l'événement a lieu
  if (!e.repeat) return (e.endDate || e.date) >= from ? (e.date >= from ? e.date : from) : null;
  let d = e.date > from ? e.date : from;
  for (let i = 0; i < 370; i++, d = addDays(d, 1)) if (startsOn(e, d)) return d;
  return null;
}
const isBirthday = () => false;
function ageOn(e, day) {
  const by = Number(e.date.slice(0, 4)), y = Number(day.slice(0, 4));
  return by > 1900 && y - by > 0 && y - by < 130 ? y - by : 0;
}
const fmtShort = d => fromYmd(d).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }).replace('.', '');
function evCutoff() { const n = new Date(); return ymd(new Date(n.getFullYear(), n.getMonth() - 2, 1)); }
// Les événements de plus de 2 mois sont supprimés définitivement (une fois par jour et par appareil)
function purgeOldEvents() {
  const house = state.code, key = 'maison.evPurge.' + house, today = todayYmd();
  if (!house || store.get(key) === today) return;
  store.set(key, today);
  getDocs(query(col('events'), where('date', '<', evCutoff()), limit(400))).then(sn => {
    if (!sn.docs.length || house !== state.code) return;
    const cut = evCutoff();
    const old = sn.docs.filter(d => { const v = d.data(); return !REPEATS.includes(v.repeat) && !(typeof v.endDate === 'string' && v.endDate >= cut); });
    if (!old.length) return;
    const b = writeBatch(db);
    old.forEach(d => b.delete(d.ref || ref('events', d.id)));
    fire(b.commit());
  }).catch(e => console.warn('purge', e));
}

function renderCalendar() {
  const allEv = [...state.events, ...periodEvents()];
  const m = state.calMonth, year = m.getFullYear(), month = m.getMonth();
  const startOffset = (new Date(year, month, 1).getDay() + 6) % 7;   // lundi en premier
  const daysIn = new Date(year, month + 1, 0).getDate();
  const rows = Math.ceil((startOffset + daysIn) / 7);
  const byDay = {};
  const gridStart = ymd(new Date(year, month, 1 - startOffset)), gridEnd = ymd(new Date(year, month, 1 - startOffset + rows * 7 - 1));
  for (let i = 0; i < rows * 7; i++) {
    const key = ymd(new Date(year, month, 1 - startOffset + i));
    for (const e of allEv) if (occursOn(e, key)) (byDay[key] = byDay[key] || []).push(e);
  }
  const today = todayYmd(), sel = state.calDay;
  if (!byDay[sel] && (sel < gridStart || sel > gridEnd)) byDay[sel] = allEv.filter(e => occursOn(e, sel));

  let cells = '';
  for (let i = 0; i < rows * 7; i++) {
    const d = new Date(year, month, 1 - startOffset + i), key = ymd(d);
    const evs = (byDay[key] || []).sort(evSort);
    cells += `<button type="button" class="cday ${d.getMonth() !== month ? 'other' : ''} ${key === today ? 'today' : ''} ${key === sel ? 'sel' : ''}" data-action="calDay" data-day="${key}">
      <span class="num">${d.getDate()}</span>
      <span class="dots">${evs.slice(0, 3).map(e => (e.people || []).length ? `<i style="background:${peopleGrad(e.people, 1)}"></i>` : `<i style="--h:${hueOf(e.id)}"></i>`).join('')}</span>
    </button>`;
  }
  const monthLabel = cap(m.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }));
  const dayEvs = (byDay[sel] || []).sort(evSort);
  const selLabel = cap(fromYmd(sel).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }));
  const from = ymd(new Date(fromYmd(sel > today ? sel : today).getTime() + 86400000));
  const upcoming = allEv.map(e => ({ e, d: e.repeat ? nextOccurrence(e, from) : (e.date >= from ? e.date : null) }))
    .filter(x => x.d).sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : evSort(a.e, b.e)).slice(0, 6).map(x => ({ ...x.e, _on: x.d }));

  return `${pageHead('Calendrier')}
    <section class="card calcard sec">
      <div class="calhead">
        <button type="button" class="calnav" data-action="calPrev" aria-label="Mois précédent">${ICON.back}</button>
        <button type="button" class="calmonth" data-action="calToday">${monthLabel}</button>
        <button type="button" class="calnav next" data-action="calNext" aria-label="Mois suivant">${ICON.back}</button>
      </div>
      <div class="calweek">${['L', 'M', 'M', 'J', 'V', 'S', 'D'].map(x => `<span>${x}</span>`).join('')}</div>
      <div class="calgrid" id="calgrid">${cells}</div>
    </section>
    <div class="dayhead"><h2>${selLabel}</h2>${sel !== today ? `<button type="button" class="link" data-action="calToday">Aujourd'hui</button>` : ''}</div>
    <div class="evlist">${dayEvs.length ? dayEvs.map(e => eventCard(e)).join('') : `<div class="card pad muted">Rien de prévu ce jour-là.</div>`}</div>
    <button type="button" class="btn primary full addev" data-action="newEvent">＋ Ajouter un événement</button>
    ${upcoming.length ? `<div class="grp-h soft" style="margin:28px 4px 10px">Prochainement</div><div class="evlist">${upcoming.map(e => eventCard(e, true)).join('')}</div>` : ''}`;
}

  let x0 = null, y0 = null;
  document.addEventListener('touchstart', e => {
    if (!e.target.closest('#calgrid')) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) shiftMonth(dx < 0 ? 1 : -1);
  }, { passive: true });
})();

function whenFr(ts) {
  if (!ts) return '';
  const d = new Date(ts), now = new Date();
  const hm = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  if (ymd(d) === ymd(now)) return `aujourd'hui à ${hm}`;
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (ymd(d) === ymd(y)) return `hier à ${hm}`;
  return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', ...(d.getFullYear() !== now.getFullYear() ? { year: 'numeric' } : {}) }) + ` à ${hm}`;
}

function reactRow(kind, obj) {
  const rx = obj.reactions || {}, groups = new Map();
  for (const [uid, e] of Object.entries(rx)) { if (!groups.has(e)) groups.set(e, []); groups.get(e).push(uid); }

}
function setReaction(kind, id, emoji) {
  const list = kind === 'posts' ? state.posts : state.replies;

  const cur = (o.reactions || {})[meId];

  fire(updateDoc(ref(kind, id), { [`reactions.${meId}`]: next || deleteField() }));

const reactBar = document.createElement('div');

let reactTarget = null;
function openReactBar(target, anchor) {
  reactTarget = target;
  const [kind, id] = target.split(':');
  const o = (kind === 'posts' ? state.posts : state.replies).find(x => x.id === id);

  reactBar.hidden = false;

  reactBar.style.width = w + 'px';
  reactBar.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px';

  reactBar.style.top = (top < 10 ? r.bottom + 8 : top) + 'px';

function closeReactBar() { reactBar.hidden = true; reactTarget = null; }
reactBar.addEventListener('click', e => {
  e.stopPropagation();
  const b = e.target.closest('[data-rx]');
  if (b && reactTarget) { const [k, id] = reactTarget.split(':'); closeReactBar(); setReaction(k, id, b.dataset.rx); return; }
  if (e.target.closest('[data-rx-close]')) { closeReactBar(); return; }

  else if (g) e.target.value = '';
});
document.addEventListener('click', e => {
  const t = e.target;

  const open = t.closest('[data-react-open]');

  const tap = t.closest('[data-react-tap]');
  if (tap && !t.closest('a, button') && !String(getSelection?.() || '')) openReactBar(tap.dataset.reactTap, tap);

async function compressImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    let max = 1280, q = 0.75, out = null;
    for (let k = 0; k < 6; k++) {
      const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * sc)), h = Math.max(1, Math.round(img.naturalHeight * sc));
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      out = { data: c.toDataURL('image/jpeg', q), w, h };
      if (out.data.length < 750000) return out;      // reste sous la limite d'un document Firebase
      max = Math.round(max * 0.8); q = Math.max(0.5, q - 0.07);
    }
    return out;
  } finally { URL.revokeObjectURL(url); }
}

function showPendingPhotoAndAudio() { showPendingPhoto(); showPendingAudio('wall'); }
function showPendingPhoto() {
  const box = $('#wallPrev');
  if (!box) return;
  if (!pendingPhoto) { box.hidden = true; box.innerHTML = ''; return; }
  box.hidden = false;
  box.innerHTML = `<img src="${pendingPhoto.data}" alt=""><button type="button" class="prevx" data-action="dropPhoto" aria-label="Retirer la photo">${ICON.x}</button>`;
}

screen.addEventListener('change', async e => {
  if (e.target.id !== 'wallFile') return;
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const send = $('#wallSend');
  if (send) { send.disabled = true; send.textContent = 'Photo…'; }
  try { pendingPhoto = await compressImage(file); showPendingPhoto(); }
  catch (err) { console.error(err); toast("Impossible de lire cette photo."); }
  if (send) { send.disabled = false; send.textContent = 'Publier'; }
});

// ================== Messages vocaux ==================
const VOICE_MAX = 60;                      // secondes (un document Firestore fait 1 Mo max)
const pendingAudio = { wall: null, reply: null };
const rec = { on: false, where: null, mr: null, chunks: [], t0: 0, timer: null, stream: null, release: null };
// Le micro reste ouvert 10 min après un vocal : l'iPhone ne redemande pas l'autorisation entre deux enregistrements
const MIC_KEEP_MS = 10 * 60 * 1000;
function micAlive() { return rec.stream && rec.stream.getAudioTracks().some(t => t.readyState === 'live'); }
function releaseMic() { clearTimeout(rec.release); rec.release = null; if (!rec.on) { rec.stream?.getTracks().forEach(t => t.stop()); rec.stream = null; } }
function keepMic() { clearTimeout(rec.release); rec.release = setTimeout(releaseMic, MIC_KEEP_MS); }
const fmtDur = sec => { sec = Math.max(0, Math.round(sec)); return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`; };
function saveAudio(a) {
  const r = doc(col('media'));
  mediaCache.set(r.id, a.data);
  fire(setDoc(r, { data: a.data, kind: 'audio', dur: a.dur, by: meId, createdAt: Date.now() }));
  return r.id;
}
function recMime() {
  if (!window.MediaRecorder) return null;
  for (const m of ['audio/mp4', 'audio/aac', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus'])
    if (MediaRecorder.isTypeSupported?.(m)) return m;
  return '';
}
async function startRec(where) {
  if (rec.on) return;
  const mime = recMime();
  if (mime === null || !navigator.mediaDevices?.getUserMedia) { toast("L'enregistrement vocal n'est pas possible sur cet appareil."); return; }
  clearTimeout(rec.release);
  if (!micAlive()) {
    try {
      rec.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    } catch (e) { toast("Micro refusé : autorise-le dans les réglages de l'iPhone (Safari > Micro)."); return; }
  }
  rec.chunks = []; rec.where = where; rec.on = true; rec.t0 = Date.now();
  try { rec.mr = new MediaRecorder(rec.stream, { ...(mime ? { mimeType: mime } : {}), audioBitsPerSecond: 32000 }); }
  catch (_) { rec.mr = new MediaRecorder(rec.stream); }
  rec.mr.ondataavailable = e => { if (e.data && e.data.size) rec.chunks.push(e.data); };
  rec.mr.start(250);
  navigator.vibrate?.(15);
  rec.timer = setInterval(() => {
    const sec = (Date.now() - rec.t0) / 1000;
    const t = document.querySelector('#recTime'); if (t) t.textContent = fmtDur(sec);
    if (sec >= VOICE_MAX) stopRec(true);
  }, 250);
  showPendingAudio(where);
}
function stopRec(keep) {
  if (!rec.on) return;
  clearInterval(rec.timer);
  const where = rec.where, dur = Math.min(VOICE_MAX, (Date.now() - rec.t0) / 1000), mr = rec.mr;
  rec.on = false;
  const finish = () => {
    keepMic();
    if (!keep || dur < 0.8) { pendingAudio[where] = null; showPendingAudio(where); if (keep) toast('Message trop court.'); return; }
    const blob = new Blob(rec.chunks, { type: mr.mimeType || 'audio/mp4' });
    const fr = new FileReader();
    fr.onload = () => {
      const data = String(fr.result || '');
      if (data.length > 950000) { toast('Message trop long, réessaie plus court.'); pendingAudio[where] = null; }
      else pendingAudio[where] = { data, dur: Math.round(dur) };
      showPendingAudio(where);
    };
    fr.readAsDataURL(blob);
  };
  if (mr && mr.state !== 'inactive') { mr.onstop = finish; try { mr.stop(); } catch (_) { finish(); } } else finish();
}
function showPendingAudio(where) {
  const box = where === 'wall' ? $('#wallAudio') : sheet.querySelector('#replyAudio');
  if (!box) return;
  if (rec.on && rec.where === where) {
    box.hidden = false;
    box.innerHTML = `<div class="recbar"><span class="recdot"></span><span id="recTime">${fmtDur((Date.now() - rec.t0) / 1000)}</span>
      <span class="muted grow">Enregistrement…</span>
      <button type="button" class="chip" data-rec-cancel>Annuler</button><button type="button" class="btn primary recstop" data-rec-stop>■ Terminer</button></div>`;
  } else if (pendingAudio[where]) {
    box.hidden = false;
    box.innerHTML = `<div class="recprev">${voicePlayer(null, pendingAudio[where].dur, pendingAudio[where].data)}<button type="button" class="prevx" data-rec-drop="${where}" aria-label="Retirer le vocal">${ICON.x}</button></div>`;
  } else { box.hidden = where === 'wall'; box.innerHTML = ''; }
}
function voicePlayer(id, dur, inline) {
  return `<div class="vplayer" ${id ? `data-audio="${esc(id)}"` : ''} ${inline ? `data-inline="1"` : ''} data-dur="${Number(dur) || 0}">
    <button type="button" class="vpbtn" aria-label="Écouter">▶</button>
    <div class="vpbar"><i></i></div><span class="vpt">${fmtDur(dur)}</span></div>`;
}
// un seul lecteur à la fois
const vAudio = new Audio(); vAudio.preload = 'auto';
let vCur = null;
function vReset() {
  if (!vCur) return;
  vCur.classList.remove('playing'); vCur.querySelector('.vpbtn').textContent = '▶';
  vCur.querySelector('.vpbar i').style.width = '0%'; vCur.querySelector('.vpt').textContent = fmtDur(vCur.dataset.dur);
  vCur = null;
}
vAudio.addEventListener('timeupdate', () => {
  if (!vCur) return;
  const d = isFinite(vAudio.duration) && vAudio.duration > 0 ? vAudio.duration : Number(vCur.dataset.dur) || 1;
  vCur.querySelector('.vpbar i').style.width = Math.min(100, vAudio.currentTime / d * 100) + '%';
  vCur.querySelector('.vpt').textContent = fmtDur(d - vAudio.currentTime);
});
vAudio.addEventListener('ended', vReset);
async function playVoice(pl) {
  if (vCur === pl) { if (vAudio.paused) { vAudio.play(); pl.querySelector('.vpbtn').textContent = '❚❚'; } else { vAudio.pause(); pl.querySelector('.vpbtn').textContent = '▶'; } return; }
  vAudio.pause(); vReset();
  vCur = pl; pl.classList.add('playing'); pl.querySelector('.vpbtn').textContent = '…';
  let src = null;
  if (pl.dataset.inline) {
    const kind = pl.closest('#wallAudio') ? 'wall' : 'reply';
    src = pendingAudio[kind]?.data;
  } else src = await loadMedia(pl.dataset.audio);
  if (vCur !== pl) return;
  if (!src) { toast('Vocal introuvable.'); vReset(); return; }
  vAudio.src = src;
  try { await vAudio.play(); pl.querySelector('.vpbtn').textContent = '❚❚'; }
  catch (e) { console.warn(e); toast("Impossible de lire ce vocal sur cet appareil."); vReset(); }
}
document.addEventListener('click', e => {
  const t = e.target;
  const pb = t.closest('.vpbtn'); if (pb) { e.stopPropagation(); playVoice(pb.closest('.vplayer')); return; }
  const rs = t.closest('[data-rec]'); if (rs) { e.preventDefault(); rec.on ? stopRec(true) : startRec(rs.dataset.rec); return; }
  if (t.closest('[data-rec-stop]')) { stopRec(true); return; }
  if (t.closest('[data-rec-cancel]')) { stopRec(false); return; }
  const dr = t.closest('[data-rec-drop]'); if (dr) { if (vCur?.dataset.inline) { vAudio.pause(); vReset(); } pendingAudio[dr.dataset.recDrop] = null; showPendingAudio(dr.dataset.recDrop); }
}, true);

function publishPost() {
  const ta = $('#wallText');
  const text = (ta?.value || '').trim().slice(0, 2000);
  if (rec.on) { toast("Arrête d'abord l'enregistrement."); return; }
  if (!text && !pendingPhoto && !pendingAudio.wall && !pendingTags.size) { ta?.focus(); return; }
  const data = { text, photoId: pendingPhoto ? saveMedia(pendingPhoto) : null, w: pendingPhoto?.w || 0, h: pendingPhoto?.h || 0,
                 by: meId, byName: state.myName, createdAt: Date.now(), pinned: false, mentions: [...pendingTags] };
  if (pendingAudio.wall) { data.audioId = saveAudio(pendingAudio.wall); data.dur = pendingAudio.wall.dur; pendingAudio.wall = null; showPendingAudio('wall'); }
  { const what = text || (data.audioId ? '🎤 Message vocal' : data.photoId ? '📷 Photo' : '');
    if (data.mentions.length) pushNotify('mention', { title: `👤 ${state.myName} t'a identifié`, body: what, url: appLink('tab=notes'), to: data.mentions });
    pushNotify('post', { title: `💬 ${state.myName}`, body: what, url: appLink('tab=notes'), to: houseMembers().map(m => m.id).filter(id => !data.mentions.includes(id)) }); }
  setDoc(doc(col('posts')), data).catch(err => {
    console.error(err);
    toast(err && err.code === 'permission-denied' ? 'Publication refusée : mets à jour les règles Firebase.' : "La note n'a pas pu être publiée.");
  });
  ta.value = ''; ta.style.height = '';
  pendingPhoto = null; showPendingPhoto();
  pendingTags.clear(); showPendingTags();
}

function openPostMenu(p) {
  openSheet(`<h3>Note</h3>
    <div class="stack">
      ${p.by === meId ? `<button type="button" class="btn ghost full" data-edit-post="${esc(p.id)}">✏️ Modifier</button>` : ''}
      <button type="button" class="btn ghost full" data-reply-post="${esc(p.id)}">💬 Répondre</button>
      <button type="button" class="btn ghost full" data-pin-post="${esc(p.id)}">${p.pinned ? '📌 Désépingler' : '📌 Épingler en haut'}</button>
      ${p.text ? `<button type="button" class="btn ghost full" data-copy-post="${esc(p.id)}">📋 Copier le texte</button>` : ''}
      <button type="button" class="btn danger full" data-del-post="${esc(p.id)}">Supprimer la note</button>
    </div>`);
  sheetKind = 'post'; sheetTarget = p.id;
}

// Photo en grand
const lightbox = $('#lightbox');
function viewPhoto(p) {
  lightbox.innerHTML = `<img src="${p.photo}" alt=""><button type="button" class="sheet-x lbx" aria-label="Fermer">${ICON.x}</button>`;
  lightbox.hidden = false;
}
lightbox.addEventListener('click', () => { lightbox.hidden = true; lightbox.innerHTML = ''; });

// ================== Démarrage ==================
function openAdmin() {
  if (!state.isAdmin) return;
  watchUsers();
  state.view = 'admin';
  renderedKey = '';
  render();
  window.scrollTo(0, 0);
}

if (configured) {
  onAuthStateChanged(auth, u => {
    state.authReady = true;
    if (u) onSignedIn(u); else onSignedOut();
    render();
  });
}
render();
