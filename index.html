// Appui long sur un élément = commencer la sélection
(() => {
  let timer = null, startX = 0, startY = 0, fired = false;
  body.addEventListener('pointerdown', e => {
    const row = e.target.closest('.irow[data-id]');
    if (!row || state.selecting || e.target.closest('.drag, .check, a, .ithumb')) return;
    startX = e.clientX; startY = e.clientY; fired = false;
    timer = setTimeout(() => { fired = true; navigator.vibrate?.(15); setSelecting(true, row.dataset.id); }, 480);
  });
  const cancel = e => { if (timer && (!e || e.type !== 'pointermove' || Math.hypot(e.clientX - startX, e.clientY - startY) > 8)) { clearTimeout(timer); timer = null; } };
  body.addEventListener('pointermove', cancel);
  body.addEventListener('pointerup', () => { cancel(); if (fired) setTimeout(() => { fired = false; }, 350); });
  body.addEventListener('pointercancel', () => cancel());
  body.addEventListener('contextmenu', e => { if (e.target.closest('.irow')) e.preventDefault(); });
  // le clic qui suit un appui long ne doit pas ouvrir l'élément
  body.addEventListener('click', e => { if (fired) { fired = false; e.stopPropagation(); e.preventDefault(); } }, true);
})();

function shortLink(url) {
  try {
    const u = new URL(url.replace(/&amp;/g, '&'));
    const host = u.hostname.replace(/^www\./, '');
    const seg = u.pathname.split('/').map(x => decodeURIComponent(x)).find(x => x && x.length > 2 && !/^(dp|p|r|s|gp|product|products|item|itm|fr|en|ref=.*)$/i.test(x) && !/^[A-Z0-9]{8,}$/.test(x));
    let label = host + (seg ? '/' + seg : '');
    if (label.length > 34) label = label.slice(0, 32) + '…';
    return label;
  } catch (_) { return url.slice(0, 30) + '…'; }
}
const linkify = html => html.replace(/(https?:\/\/[^\s<]+)/g, m => `<a class="shortlink" href="${m}" target="_blank" rel="noopener">🔗 ${esc(shortLink(m))}</a>`);

// ====== Photos rangées à part (chargées une seule fois, puis gardées sur l'appareil) ======
const mediaCache = new Map(), mediaLoading = new Map();
function loadMedia(id) {
  if (mediaCache.has(id)) return Promise.resolve(mediaCache.get(id));
  if (mediaLoading.has(id)) return mediaLoading.get(id);
  const r = ref('media', id);
  const pr = getDocFromCache(r).then(x => { if (!x.exists()) throw 0; return x; }).catch(() => getDoc(r))
    .then(x => { const d = x.exists() ? x.data().data : null; if (d) mediaCache.set(id, d); mediaLoading.delete(id); return d; })
    .catch(() => { mediaLoading.delete(id); return null; });
  mediaLoading.set(id, pr);
  return pr;
}
// ====== Liens vidéo : miniature + ouverture dans l'app (TikTok, YouTube, Instagram…) ======
function normLink(v) {
  let t = String(v || '').trim();
  if (!t) return '';
  const m = t.match(/https?:\/\/\S+/i); if (m) t = m[0];               // un texte partagé contient souvent le lien
  else if (/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(t)) t = 'https://' + t;
  else return '';
  return t.slice(0, 500);
}
function videoInfo(url) {
  let u; try { u = new URL(url); } catch (_) { return null; }
  const h = u.hostname.replace(/^(www|m|vm|vt)\./, '');
  const yt = url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/);
  if (yt) return { kind: 'youtube', label: 'YouTube', id: yt[1], img: `https://i.ytimg.com/vi/${yt[1]}/hqdefault.jpg` };
  if (/(^|\.)tiktok\.com$/.test(h)) return { kind: 'tiktok', label: 'TikTok' };
  if (/(^|\.)instagram\.com$/.test(h)) return { kind: 'instagram', label: 'Instagram' };
  if (/(^|\.)(facebook\.com|fb\.watch)$/.test(h)) return { kind: 'web', label: 'Facebook' };
  if (/(^|\.)pinterest\.(com|fr)$|pin\.it$/.test(h)) return { kind: 'web', label: 'Pinterest' };
  if (/(^|\.)vimeo\.com$/.test(h)) return { kind: 'web', label: 'Vimeo' };
  return { kind: 'web', label: h.replace(/^www\./, '') };
}
function videoThumb(url, clickable, item = {}) {
  const v = videoInfo(url); if (!v) return '';
  const icon = v.kind === 'web' ? '🔗' : '▶';
  let img = '';
  if (item.photoId) img = `<img data-media="${esc(item.photoId)}" alt="">`;                       // ta propre capture : toujours prioritaire
  else if (v.img) img = `<img src="${esc(v.img)}" alt="" loading="lazy" referrerpolicy="no-referrer">`; // YouTube : direct
  else if (item.thumb) img = `<img src="${esc(item.thumb)}" alt="" referrerpolicy="no-referrer" data-stored="${esc(url)}" data-item="${esc(item.id || '')}">`;
  else img = `<img data-resolve="${esc(url)}" data-item="${esc(item.id || '')}" alt="" referrerpolicy="no-referrer" hidden>`;
  const inner = `${img}<span class="vplay">${icon}</span><span class="vsrc">${esc(v.label)}</span>`;
  return clickable
    ? `<a class="vthumb ${v.kind}" href="${esc(url)}" target="_blank" rel="noopener" aria-label="Ouvrir sur ${esc(v.label)}">${inner}</a>`
    : `<span class="vthumb ${v.kind}">${inner}</span>`;
}
// Trouver l'image d'une vidéo : TikTok la donne directement ; sinon on lit l'aperçu de la page (Microlink, gratuit, quelques demandes par jour)
const thCache = (() => { try { return JSON.parse(store.get('maison.thumbs') || '{}'); } catch (_) { return {}; } })();
const thLoading = new Map(), thRetried = new Set();
function saveThCache() {
  for (const k of Object.keys(thCache)) if (Date.now() - thCache[k].t > 24 * 3600e3) delete thCache[k];
  try { store.set('maison.thumbs', JSON.stringify(thCache)); } catch (_) {}
}
async function fetchThumb(url) {
  const v = videoInfo(url);
  if (v?.kind === 'tiktok') {
    try {
      const r = await fetch('https://www.tiktok.com/oembed?url=' + encodeURIComponent(url));
      if (r.ok) { const j = await r.json(); if (j && j.thumbnail_url) return j.thumbnail_url; }
    } catch (_) {}
  }
  try {
    const r = await fetch('https://api.microlink.io/?url=' + encodeURIComponent(url));
    if (r.ok) { const j = await r.json(); const u = j?.data?.image?.url; if (u) return u; }
  } catch (_) {}
  return '';
}
function resolveThumb(url, force) {
  const c = thCache[url];
  if (!force && c && Date.now() - c.t < (c.u ? 12 : 6) * 3600e3) return Promise.resolve(c.u);   // échec : on ne réessaie pas avant 6 h
  if (thLoading.has(url)) return thLoading.get(url);
  const pr = fetchThumb(url).then(u => { thCache[url] = { u, t: Date.now() }; saveThCache(); return u; }).finally(() => thLoading.delete(url));
  thLoading.set(url, pr);
  return pr;
}
function shareThumb(itemId, u) {
  // on range l'adresse de l'image dans l'élément : les autres membres n'ont pas à la rechercher
  const it = state.items.find(x => x.id === itemId);
  if (it && it.thumb !== u && state.code) { it.thumb = u; fire(updateDoc(ref('items', itemId), { thumb: u })); }
}
function hydrateThumbs(root = document) {
  root.querySelectorAll('img[data-resolve]:not([src])').forEach(img => {
    const url = img.dataset.resolve, id = img.dataset.item;
    resolveThumb(url).then(u => {
      if (!u) return;
      img.onload = () => { img.hidden = false; if (id) shareThumb(id, u); };
      img.onerror = () => { img.hidden = true; };
      img.src = u;
    });
  });
  // image déjà rangée mais périmée (les liens TikTok / Instagram expirent) : on en cherche une nouvelle, une fois
  root.querySelectorAll('img[data-stored]').forEach(img => {
    img.onerror = () => {
      img.hidden = true;
      const url = img.dataset.stored, id = img.dataset.item;
      if (thRetried.has(url)) return;
      thRetried.add(url);
      resolveThumb(url, true).then(u => {
        if (!u || u === img.getAttribute('src')) { if (id) shareThumb(id, ''); return; }
        img.onerror = () => { img.hidden = true; };
        img.onload = () => { img.hidden = false; if (id) shareThumb(id, u); };
        img.src = u;
      });
    };
  });
  root.querySelectorAll('.vthumb img[src]:not([data-stored])').forEach(img => { if (!img.onerror) img.onerror = () => { img.hidden = true; }; });
}

function hydrateMedia(root = document) {
  hydrateThumbs(root);
  root.querySelectorAll('img[data-media]:not([src])').forEach(img => {
    const id = img.dataset.media;
    if (mediaCache.has(id)) { img.src = mediaCache.get(id); return; }
    loadMedia(id).then(d => { if (d) document.querySelectorAll(`img[data-media="${CSS.escape(id)}"]`).forEach(x => { x.src = d; }); });
  });
}

function saveListOrder() {

function saveItemOrder(box) {

function render() {
  if (state.dragging) { state.renderPending = true; return; }
  let key;
  if (!configured) key = 'setup';
  else if (!state.authReady) key = 'loading';
  else if (!state.user) key = 'auth-' + state.authMode;
  else if (!state.profile) key = 'loading';
  else if (state.blocked) key = 'blocked';
  else if (state.view === 'admin' && state.isAdmin) key = 'admin';
  else if (!state.code) key = 'onboard';
  else key = 'app';

  composer.hidden = true; fab.hidden = true;
  const selOn = key === 'app' && state.tab === 'lists' && state.view === 'list' && state.selecting;
  renderTabbar(key === 'app' && !selOn);
  renderSelbar(selOn);

  if (key === 'admin') {
    if (renderedKey !== 'admin') { screen.innerHTML = `<div class="anim-in">${renderAdminHead()}</div>`; renderedKey = 'admin'; }
    renderAdminBody();
    return;
  }
  if (key !== 'app') {
    body.innerHTML = '';
    // Ces écrans contiennent des champs : on ne les redessine que si l'écran change.
    if (renderedKey !== key) {
      screen.innerHTML = key === 'setup' ? renderSetup() : key === 'loading' ? renderLoading()
        : key.startsWith('auth-') ? renderAuth() : key === 'blocked' ? renderBlocked() : renderOnboarding();
      renderedKey = key;
    }
    return;
  }
  if (state.tab === 'cal') {
    const anim = state.anim ? 'anim-' + state.anim : ''; state.anim = null;
    screen.innerHTML = `<div class="${anim}">${renderCalendar()}</div>`;
    body.innerHTML = '';
    renderedKey = 'cal';
    return;
  }
  if (state.tab === 'notes') {
    // l'en-tête contient le champ de saisie : on ne le redessine pas à chaque nouveau message
    if (renderedKey !== 'notes') { screen.innerHTML = `<div class="${state.anim ? 'anim-' + state.anim : ''}">${renderNotesHead()}</div>`; showPendingPhoto(); showPendingTags(); }
    markMentionsSeen();

    body.innerHTML = `<div class="wall">${renderWall()}</div>`;
    hydrateMedia(body);
    state.freshPosts = new Set();
    renderedKey = 'notes';
    return;
  }
  renderedKey = 'app';

  const list = currentList();
  if (list && state.pendingList === list.id) state.pendingList = null;
  if (state.view === 'list' && !list && !state.loading && state.pendingList !== state.listId) state.view = 'home';
  const inList = state.view === 'list' && list;
  const anim = state.loading ? '' : (state.anim ? 'anim-' + state.anim : '');
  if (!state.loading) state.anim = null;
  if (inList) {
    const hue = hueOf(list.id);
    screen.innerHTML = `<div class="view ${anim}" style="--h:${hue}">${renderListHead(list)}</div>`;
    body.innerHTML = `<div class="view ${anim}" style="--h:${hue}">${renderList(list)}</div>`;
    composer.classList.add('view');
    composer.style.setProperty('--h', hue);
    composer.hidden = false;
    renderSecChips(list);

    const ae = document.activeElement, typing = ae?.id === 'listSearch';
    const caret = typing ? ae.selectionStart : 0;
    screen.innerHTML = `<div class="${anim}">${renderHome()}</div>`;

    composer.classList.remove('view');
  }
  state.fresh = new Set();
  initSortables();

  updateStuck();

async function copyInvite() {

overlay.addEventListener('click', e => {
  const t = e.target;
  if (t === overlay || t.closest('[data-close]')) return closeSheet();

  const emo = t.closest('[data-emo]');
  if (emo) return setEmoji(emo.dataset.emo);
  if (t.closest('[data-emo-none]')) return setEmoji(null);
  if (t.closest('[data-emo-toggle]')) { sheet.querySelector('.emo-wrap')?.toggleAttribute('hidden'); return; }

  if (t.closest('[data-dd-toggle]')) return setDdOpen(sheet.querySelector('.dd-panel')?.hidden);
  const opt = t.closest('[data-dd-opt]');
  if (opt) return chooseSection(opt.dataset.ddOpt);
  if (t.closest('[data-dd-create]')) {
    const name = (sheet.querySelector('[data-dd-search]')?.value || '').trim().slice(0, 40);
    if (!name) return;
    const emo = clipIcon(ddNewEmoji) || '';
    const newId = addSection(sheetListId, name, emo);
    ddNewEmoji = '';
    if (sheetKind === 'draftCat' || sheetKind === 'bulkCat') return chooseSection(newId);
    sheetSec = newId;
    sheet.querySelector('[data-dd-label]').innerHTML = `<span class="e">${esc(emo)}</span>${esc(name)}`;
    return setDdOpen(false);
  }

  if (t.closest('[data-share]')) {
    navigator.share({ title: 'Maison', text: inviteText() }).catch(() => {});
    return;
  }
  if (t.closest('[data-copy]')) return copyInvite();
  const nc = t.closest('[data-new-code]');
  if (nc && amAdmin()) {
    if (!nc.classList.contains('sure')) { nc.classList.add('sure'); nc.textContent = 'Confirmer : nouveau code'; return; }
    changeJoinCode(); toast('Nouveau code créé. L\'ancien ne marche plus.');
    setTimeout(() => openInviteSheet(), 400); return;
  }
  const mg = t.closest('[data-manage]');
  if (mg && amAdmin()) return openManageMember(mg.dataset.manage);
  if (t.closest('[data-back-members]')) return openMembersSheet();
  const sa = t.closest('[data-set-admin]');
  if (sa && amAdmin()) { setAdmin(sa.dataset.setAdmin, sa.dataset.on === '1'); return openMembersSheet(); }
  const rm = t.closest('[data-remove-member]');
  if (rm && amAdmin()) {
    if (!rm.classList.contains('sure')) { rm.classList.add('sure'); rm.textContent = 'Confirmer : retirer de la maison'; return; }
    removeMember(rm.dataset.removeMember); return openMembersSheet();
  }
  const tr = t.closest('[data-transfer]');
  if (tr) {
    transferTo = tr.dataset.transfer;
    sheet.querySelectorAll('[data-transfer]').forEach(b => b.classList.toggle('on', b === tr));
    const go = sheet.querySelector('[data-transfer-go]'); if (go) go.disabled = false;
    return;
  }
  if (t.closest('[data-transfer-go]') && transferTo) return leaveHouse(transferTo);
  if (t.closest('[data-delete-house]')) return deleteHouse();

  if (f.dataset.form === 'event') { saveEvent(f, value); return; }
  if (f.dataset.form === 'addItem') { submitAddItem(f, value); return; }

  switch (f.dataset.form) {
    case 'newList': {
      const r = doc(col('lists'));
      fire(setDoc(r, { name: value.slice(0, 60), emoji: sheetEmoji, createdAt: Date.now(), order: Date.now() }));
      state.pendingList = r.id;

      break;
    }

      if (l && (l.name !== name || l.emoji !== sheetEmoji)) fire(updateDoc(ref('lists', l.id), { name, emoji: sheetEmoji }));
      closeSheet(); break;
    }
    case 'newSec': {
      addSection(state.listId, value.slice(0, 40), sheetEmoji);
      closeSheet(); toast('Catégorie créée. Touche un élément pour l\'y ranger.'); break;
    }
    case 'editSec': {
      const s = state.sections.find(x => x.id === sheetTarget), name = value.slice(0, 40);
      if (s && (s.name !== name || s.emoji !== sheetEmoji)) fire(updateDoc(ref('sections', s.id), { name, emoji: sheetEmoji }));
      closeSheet(); break;
    }
    case 'editItem': {
      const it = state.items.find(x => x.id === sheetTarget), title = value.slice(0, 200);
      const qty = (f.querySelector('[name="qty"]')?.value || '').trim().slice(0, 30);
      const emoji = sheetEmoji || null;
      const note = (f.querySelector('[name="note"]')?.value || '').trim().slice(0, 500);
      const asg = [...sheetPeople];
      const important = !!f.querySelector('[name="important"]')?.checked;
      const link = normLink(f.querySelector('[name="link"]')?.value);
      const added = asg.some(id => !(it?.assignees || []).includes(id));
      const asgChanged = it && (asg.length !== it.assignees.length || added);
      let photoId = it ? it.photoId : null;
      if (sheetPhoto?.data) photoId = saveMedia(sheetPhoto); else if (!sheetPhoto) photoId = null;
      const photoChanged = it && photoId !== it.photoId;
      if (photoChanged && it.photoId) fire(deleteDoc(ref('media', it.photoId)));
      if (it && (it.title !== title || (it.sectionId || null) !== sheetSec || (it.emoji || null) !== emoji || it.qty !== qty || it.note !== note || asgChanged || photoChanged || it.important !== important || (it.link || '') !== link)) {
        fire(updateDoc(ref('items', it.id), { title, sectionId: sheetSec, emoji, qty, note, assignees: asg, photoId, important, link,
          ...(added ? { assignedAt: Date.now(), assignedBy: state.myName } : {}) }));
      }
      closeSheet(); break;
    }
    case 'settings': {
      const me = (f.querySelector('[name="me"]').value || '').trim().slice(0, 30);
      if (me && me !== state.myName) { state.myName = me; fire(updateDoc(userRef(), { pseudo: me })); touchMember(true); }

      if (house !== state.house?.name) fire(updateDoc(houseRef(), { name: house }));
      closeSheet(); render(); break;
    }
  }
});

// ================== Résumé du jour (accueil) ==================
function relDay(date) {
  const diff = Math.round((fromYmd(date) - fromYmd(todayYmd())) / 864e5);
  if (diff === 1) return 'demain';
  if (diff === 2) return 'après-demain';
  return fromYmd(date).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric' });
}
function todayWidget() {
  const now = new Date(), today = todayYmd();
  const in7 = ymd(new Date(now.getFullYear(), now.getMonth(), now.getDate() + 7));
  const evToday = state.events.filter(e => e.date === today).sort(evSort);
  const next = state.events.filter(e => e.date > today && e.date <= in7).sort(evSort);
  const hl = (e, inner) => (e.people || []).length ? `<span class="hl" style="background:${peopleGrad(e.people, .32)}">${inner}</span>` : inner;
  const line = (e, when) => `<div class="tdline">${hl(e, `${e.emoji ? esc(e.emoji) + ' ' : ''}${esc(e.title)}`)}<small>${when}</small></div>`;
  let body;
  if (evToday.length) {
    body = evToday.slice(0, 2).map(e => line(e, e.allDay ? 'Journée' : esc(e.time))).join('')
      + (evToday.length > 2 ? `<div class="tdmore">+ ${evToday.length - 2} autre${evToday.length - 2 > 1 ? 's' : ''}</div>` : '');
  } else if (next.length) {
    body = `<div class="tdnone">Rien aujourd'hui</div>` + line(next[0], relDay(next[0].date));
  } else body = `<div class="tdnone">Rien de prévu 🌿</div>`;
  return `<div class="homerow sec">
    <div class="card todaycard tdsmall" role="button" tabindex="0" data-action="goCal">
      <div class="tdhead">
        <span class="tdcal"><small>${now.toLocaleDateString('fr-FR', { month: 'short' }).replace('.', '')}</small><b>${now.getDate()}</b></span>
        <div class="grow"><div class="tdtitle">${cap(now.toLocaleDateString('fr-FR', { weekday: 'long' }))}</div></div>
      </div>
      <div class="tdbody">${body}</div>
    </div>
    ${weatherCard()}
  </div>`;
}

const WMO = {0:['☀️','Ensoleillé'],1:['🌤️','Plutôt beau'],2:['⛅','Éclaircies'],3:['☁️','Couvert'],45:['🌫️','Brouillard'],48:['🌫️','Brouillard givrant'],

  85:['🌨️','Averses de neige'],86:['❄️','Averses de neige'],95:['⛈️','Orage'],96:['⛈️','Orage et grêle'],99:['⛈️','Orage et grêle']};
const wmo = (c, day = 1) => {
  const w = WMO[c] || ['🌡️', '—'];
  if (!day && c === 0) return ['🌙', 'Ciel dégagé'];
  if (!day && c === 1) return ['🌙', 'Plutôt dégagé'];
  return w;
};
const WX_TTL = 30 * 60 * 1000;
const wxData = new Map();          // "lat,lon" -> { t, d }
const wxLoading = new Set();
try { for (const [k, v] of Object.entries(JSON.parse(store.get('maison.wx') || '{}'))) wxData.set(k, v); } catch (_) {}
const wxKey = p => `${(+p.lat).toFixed(3)},${(+p.lon).toFixed(3)}`;
function wxPrefs() {
  const w = state.profile?.weather || {};
  const places = (Array.isArray(w.places) ? w.places : []).filter(p => p && isFinite(p.lat) && isFinite(p.lon)).slice(0, 12)
    .map(p => ({ id: String(p.id || wxKey(p)), name: str(p.name, 'Lieu'), sub: str(p.sub, ''), lat: +p.lat, lon: +p.lon }));
  return { places, cur: w.cur };
}
function wxPlace() { const { places, cur } = wxPrefs(); return places.find(p => p.id === cur) || places[0] || null; }
function wxSave(places, cur) {
  const weather = { places, cur: cur ?? null };
  if (state.profile) state.profile.weather = weather;
  fire(updateDoc(userRef(), { weather }));
}
async function wxLoad(p, force) {
  const k = wxKey(p), have = wxData.get(k);
  if (!force && have && Date.now() - have.t < WX_TTL) return;
  if (wxLoading.has(k)) return;
  wxLoading.add(k);
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}`
      + '&current=temperature_2m,apparent_temperature,weather_code,is_day,wind_speed_10m,precipitation'
      + '&hourly=temperature_2m,weather_code,precipitation_probability,is_day'
      + '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset'
      + '&timezone=auto&forecast_days=7';
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    wxData.set(k, { t: Date.now(), d: await r.json() });
    const obj = {}; for (const [kk, v] of wxData) if (Date.now() - v.t < 6 * 3600e3) obj[kk] = v;
    store.set('maison.wx', JSON.stringify(obj));
  } catch (e) { console.warn('météo', e); if (have) have.err = true; else wxData.set(k, { t: 0, err: true }); }
  wxLoading.delete(k);

function renderWeatherSheet() {

      }).join('');

async function wxSearch(q) {
  if (q.length < 2) { wxResults = null; renderWeatherSheet(); return; }
  try {
    const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=8&language=fr&format=json`);
    const j = await r.json();
    if (q !== wxQuery) return;
    wxResults = (j.results || []).map(x => ({ name: x.name, sub: [x.admin1, x.country].filter(Boolean).join(', '), lat: x.latitude, lon: x.longitude }));
  } catch (_) { wxResults = []; }
  renderWeatherSheet();
}
function wxAddPlace(r) {
  const { places } = wxPrefs();
  const place = { id: wxKey(r), name: String(r.name).slice(0, 60), sub: String(r.sub || '').slice(0, 80), lat: +(+r.lat).toFixed(4), lon: +(+r.lon).toFixed(4) };
  const list = places.some(x => x.id === place.id) ? places : [...places, place].slice(-12);
  wxResults = null; wxQuery = '';
  wxSave(list, place.id); wxLoad(place); renderWeatherSheet(); render();
}

  const del = t.closest('[data-wx-del]');
  if (del) { const { places, cur } = wxPrefs(); const rest = places.filter(x => x.id !== del.dataset.wxDel); wxSave(rest, rest.some(x => x.id === cur) ? cur : rest[0]?.id); renderWeatherSheet(); render(); return; }
  const add = t.closest('[data-wx-add]');
  if (add && wxResults) return wxAddPlace(wxResults[+add.dataset.wxAdd]);
  if (t.closest('[data-wx-geo]')) {

});

const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const fromYmd = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

const evSort = (a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0)

function renderCalendar() {
  const m = state.calMonth, year = m.getFullYear(), month = m.getMonth();
  const startOffset = (new Date(year, month, 1).getDay() + 6) % 7;   // lundi en premier
  const daysIn = new Date(year, month + 1, 0).getDate();
  const rows = Math.ceil((startOffset + daysIn) / 7);
  const byDay = {};
  for (const e of state.events) (byDay[e.date] = byDay[e.date] || []).push(e);
  const today = todayYmd(), sel = state.calDay;

  let cells = '';
  for (let i = 0; i < rows * 7; i++) {
    const d = new Date(year, month, 1 - startOffset + i), key = ymd(d);
    const evs = (byDay[key] || []).sort(evSort);
    cells += `<button type="button" class="cday ${d.getMonth() !== month ? 'other' : ''} ${key === today ? 'today' : ''} ${key === sel ? 'sel' : ''}" data-action="calDay" data-day="${key}">
      <span class="num">${d.getDate()}</span>
      <span class="dots">${evs.slice(0, 3).map(e => (e.people || []).length ? `<i style="background:${peopleGrad(e.people, 1)}"></i>` : `<i style="--h:${hueOf(e.id)}"></i>`).join('')}</span>
    </button>`;
  }
  const monthLabel = cap(m.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }));
  const dayEvs = (byDay[sel] || []).sort(evSort);
  const selLabel = cap(fromYmd(sel).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }));
  const upcoming = state.events.filter(e => e.date > sel && e.date >= today).sort(evSort).slice(0, 6);

  return `${pageHead('Calendrier')}
    <section class="card calcard sec">
      <div class="calhead">
        <button type="button" class="calnav" data-action="calPrev" aria-label="Mois précédent">${ICON.back}</button>
        <button type="button" class="calmonth" data-action="calToday">${monthLabel}</button>
        <button type="button" class="calnav next" data-action="calNext" aria-label="Mois suivant">${ICON.back}</button>
      </div>
      <div class="calweek">${['L', 'M', 'M', 'J', 'V', 'S', 'D'].map(x => `<span>${x}</span>`).join('')}</div>
      <div class="calgrid" id="calgrid">${cells}</div>
    </section>
    <div class="dayhead"><h2>${selLabel}</h2>${sel !== today ? `<button type="button" class="link" data-action="calToday">Aujourd'hui</button>` : ''}</div>
    <div class="evlist">${dayEvs.length ? dayEvs.map(e => eventCard(e)).join('') : `<div class="card pad muted">Rien de prévu ce jour-là.</div>`}</div>
    <button type="button" class="btn primary full addev" data-action="newEvent">＋ Ajouter un événement</button>
    ${upcoming.length ? `<div class="grp-h soft" style="margin:28px 4px 10px">Prochainement</div><div class="evlist">${upcoming.map(e => eventCard(e, true)).join('')}</div>` : ''}`;
}

function shiftMonth(n) {
  const m = state.calMonth;
  state.calMonth = new Date(m.getFullYear(), m.getMonth() + n, 1);
  // garde le même jour si possible
  const sel = fromYmd(state.calDay);
  const last = new Date(state.calMonth.getFullYear(), state.calMonth.getMonth() + 1, 0).getDate();
  state.calDay = ymd(new Date(state.calMonth.getFullYear(), state.calMonth.getMonth(), Math.min(sel.getDate(), last)));

  const g = $('#calgrid'); if (g) g.classList.add(n > 0 ? 'slide-l' : 'slide-r');

// Glisser à gauche / à droite sur le calendrier pour changer de mois
(() => {
  let x0 = null, y0 = null;
  document.addEventListener('touchstart', e => {
    if (!e.target.closest('#calgrid')) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) shiftMonth(dx < 0 ? 1 : -1);
  }, { passive: true });
})();

      : `<div class="card pad muted">Personne d'autre dans la maison pour l'instant.</div>`}
    <button type="button" class="btn primary full" style="margin-top:14px" data-close>OK</button>`);
  sheetKind = 'tags';
}

// Notes où je suis identifié, que je n'ai pas encore vues
function unreadMentions() {
  const seen = Number(state.profile?.mentionSeen?.[state.code]) || 0;
  return state.posts.filter(p => p.by !== meId && (p.mentions || []).includes(meId) && p.createdAt > seen);
}
// Éléments qu'on m'a confiés (par quelqu'un d'autre), pas encore vus et pas faits
function unreadAssigned() {
  const seen = Number(state.profile?.assignSeen?.[state.code]) || 0;
  return state.items.filter(i => !i.done && (i.assignees || []).includes(meId) && i.assignedAt > seen && i.assignedBy && i.assignedBy !== state.myName);
}
function markAssignedSeen(listId) {
  const un = unreadAssigned().filter(i => !listId || i.listId === listId);
  if (!un.length) return;
  fire(updateDoc(userRef(), { [`assignSeen.${state.code}`]: Date.now() }));
}
function markMentionsSeen() {
  const un = unreadMentions();
  if (!un.length && !unreadReplies().length) return;
  un.forEach(p => state.newMentions.add(p.id));
  fire(updateDoc(userRef(), { [`mentionSeen.${state.code}`]: Date.now() }));
}
state.newMentions = new Set();

function whenFr(ts) {
  if (!ts) return '';
  const d = new Date(ts), now = new Date();
  const hm = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  if (ymd(d) === ymd(now)) return `aujourd'hui à ${hm}`;
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (ymd(d) === ymd(y)) return `hier à ${hm}`;
  return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', ...(d.getFullYear() !== now.getFullYear() ? { year: 'numeric' } : {}) }) + ` à ${hm}`;
}
// Liens cliquables dans les messages
// Liens affichés en version courte : https://www.amazon.fr/echo-dot-max/dp/B0… → 🔗 amazon.fr/echo-dot-max

function renderNotesHead() {
  return `${pageHead('Notes', 'Un mot, une photo, pour toute la maison.')}
    <form class="card wallform sec" id="wallForm" autocomplete="off">
      <textarea class="field" id="wallText" maxlength="2000" rows="2" placeholder="Écris quelque chose…"></textarea>
      <div class="wallprev" id="wallPrev" hidden></div>
      <div class="walltags" id="wallTags" hidden></div>
      <div class="wallbar">
        <label class="chip photo-btn">📷 Photo<input type="file" accept="image/*" id="wallFile" hidden></label>
        <button type="button" class="chip" data-action="tagPeople" id="tagBtn">👤 Identifier</button>
        <span class="grow"></span>
        <button class="btn primary" type="submit" id="wallSend">Publier</button>
      </div>
    </form>`;
}

function postCard(p) {
  const mine = p.by === meId;
  const tagged = (p.mentions || []).includes(meId);
  return `<article class="post card ${state.freshPosts?.has(p.id) ? 'enter' : ''} ${tagged ? 'mentioned' : ''}">
    ${tagged ? `<div class="mtag">🔔 ${state.newMentions.has(p.id) ? '<b>Nouveau</b> · ' : ''}Tu es identifié dans cette note</div>` : ''}
    <div class="phead">
      <span class="avatar" style="--h:${pHue(p.by || p.byName)}">${esc(initial(p.byName))}</span>
      <div class="grow"><div class="pname">${esc(p.byName || "Quelqu'un")}${mine ? ' <span class="muted">(toi)</span>' : ''}</div><div class="ptime">${whenFr(p.createdAt)}${p.editedAt ? ' · modifié' : ''}</div></div>
      ${p.pinned ? '<span class="pin" title="Épinglé">📌</span>' : ''}
      <button type="button" class="iconbtn pmore" data-action="postMenu" data-id="${esc(p.id)}" aria-label="Options">${ICON.more}</button>
    </div>
    ${p.text ? `<div class="ptext" data-react-tap="posts:${esc(p.id)}">${linkify(esc(p.text))}</div>` : ''}
    ${p.photoId || p.photo ? `<button type="button" class="pphoto" data-action="viewPhoto" data-id="${esc(p.id)}"><img ${p.photoId ? `data-media="${esc(p.photoId)}"` : `src="${p.photo}"`} alt="" ${p.w && p.h ? `width="${p.w}" height="${p.h}"` : ''}></button>` : ''}
    ${reactRow('posts', p)}
    ${(p.mentions || []).length ? `<div class="ptags">avec ${p.mentions.map(id => `<span class="ptag ${id === meId ? 'me' : ''}">${esc(id === meId ? 'toi' : memberName(id))}</span>`).join(' ')}</div>` : ''}
    ${replyStrip(p)}
  </article>`;
}

// ----- Réponses -----
state.replies = [];
const repliesOf = postId => state.replies.filter(r => r.postId === postId);
function replyStrip(p) {
  const rs = repliesOf(p.id), last = rs[rs.length - 1];
  return `<div class="pactions">
    ${last ? `<button type="button" class="plast" data-action="thread" data-id="${esc(p.id)}"><b>${esc(last.byName || "Quelqu'un")}</b> ${last.photoId && !last.text ? '📷 Photo' : esc(last.text.slice(0, 90)) + (last.text.length > 90 ? '…' : '')}</button>` : ''}
    <span class="prow"><button type="button" class="preact" data-react-open="posts:${esc(p.id)}" aria-label="Réagir">☺＋</button>
    <button type="button" class="preply" data-action="thread" data-id="${esc(p.id)}">💬 ${rs.length ? `${rs.length} réponse${rs.length > 1 ? 's' : ''} · Répondre` : 'Répondre'}</button></span>
  </div>`;
}
function openThread(postId) {
  const p = state.posts.find(x => x.id === postId);
  if (!p) { if (sheetKind === 'thread') closeSheet(); return; }
  const again = sheetKind === 'thread' && sheetTarget === postId;
  const keepVal = again ? (sheet.querySelector('[name="reply"]')?.value || '') : '';
  const hadFocus = again && document.activeElement?.name === 'reply';
  const rs = repliesOf(postId);
  openSheet(`<h3>Réponses</h3>
    <div class="tpost">
      <div class="phead"><span class="avatar" style="--h:${pHue(p.by || p.byName)}">${esc(initial(p.byName))}</span>
        <div class="grow"><div class="pname">${esc(p.byName || "Quelqu'un")}</div><div class="ptime">${whenFr(p.createdAt)}</div></div></div>
      ${p.text ? `<div class="ptext">${linkify(esc(p.text))}</div>` : ''}
      ${p.photoId ? `<img class="tthumb" data-media="${esc(p.photoId)}" alt="">` : p.photo ? `<img class="tthumb" src="${p.photo}" alt="">` : ''}
    </div>
    <div class="replies">${rs.length ? rs.map(r => `<div class="reply">
        <span class="avatar" style="--h:${pHue(r.by || r.byName)}">${esc(initial(r.byName))}</span>
        <div class="grow"><div class="rbubble" data-react-tap="replies:${esc(r.id)}"><b>${esc(r.byName || "Quelqu'un")}</b>${r.text ? `<div class="rtext">${linkify(esc(r.text))}</div>` : ''}
            ${r.photoId ? `<button type="button" class="rphoto" data-view-media="${esc(r.photoId)}"><img data-media="${esc(r.photoId)}" alt="" ${r.w && r.h ? `width="${r.w}" height="${r.h}"` : ''}></button>` : ''}</div>
          ${reactRow('replies', r)}
          <div class="ptime">${whenFr(r.createdAt)} · <button type="button" class="link rreact" data-react-open="replies:${esc(r.id)}">Réagir</button> · <button type="button" class="link rdel" data-del-reply="${esc(r.id)}">Supprimer</button></div></div>
      </div>`).join('') : '<p class="hint" style="text-align:center;margin:10px 0">Pas encore de réponse.</p>'}</div>
    <form data-form="reply" class="replyform" autocomplete="off">
      <div class="rpending" id="replyPending"></div>
      <label class="rcam" aria-label="Ajouter une photo">📷<input type="file" accept="image/*" data-reply-photo hidden></label>
      <textarea class="field" name="reply" maxlength="1000" rows="1" placeholder="Écrire une réponse…">${esc(keepVal)}</textarea>
      <button type="submit" class="btn primary" aria-label="Envoyer">➤</button>
    </form>`);
  sheetKind = 'thread'; sheetTarget = postId;
  if (!again) replyPhoto = null;
  showReplyPhoto();
  hydrateMedia(sheet);
  const replies = sheet.querySelector('.replies');
  if (replies && again) sheet.scrollTop = sheet.scrollHeight;
  if (hadFocus || !again) sheet.querySelector('[name="reply"]')?.focus();
}
let replyPhoto = null;
function showReplyPhoto() {
  const box = sheet.querySelector('#replyPending'); if (!box) return;
  box.innerHTML = replyPhoto ? `<span class="rpthumb"><img src="${replyPhoto.data}" alt=""><button type="button" data-reply-photo-drop aria-label="Retirer la photo">${ICON.x}</button></span>` : '';
}
function sendReply(f) {
  const ta = f.querySelector('[name="reply"]');
  const text = ta.value.trim().slice(0, 1000);
  if (!text && !replyPhoto) { ta.focus(); return; }
  const data = { postId: sheetTarget, text, by: meId, byName: state.myName, createdAt: Date.now() };
  if (replyPhoto) { data.photoId = saveMedia(replyPhoto); data.w = replyPhoto.w; data.h = replyPhoto.h; }
  fire(setDoc(doc(col('replies')), data));
  replyPhoto = null; showReplyPhoto();
  ta.value = ''; ta.style.height = '';
  ta.focus();
}
function openEditPost(p) {
  sheetPeople = new Set(p.mentions || []);
  openSheet(`<h3>Modifier la note</h3>
    <form data-form="editPost" autocomplete="off">
      <textarea class="field" name="text" maxlength="2000" rows="5" placeholder="Écris quelque chose…">${esc(p.text)}</textarea>
      <div class="label">Personnes identifiées</div>
      ${peoplePicker(false)}
      ${actions('Enregistrer')}
    </form>`);
  sheetKind = 'editPost'; sheetTarget = p.id;
}
// Réponses à mes notes, pas encore vues
// ----- Réactions (une par personne, comme sur Messenger) -----
const REACTIONS = ['👍', '❤️', '😂', '😮', '😢', '😡'];
function cleanReactions(v) {
  const out = {};
  if (v && typeof v === 'object') for (const [k, e] of Object.entries(v)) if (typeof e === 'string' && e) out[k] = graphemes(e).slice(0, 1).join('');
  return out;
}
function reactRow(kind, obj) {
  const rx = obj.reactions || {}, groups = new Map();
  for (const [uid, e] of Object.entries(rx)) { if (!groups.has(e)) groups.set(e, []); groups.get(e).push(uid); }
  if (!groups.size) return '';
  const mine = rx[meId];
  return `<div class="rxrow">${[...groups].sort((a, b) => b[1].length - a[1].length).map(([e, ids]) =>
    `<button type="button" class="rxchip ${e === mine ? 'me' : ''}" data-react-set="${kind}:${esc(obj.id)}:${esc(e)}" title="${esc(ids.map(id => id === meId ? 'toi' : memberName(id)).join(', '))}">${esc(e)}<b>${ids.length}</b></button>`).join('')}
    <span class="rxnames">${esc([...groups.values()].flat().map(id => id === meId ? 'toi' : memberName(id)).slice(0, 3).join(', '))}${Object.keys(rx).length > 3 ? '…' : ''}</span></div>`;
}
function setReaction(kind, id, emoji) {
  const list = kind === 'posts' ? state.posts : state.replies;
  const o = list.find(x => x.id === id); if (!o) return;
  const cur = (o.reactions || {})[meId];
  const next = cur === emoji ? null : emoji;                  // retoucher la même = l'enlever
  o.reactions = { ...(o.reactions || {}) };
  if (next) o.reactions[meId] = next; else delete o.reactions[meId];
  fire(updateDoc(ref(kind, id), { [`reactions.${meId}`]: next || deleteField() }));
  if (next) navigator.vibrate?.(10);
  if (kind === 'posts' && state.tab === 'notes') render();
  if (sheetKind === 'thread') openThread(sheetTarget);
}
const reactBar = document.createElement('div');
reactBar.id = 'reactbar'; reactBar.hidden = true;
document.body.appendChild(reactBar);
let reactTarget = null;
function openReactBar(target, anchor) {
  reactTarget = target;
  const [kind, id] = target.split(':');
  const o = (kind === 'posts' ? state.posts : state.replies).find(x => x.id === id);
  const mine = o?.reactions?.[meId];
  reactBar.innerHTML = `<div class="rxbar">${REACTIONS.map(e => `<button type="button" class="${e === mine ? 'me' : ''}" data-rx="${e}">${e}</button>`).join('')}
      <button type="button" class="rxplus" data-rx-more aria-label="Autre émoji">＋</button></div>
    <div class="rxmore" hidden><input class="field" data-rx-input placeholder="Tape un émoji (touche 😀 du clavier)" autocomplete="off"></div>`;
  reactBar.hidden = false;
  const r = anchor.getBoundingClientRect(), w = Math.min(330, innerWidth - 16);
  reactBar.style.width = w + 'px';
  reactBar.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px';
  const top = r.top - 62;
  reactBar.style.top = (top < 10 ? r.bottom + 8 : top) + 'px';
}
function closeReactBar() { reactBar.hidden = true; reactTarget = null; }
reactBar.addEventListener('click', e => {
  e.stopPropagation();
  const b = e.target.closest('[data-rx]');
  if (b && reactTarget) { const [k, id] = reactTarget.split(':'); closeReactBar(); setReaction(k, id, b.dataset.rx); return; }
  if (e.target.closest('[data-rx-more]')) { const m = reactBar.querySelector('.rxmore'); m.hidden = false; m.querySelector('input').focus(); }
});
reactBar.addEventListener('input', e => {
  if (!e.target.matches('[data-rx-input]') || !reactTarget) return;
  const g = graphemes(e.target.value.trim())[0];
  if (g && !/^[\p{L}\p{N}\p{P}\s]$/u.test(g)) { const [k, id] = reactTarget.split(':'); closeReactBar(); setReaction(k, id, g); }
  else if (g) e.target.value = '';
});
document.addEventListener('click', e => {
  const t = e.target;
  if (!reactBar.hidden && !t.closest('#reactbar')) { const was = reactTarget; closeReactBar(); const o = t.closest('[data-react-open], [data-react-tap]'); if (o && (o.dataset.reactOpen || o.dataset.reactTap) === was) return; }
  const set = t.closest('[data-react-set]');
  if (set) { const [k, id, ...em] = set.dataset.reactSet.split(':'); setReaction(k, id, em.join(':')); return; }
  const open = t.closest('[data-react-open]');
  if (open) { openReactBar(open.dataset.reactOpen, open); return; }
  const tap = t.closest('[data-react-tap]');
  if (tap && !t.closest('a, button') && !String(getSelection?.() || '')) openReactBar(tap.dataset.reactTap, tap);
}, true);
addEventListener('scroll', () => { if (!reactBar.hidden && document.activeElement?.matches?.('[data-rx-input]') !== true) closeReactBar(); }, true);

function unreadReplies() {
  const seen = Number(state.profile?.mentionSeen?.[state.code]) || 0;
  const mine = new Set(state.posts.filter(p => p.by === meId).map(p => p.id));
  return state.replies.filter(r => mine.has(r.postId) && r.by !== meId && r.createdAt > seen);
}

function renderWall() {
  if (!state.posts.length) return `<div class="card empty"><div style="font-size:40px">💬</div><p>Aucune note pour l'instant.<br>Écris le premier mot !</p></div>`;
  const pinned = state.posts.filter(p => p.pinned), rest = state.posts.filter(p => !p.pinned);
  return `${pinned.length ? `<div class="grp-h soft" style="margin:6px 4px 10px">📌 Épinglé</div><div class="posts">${pinned.map(postCard).join('')}</div>` : ''}
    ${rest.length ? `${pinned.length ? '<div class="grp-h soft" style="margin:24px 4px 10px">Récent</div>' : ''}<div class="posts">${rest.map(postCard).join('')}</div>` : ''}`;
}

async function compressImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    let max = 1280, q = 0.75, out = null;
    for (let k = 0; k < 6; k++) {
      const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * sc)), h = Math.max(1, Math.round(img.naturalHeight * sc));
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      out = { data: c.toDataURL('image/jpeg', q), w, h };
      if (out.data.length < 750000) return out;      // reste sous la limite d'un document Firebase
      max = Math.round(max * 0.8); q = Math.max(0.5, q - 0.07);
    }
    return out;
  } finally { URL.revokeObjectURL(url); }
}

function showPendingPhoto() {
  const box = $('#wallPrev');
  if (!box) return;
  if (!pendingPhoto) { box.hidden = true; box.innerHTML = ''; return; }
  box.hidden = false;
  box.innerHTML = `<img src="${pendingPhoto.data}" alt=""><button type="button" class="prevx" data-action="dropPhoto" aria-label="Retirer la photo">${ICON.x}</button>`;
}

screen.addEventListener('change', async e => {
  if (e.target.id !== 'wallFile') return;
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const send = $('#wallSend');
  if (send) { send.disabled = true; send.textContent = 'Photo…'; }
  try { pendingPhoto = await compressImage(file); showPendingPhoto(); }
  catch (err) { console.error(err); toast("Impossible de lire cette photo."); }
  if (send) { send.disabled = false; send.textContent = 'Publier'; }
});

function publishPost() {
  const ta = $('#wallText');
  const text = (ta?.value || '').trim().slice(0, 2000);
  if (!text && !pendingPhoto && !pendingTags.size) { ta?.focus(); return; }
  const data = { text, photoId: pendingPhoto ? saveMedia(pendingPhoto) : null, w: pendingPhoto?.w || 0, h: pendingPhoto?.h || 0,
                 by: meId, byName: state.myName, createdAt: Date.now(), pinned: false, mentions: [...pendingTags] };
  setDoc(doc(col('posts')), data).catch(err => {
    console.error(err);
    toast(err && err.code === 'permission-denied' ? 'Publication refusée : mets à jour les règles Firebase.' : "La note n'a pas pu être publiée.");
  });
  ta.value = ''; ta.style.height = '';
  pendingPhoto = null; showPendingPhoto();
  pendingTags.clear(); showPendingTags();
}

function openPostMenu(p) {
  openSheet(`<h3>Note</h3>
    <div class="stack">
      ${p.by === meId ? `<button type="button" class="btn ghost full" data-edit-post="${esc(p.id)}">✏️ Modifier</button>` : ''}
      <button type="button" class="btn ghost full" data-reply-post="${esc(p.id)}">💬 Répondre</button>
      <button type="button" class="btn ghost full" data-pin-post="${esc(p.id)}">${p.pinned ? '📌 Désépingler' : '📌 Épingler en haut'}</button>
      ${p.text ? `<button type="button" class="btn ghost full" data-copy-post="${esc(p.id)}">📋 Copier le texte</button>` : ''}
      <button type="button" class="btn danger full" data-del-post="${esc(p.id)}">Supprimer la note</button>
    </div>`);
  sheetKind = 'post'; sheetTarget = p.id;
}

// Photo en grand
const lightbox = $('#lightbox');
function viewPhoto(p) {
  lightbox.innerHTML = `<img src="${p.photo}" alt=""><button type="button" class="sheet-x lbx" aria-label="Fermer">${ICON.x}</button>`;
  lightbox.hidden = false;
}
lightbox.addEventListener('click', () => { lightbox.hidden = true; lightbox.innerHTML = ''; });

function openAdmin() {
  if (!state.isAdmin) return;

  state.view = 'admin';
  renderedKey = '';

  window.scrollTo(0, 0);
}

if (configured) {
  onAuthStateChanged(auth, u => {
    state.authReady = true;

}
