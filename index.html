<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maison">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F6F3EE">
<link rel="apple-touch-icon" href="icon-180.png">
<script>
  // Mode nuit : auto (suit l'iPhone), clair ou sombre
  (function () {
    var pref = 'auto'; try { pref = localStorage.getItem('maison.theme') || 'auto'; } catch (e) {}
    var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
<link rel="icon" href="icon-192.png">
<title>Maison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F3EE; --card:#FFFFFF; --ink:#1F1B16; --muted:#8A8178; --line:#ECE6DD;
    --accent:#2F6B4F; --shadow:0 1px 2px rgba(31,27,22,.05), 0 4px 14px rgba(31,27,22,.04);
  }
  html[data-theme="dark"]{ --bg:#141210; --card:#1F1C19; --ink:#F2EDE6; --muted:#9A9087; --line:#2E2A26; --accent:#5FA883; --shadow:none; }
  html[data-theme="dark"]{color-scheme:dark}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{background:var(--bg);color:var(--ink)}
  body{font-family:Inter,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.4;min-height:100vh;
       padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
  button{font:inherit;color:inherit;cursor:pointer}
  .wrap{max-width:560px;margin:0 auto;padding:22px 18px 120px}

  h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:34px;letter-spacing:-.02em;line-height:1.1;word-break:break-word}
  h2{font-size:18px;font-weight:600;margin-bottom:12px}
  .sub{color:var(--muted);margin-top:6px;font-size:15px}
  .banner{margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-size:14px;color:var(--muted)}

  .card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
  .pad{padding:20px 18px}
  .muted{color:var(--muted)}
  .sec{margin-top:24px}
  .stack > * + *{margin-top:10px}

  .hometop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .hometop .btns{display:flex;gap:4px;margin:-6px -8px 0 0}

  /* Accueil */
  .lrow{display:flex;align-items:center;gap:14px;padding:13px 16px;width:100%;background:none;border:0;text-align:left}
  .lrow + .lrow{border-top:1px solid var(--line)}
  .lrow:active{background:color-mix(in srgb, var(--ink) 4%, transparent)}
  .tile{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;font-size:23px;line-height:1;
        background:color-mix(in srgb, var(--accent) 10%, var(--card))}
  .grow{flex:1;min-width:0}
  .lname{font-weight:600;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lmeta{color:var(--muted);font-size:14px;margin-top:1px}
  .chev{color:var(--muted);flex:none}

  .fab{position:fixed;right:max(20px, env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));
       background:var(--accent);color:#fff;border:0;border-radius:999px;padding:14px 20px 14px 16px;font-weight:600;font-size:16px;
       box-shadow:0 8px 24px color-mix(in srgb, var(--accent) 40%, transparent);display:flex;gap:8px;align-items:center;z-index:5}
  .fab svg{width:20px;height:20px}

  .empty{text-align:center;padding:34px 22px}
  .empty p{color:var(--muted);margin:8px 0 18px}
  .btn{border:0;border-radius:13px;padding:12px 18px;font-weight:600;font-size:15px}
  .primary{background:var(--accent);color:#fff}
  .ghost{background:color-mix(in srgb, var(--ink) 7%, transparent)}
  .danger{background:color-mix(in srgb, #C0392B 12%, transparent);color:#C0392B}
  .danger.sure{background:#C0392B;color:#fff}
  .full{width:100%}

  /* Vue d'une liste */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin:-8px -8px 14px}
  .back,.iconbtn{background:none;border:0;color:var(--accent);font-weight:500;font-size:17px;display:flex;align-items:center;gap:2px;padding:8px}
  .back svg,.iconbtn svg{width:22px;height:22px}
  .ltitle{display:flex;align-items:center;gap:12px}

  .grp{margin-top:22px}
  .grp-h{display:flex;align-items:center;gap:8px;margin:0 4px 9px;font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
  .grp-h .e{font-size:16px;letter-spacing:0}
  .grp-h .n{color:var(--muted);font-weight:500;letter-spacing:0}
  .grp-h::after{content:"";flex:1;height:1px;background:var(--line);margin-left:4px}
  .grp-h.soft{color:var(--muted)}
  .grp-h .act{margin-left:auto;order:2}
  .link{background:none;border:0;color:var(--accent);font-size:14px;font-weight:500;padding:2px 4px;text-transform:none;letter-spacing:0}

  .irow{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:54px}
  .irow + .irow{border-top:1px solid var(--line)}
  .check{width:27px;height:27px;border-radius:50%;border:2px solid color-mix(in srgb, var(--muted) 55%, transparent);flex:none;
         display:grid;place-items:center;background:none;transition:all .15s}
  .check svg{width:15px;height:15px;color:#fff}
  .check.on{background:var(--accent);border-color:var(--accent)}
  .itext{flex:1;min-width:0;cursor:pointer}
  .ititle{font-size:17px;word-break:break-word}
  .done .ititle{color:var(--muted);text-decoration:line-through}
  .by{font-size:12.5px;color:var(--muted);margin-top:1px}

  /* Barre d'ajout */
  .composer{position:sticky;top:0;z-index:6;margin:14px -18px 0;padding:10px 18px 10px;
            background:color-mix(in srgb, var(--bg) 86%, transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  .composer.stuck{box-shadow:0 8px 18px -14px rgba(31,27,22,.35)}
  .composer form{display:flex;gap:8px;align-items:center;background:var(--card);border-radius:16px;
                 padding:5px 5px 5px 16px;box-shadow:0 1px 2px rgba(31,27,22,.05), 0 6px 18px rgba(31,27,22,.06);border:1px solid var(--line);
                 transition:border-color .2s, box-shadow .2s}
  .composer form:focus-within{border-color:var(--lc);box-shadow:0 0 0 4px color-mix(in srgb, var(--lc) 16%, transparent)}
  .composer input{flex:1;min-width:0;border:0;background:none;font:16px Inter,system-ui,sans-serif;color:var(--ink);outline:none;padding:9px 0}
  .composer input::placeholder{color:var(--muted)}
  .composer form button{background:var(--lc);color:#fff;border:0;border-radius:12px;width:42px;height:42px;display:grid;place-items:center;flex:none;transition:transform .12s}
  .composer form button:active{transform:scale(.9)}
  .composer form button svg{width:20px;height:20px}

  .chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .composer .chips{margin-top:9px;padding-bottom:2px}
  .chip{flex:none;border:1px solid var(--line);background:var(--card);padding:7px 12px;border-radius:999px;font-weight:500;font-size:13.5px;white-space:nowrap}
  .chip.add{border-style:dashed;color:var(--muted);background:transparent}

  /* Feuille du bas */
  .overlay{position:fixed;inset:0;background:rgba(20,16,12,.42);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  .sheet{background:var(--card);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;border-radius:24px 24px 0 0;
         padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,.8,.3,1)}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .sheet{position:relative}
  .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:-10px auto 12px}
  .sheet-x{position:sticky;top:0;float:right;z-index:3;width:36px;height:36px;margin:-6px -6px 0 8px;border:0;border-radius:50%;
           display:grid;place-items:center;background:color-mix(in srgb, var(--ink) 8%, var(--card));color:var(--ink)}
  .sheet-x svg{width:18px;height:18px}
  .sheet-x:active{transform:scale(.9)}
  .sheet h3{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:24px;margin-bottom:16px}
  .field{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:13px;padding:13px 14px;font:16px Inter,system-ui,sans-serif;outline:none}
  .field:focus{border-color:var(--accent)}
  .field.err{border-color:#C0392B}
  .label{font-size:13px;color:var(--muted);font-weight:500;margin:18px 2px 8px}
  .actions{display:flex;gap:10px;margin-top:20px}
  .actions .btn{flex:1}
  .sep{height:1px;background:var(--line);margin:22px 0 6px}
  .linkbox{font-size:14px;word-break:break-all;padding:12px 14px;border-radius:13px;background:var(--bg);border:1px solid var(--line);user-select:all;-webkit-user-select:all}

  /* Émojis */
  .emo-row{display:flex;gap:10px;align-items:center}
  .emo-big{width:52px;height:52px;flex:none;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:28px;line-height:1;display:grid;place-items:center}
  .emo-wrap{margin-top:12px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
  .emo-grid{max-height:210px;overflow-y:auto;padding:4px 8px 8px}
  .emo-g{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:10px 4px 4px}
  .emo-cells{display:grid;grid-template-columns:repeat(auto-fill, minmax(40px, 1fr))}
  .emo{height:42px;border:0;background:none;border-radius:10px;font-size:24px;line-height:1}
  .emo:active,.emo.on{background:color-mix(in srgb, var(--accent) 16%, transparent)}
  .emo-custom{border:0;border-top:1px solid var(--line);border-radius:0 0 14px 14px;background:transparent}

  .srow{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
  .srow-btn{flex:1;display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;padding:11px 2px;font-size:16px;min-width:0}
  .srow-btn .e{font-size:20px;width:26px;text-align:center}
  .srow-btn .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .del{background:none;border:0;color:var(--muted);padding:8px;flex:none}
  .del svg{width:18px;height:18px}
  .hint{font-size:13.5px;color:var(--muted);margin-top:4px}

  /* Liste déroulante */
  .dd-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--bg);
          border-radius:13px;padding:13px 14px;font-size:16px;text-align:left}
  .dd-btn .v{display:flex;align-items:center;gap:10px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dd-btn svg{width:18px;height:18px;color:var(--muted);flex:none;transition:transform .15s}
  .dd.open .dd-btn{border-color:var(--accent)}
  .dd.open .dd-btn svg{transform:rotate(180deg)}
  .dd-panel{margin-top:8px;border:1px solid var(--line);border-radius:14px;background:var(--bg);overflow:hidden}
  .dd-search{border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent}
  .dd-search:focus{border-color:var(--line)}
  .dd-list{max-height:240px;overflow-y:auto}
  .dd-opt{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:12px 14px;text-align:left;font-size:16px}
  .dd-opt + .dd-opt{border-top:1px solid var(--line)}
  .dd-opt:active{background:color-mix(in srgb, var(--accent) 10%, transparent)}
  .dd-opt .e{width:24px;text-align:center;font-size:19px;flex:none}
  .dd-opt .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dd-opt .ck{margin-left:auto;color:var(--accent);flex:none;display:flex}
  .dd-opt .ck svg{width:18px;height:18px}
  .dd-opt.create{color:var(--accent);font-weight:500}
  .dd-empty{padding:12px 14px;color:var(--muted);font-size:14px}

  .logo{font-size:52px;margin-bottom:10px}

  /* Couleur propre à chaque liste (--h = teinte) */
  :root{--lc:var(--accent)}
  .view{--lc:hsl(var(--h,152) 45% 38%)}
  html[data-theme="dark"] .view{--lc:hsl(var(--h,152) 45% 60%)}
  .hello{color:var(--muted);font-size:15px;font-weight:500;margin-bottom:4px}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
  .lcard{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;border:0;border-radius:22px;
         padding:16px 16px 15px;min-height:132px;background:hsl(var(--h) 60% 94%);color:var(--ink);overflow:hidden;
         transition:transform .15s cubic-bezier(.3,.7,.4,1), box-shadow .2s}
  .lcard::after{content:"";position:absolute;right:-26px;top:-26px;width:90px;height:90px;border-radius:50%;background:hsl(var(--h) 60% 88%);opacity:.7}
  .lcard:active{transform:scale(.96)}
  .lcard .lemo{position:relative;z-index:1;width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:28px;line-height:1;
               background:var(--card);box-shadow:0 2px 8px hsl(var(--h) 40% 40% / .14)}
  .lcard .lname{position:relative;z-index:1;font-weight:600;font-size:17px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal}
  .lcard .lmeta{position:relative;z-index:1;margin-top:auto;font-size:13.5px;color:hsl(var(--h) 30% 35%)}
  .lcard.add{background:transparent;border:1.5px dashed var(--line);align-items:center;justify-content:center;color:var(--muted);font-weight:500}
  .lcard.add::after{display:none}
  .lcard.add .plus{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb, var(--accent) 12%, transparent);color:var(--accent);font-size:26px;line-height:1}
  html[data-theme="dark"] .lcard{background:hsl(var(--h) 22% 17%)}html[data-theme="dark"] .lcard::after{background:hsl(var(--h) 25% 22%)}html[data-theme="dark"] .lcard .lemo{background:hsl(var(--h) 20% 23%);box-shadow:none}html[data-theme="dark"] .lcard .lmeta{color:hsl(var(--h) 20% 70%)}

  .view .ltitle .tile{width:54px;height:54px;border-radius:17px;font-size:30px;background:hsl(var(--h) 60% 92%)}
  html[data-theme="dark"] .view .ltitle .tile{background:hsl(var(--h) 22% 20%)}
  .view .back{color:var(--lc)}
  .view .iconbtn{color:var(--lc)}
  .view .check.on{background:var(--lc);border-color:var(--lc)}
  .view .grp-h:not(.soft){color:var(--lc)}
  .view .grp-h:not(.soft)::after{background:color-mix(in srgb, var(--lc) 28%, var(--line))}
  .view .link{color:var(--lc)}

  /* Éléments : émoji + quantité */
  .iline{display:flex;align-items:center;gap:10px;min-width:0}
  .iemo{font-size:21px;line-height:1;flex:none;width:26px;text-align:center}
  .ititle{flex:1;min-width:0}
  .qty{flex:none;margin-left:auto;font-size:13.5px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap;max-width:45%;overflow:hidden;text-overflow:ellipsis;
       color:var(--lc);background:color-mix(in srgb, var(--lc) 12%, transparent)}
  .done .qty{color:var(--muted);background:color-mix(in srgb, var(--muted) 12%, transparent)}
  .done .iemo{opacity:.5}
  .emo-big.none{color:var(--muted);font-size:22px}
  .emo-none{display:block;width:calc(100% - 16px);margin:8px 8px 0;border:1px dashed var(--line);background:none;border-radius:10px;padding:8px;font-size:14px;color:var(--muted)}

  /* Commentaire */
  .note{font-size:14px;line-height:1.35;color:var(--muted);margin-top:3px;white-space:pre-line;
        display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .note.indent{padding-left:36px}
  .done .note{opacity:.7}
  textarea.field{resize:vertical;min-height:84px;line-height:1.4}

  /* Membres */
  .members-btn{padding:6px 8px}
  .avatars{display:flex;align-items:center}
  .avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:600;font-size:13px;color:#fff;
          background:hsl(var(--h,152) 45% 45%);border:2px solid var(--bg)}
  .avatars .avatar + .avatar{margin-left:-9px}
  .avatar.more{background:var(--muted)}
  .avatar.lg{width:42px;height:42px;font-size:17px;border:0}
  .avatar.off{background:color-mix(in srgb, var(--muted) 45%, transparent)}
  .mrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .mname{font-weight:600;font-size:16px}
  .mdev{font-size:13.5px;margin-top:3px}
  .kick{flex:none;border:1px solid var(--line);background:none;color:var(--muted);border-radius:10px;padding:7px 11px;font-size:13.5px;font-weight:500}
  .kick.sure{background:#C0392B;border-color:#C0392B;color:#fff}

  /* Animations */
  @keyframes viewIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
  @keyframes viewBack{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
  @keyframes rise{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
  @keyframes enter{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}
  .anim-in{animation:viewIn .3s cubic-bezier(.2,.8,.3,1)}
  .anim-back{animation:viewBack .3s cubic-bezier(.2,.8,.3,1)}
  .anim-in .lcard,.anim-back .lcard,.anim-first .lcard{animation:rise .42s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i,0) * 45ms)}
  .irow.enter{animation:enter .35s cubic-bezier(.2,.8,.3,1)}
  .irow{transition:opacity .25s, background-color .25s}
  .irow.checking{opacity:.55}
  .irow.checking .check{animation:pop .32s ease}
  .irow.checking .ititle{text-decoration:line-through;color:var(--muted)}
  .check{transition:background-color .2s, border-color .2s, transform .12s}
  .check:active{transform:scale(.88)}
  .itext:active{opacity:.6}
  @media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
  .housebtn{background:none;border:0;display:flex;align-items:center;gap:6px;text-align:left;padding:0;max-width:100%}
  .housebtn h1{min-width:0}
  .housebtn .caret{display:flex;flex:none;color:var(--muted)}
  .housebtn .caret svg{width:24px;height:24px}
  .star{font-size:24px;line-height:1;color:var(--muted);padding:8px 10px}
  .star.on{color:#D9A21B}
  /* Glisser-déposer */
  .drag,.sec-drag{flex:none;display:grid;place-items:center;width:30px;height:36px;margin-right:-6px;color:color-mix(in srgb, var(--muted) 70%, transparent);
                  touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
  .drag svg,.sec-drag svg{width:18px;height:18px}
  .sec-drag{margin-left:auto;order:3;height:28px}
  .drag-ghost{opacity:.35;background:color-mix(in srgb, var(--lc) 10%, var(--card))}
  .drag-chosen{background:var(--card)}
  .drag-fly{box-shadow:0 12px 30px rgba(31,27,22,.22);border-radius:14px;opacity:.97!important}
  body.dragging{-webkit-user-select:none;user-select:none}
  .grp-title{display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px 0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;text-align:left}
  .grp-title.static{cursor:default}
  .grp-title .n{margin-left:2px}
  .grp-h .grp-title + .sec-drag{order:3}
  .grp.mini{margin-top:12px}
  .grp.mini .grp-h{font-size:11.5px;margin-bottom:6px}
  .grp.mini .grp-h .e{font-size:14px}
  .done-zone{margin-top:32px}
  .done-h{margin-bottom:4px}

  /* Barre d'ajout : puces */
  .chip.set{background:color-mix(in srgb, var(--lc) 14%, var(--card));border-color:color-mix(in srgb, var(--lc) 40%, var(--line));color:var(--lc)}

  .caret-s{font-size:11px;opacity:.7}

  /* Vue d'une catégorie */
  .svhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .svhead .link{font-family:Inter,system-ui,sans-serif;font-size:14px;margin-left:4px}
  .svadd{display:flex;gap:8px}

  .svrow{display:flex;align-items:center;gap:10px;padding:8px 6px 8px 14px;min-height:52px}

  .svtext{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;font-size:16px;padding:4px 0}
  .svrow.done .ititle{color:var(--muted);text-decoration:line-through}

  /* Bouton d'ajout (ouvre la fenêtre Nouvel élément) */
  .addbtn{width:100%;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;
          padding:7px 16px 7px 7px;font-size:16px;color:var(--muted);text-align:left;
          box-shadow:0 1px 2px rgba(31,27,22,.05), 0 6px 18px rgba(31,27,22,.06);transition:transform .12s, border-color .2s}
  .addbtn:active{transform:scale(.98);border-color:var(--lc)}
  .addplus{width:40px;height:40px;border-radius:12px;background:var(--lc);color:#fff;display:grid;place-items:center;flex:none}
  .addplus svg{width:20px;height:20px}
  .addrow{display:grid;grid-template-columns:1fr;gap:10px}
  .addsubmit{margin-top:18px;background:var(--lc)}
  .addedlog{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .addedchip{font-size:13px;padding:5px 10px;border-radius:999px;color:var(--lc);background:color-mix(in srgb, var(--lc) 12%, transparent);animation:rise .3s ease}

  /* Identifications et notifications */
  .online{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2EAD5B;margin-right:6px;vertical-align:1px}
  .walltags{display:flex;flex-wrap:wrap;gap:6px;margin:4px 4px 8px}
  .tagchip{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;font-weight:500;padding:4px 4px 4px 10px;border-radius:999px;
           background:color-mix(in srgb, var(--accent) 12%, transparent);color:var(--accent)}
  .tagchip button{border:0;background:none;color:inherit;width:22px;height:22px;display:grid;place-items:center;padding:0}
  .tagchip svg{width:14px;height:14px}
  .tagrow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:11px 14px;text-align:left;font-size:16px}
  .tagrow + .tagrow{border-top:1px solid var(--line)}
  .tagck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none;transition:all .15s}
  .tagck svg{width:14px;height:14px}
  .tagrow.on .tagck{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip.set{background:color-mix(in srgb, var(--accent) 14%, var(--card));border-color:color-mix(in srgb, var(--accent) 40%, var(--line));color:var(--accent)}
  .post.mentioned{box-shadow:0 0 0 2px color-mix(in srgb, #E8A317 70%, transparent), var(--shadow)}
  .mtag{font-size:13px;color:#A86F00;background:color-mix(in srgb, #E8A317 14%, transparent);border-radius:10px;padding:6px 10px;margin:-2px 0 10px}
  .ptags{margin-top:10px;font-size:13.5px;color:var(--muted)}
  .ptag{display:inline-block;font-weight:600;color:var(--accent);background:color-mix(in srgb, var(--accent) 10%, transparent);border-radius:999px;padding:2px 9px;margin:2px 2px 0 0}
  .ptag.me{color:#A86F00;background:color-mix(in srgb, #E8A317 16%, transparent)}
  .tab{position:relative}
  .tabbadge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#E0453A;color:#fff;
            font-style:normal;font-size:11px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg);animation:pop .4s ease}
  .mentioncard{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;font-size:15px;
               background:color-mix(in srgb, #E8A317 12%, var(--card));box-shadow:0 0 0 1px color-mix(in srgb, #E8A317 35%, transparent)}
  .mentioncard .bell{font-size:22px;animation:pop .6s ease}

  /* Personnes : couleurs et surlignage */
  .minis{display:inline-flex;flex:none;margin-left:6px}
  .mini{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;
        background:hsl(var(--h) 55% 48%);box-shadow:0 0 0 2px var(--card)}
  .minis .mini + .mini{margin-left:-6px}
  .pchips{display:flex;flex-wrap:wrap;gap:8px}
  .pchip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px 5px 5px;font-size:14.5px;font-weight:500;transition:all .15s}
  .pchip .mini{box-shadow:none}
  .pchip.on{border-color:hsl(var(--h) 55% 48%);background:hsl(var(--h) 70% 58% / .16)}
  .irow.assigned{box-shadow:inset 4px 0 0 0 transparent;background-image:var(--pg);background-size:4px 100%;background-repeat:no-repeat}
  .irow.forme:not(.done){background-color:color-mix(in srgb, #E8A317 7%, var(--card))}

  .hl{border-radius:6px;padding:1px 5px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  .tdev .minis{margin-left:auto}
  .catbar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:16px -18px 0;padding:2px 18px 4px}
  .catbar::-webkit-scrollbar{display:none}
  .catchip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:500;white-space:nowrap;transition:transform .12s}
  .catchip:active{transform:scale(.95)}
  .catchip .e{font-size:16px}
  .catchip .n{font-size:12px;font-weight:700;color:#fff;background:var(--lc);border-radius:999px;min-width:19px;height:19px;padding:0 5px;display:inline-grid;place-items:center}

  .dd-new{padding:12px 14px;border-top:1px solid var(--line)}
  .dd-new-t{font-size:13.5px;color:var(--muted);margin-bottom:6px}
  .dd-emos{display:grid;grid-template-columns:repeat(auto-fill, minmax(38px, 1fr));margin-bottom:10px}
  .dd-emos .emo{height:38px;font-size:21px}
  .shortlink{display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-weight:500;text-decoration:none;background:color-mix(in srgb, var(--accent) 10%, transparent);border-radius:8px;padding:1px 7px;word-break:break-all}
  .ithumb{flex:none;width:44px;height:44px;border-radius:10px;overflow:hidden;border:0;padding:0;background:var(--line)}
  .ithumb img{width:100%;height:100%;object-fit:cover;display:block}
  .photofield{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .pfthumb{position:relative;display:inline-block}
  .pfthumb img{width:72px;height:72px;object-fit:cover;border-radius:12px;display:block;background:var(--line)}
  .pfthumb .prevx{top:-6px;right:-6px;width:26px;height:26px}

  /* Réponses */
  .pactions{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
  .plast{border:0;background:color-mix(in srgb, var(--ink) 5%, transparent);border-radius:12px;padding:7px 10px;font-size:14px;text-align:left;width:100%;color:var(--ink)}
  .preply{border:0;background:none;color:var(--accent);font-weight:600;font-size:14px;padding:4px 2px}
  .tpost{padding-bottom:12px;border-bottom:1px solid var(--line)}
  .tthumb{display:block;max-width:100%;max-height:200px;border-radius:12px;margin-top:8px;background:var(--line)}
  .replies{display:flex;flex-direction:column;gap:12px;padding:14px 0}
  .reply{display:flex;gap:10px;align-items:flex-start}
  .rbubble{background:color-mix(in srgb, var(--ink) 6%, var(--card));border-radius:4px 16px 16px 16px;padding:8px 12px;font-size:15px}
  .rbubble b{font-size:13.5px}
  .rtext{white-space:pre-wrap;word-break:break-word;margin-top:1px}
  .reply .ptime{margin:3px 0 0 4px}
  .rdel{font-size:12.5px;padding:0;color:var(--muted)}
  .rdel.sure{color:#C0392B;font-weight:600}
  .replyform{position:sticky;bottom:calc(-22px - env(safe-area-inset-bottom));display:flex;gap:8px;align-items:flex-end;background:var(--card);padding:10px 0 4px}
  .replyform textarea{min-height:46px;resize:none;flex:1;width:auto;min-width:0}
  .replyform .btn{width:48px;height:46px;padding:0;font-size:18px;flex:none}

  /* Résumé du jour (accueil) */
  .todaycard{padding:14px 16px;cursor:pointer;transition:transform .12s}
  .todaycard:active{transform:scale(.985)}
  .tdhead{display:flex;align-items:center;gap:12px}
  .tdcal{width:46px;height:50px;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;flex:none;
         background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
  .tdcal small{background:#D9534F;color:#fff;font-size:10.5px;font-weight:700;text-transform:uppercase;text-align:center;padding:2px 0;letter-spacing:.05em}
  .tdcal b{flex:1;display:grid;place-items:center;font-size:21px;line-height:1}
  .tdtitle{font-weight:600;font-size:16px}
  .tddate{font-size:13.5px;color:var(--muted)}
  .tdbody{margin-top:12px;display:flex;flex-direction:column;gap:8px}
  .tdev{display:flex;align-items:center;gap:10px;font-size:15px}
  .tdtime{flex:none;width:52px;font-weight:600;font-size:13.5px}
  .tdev .evbar{height:18px;align-self:center}
  .tdname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tdnone{font-size:15px;color:var(--muted)}
  .tdmore{font-size:13px;color:var(--muted);padding-left:62px}
  .tdnext{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.4}


  /* Accueil : jour + météo côte à côte */
  .homerow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .homerow > .card{margin:0;min-width:0}
  .todaycard.tdsmall{padding:12px 13px}
  .todaycard.tdsmall .tdhead{gap:9px}
  .todaycard.tdsmall .tdcal{width:38px;height:42px;border-radius:10px}
  .todaycard.tdsmall .tdcal small{font-size:9px}
  .todaycard.tdsmall .tdcal b{font-size:17px}
  .todaycard.tdsmall .tdtitle{font-size:15px}
  .todaycard.tdsmall .tdbody{margin-top:9px;gap:5px}
  .tdline{font-size:13.5px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .tdline small{display:block;color:var(--muted);font-size:12px}
  .todaycard.tdsmall .tdnone{font-size:13.5px}
  .todaycard.tdsmall .tdmore{padding-left:0;font-size:12px}
  .wxcard{padding:12px 13px;cursor:pointer;display:flex;flex-direction:column;gap:2px;transition:transform .12s;
    background:linear-gradient(160deg, color-mix(in srgb, #4A90D9 14%, var(--card)), var(--card) 70%)}
  .wxcard:active{transform:scale(.985)}
  .wxcard.empty{align-items:center;justify-content:center;text-align:center;gap:3px}
  .wxcard.empty small{color:var(--muted)}
  .wxplace{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wxnow{display:flex;align-items:center;gap:6px}
  .wxbig{font-size:30px;line-height:1.1}
  .wxtemp{font-size:30px;font-weight:700;letter-spacing:-.02em}
  .wxlabel{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wxmm{font-size:12px;color:var(--muted)}
  .wxchips{display:flex;flex-wrap:wrap;gap:7px}
  .wxchip{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--card);overflow:hidden}
  .wxchip button{border:0;background:none;color:inherit;font:500 14px Inter,system-ui,sans-serif;padding:7px 4px 7px 12px}
  .wxchip .x{padding:7px 10px 7px 6px;color:var(--muted);font-size:16px}
  .wxchip.on{background:var(--accent);border-color:var(--accent)}
  .wxchip.on button{color:#fff}
  .wxgeo{margin:10px 2px 0;display:inline-block}
  .wxres{margin-top:10px;padding:0;overflow:hidden}
  .wxrow{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;color:inherit;text-align:left;padding:12px 14px;font:15px Inter,system-ui,sans-serif}
  .wxrow + .wxrow{border-top:1px solid var(--line)}
  .wxrow small{color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wxrow .plus{color:var(--accent);font-size:18px}

  .wxhero .wxbig{font-size:48px}.wxhero .wxtemp{font-size:52px}
  .wxhero .wxlabel{white-space:normal}
  .wxhours{display:flex;gap:6px;overflow-x:auto;padding:10px 2px;scrollbar-width:none}
  .wxh{flex:none;width:54px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:14px;background:var(--bg);font-size:13px}
  .wxh small{color:var(--muted);font-size:11.5px}.wxh span{font-size:20px}.wxh i{font-style:normal;font-size:10.5px;color:#4A90D9;min-height:13px}
  .wxdays{padding:4px 14px;margin-top:6px}
  .wxd{display:grid;grid-template-columns:1fr 34px 54px 72px;align-items:center;padding:9px 0;font-size:15px}
  .wxd + .wxd{border-top:1px solid var(--line)}
  .wxd .i{font-size:20px;text-align:center}.wxd .p{font-size:12px;color:#4A90D9;text-align:center}.wxd .t{text-align:right}.wxd .t small{color:var(--muted);font-size:14px}
  .wxcredit{text-align:center;margin-top:14px;font-size:12px}
  .wxcredit a{color:inherit}
  /* Accueil : listes avec aperçu, favoris, réduction */
  .lc-sec{margin:24px 4px 10px}

  .lsearch .field{padding-left:40px}

  .lc-none{text-align:center;margin-top:18px}

  .grid.nomt{margin-top:0}
  .lc-sec + .grid{margin-top:0}

  .lcol{display:flex;flex-direction:column;gap:12px}

  .lcard2{border-radius:20px;background:hsl(var(--h) 60% 95%);overflow:hidden;animation:rise .4s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i,0) * 40ms);
          box-shadow:0 1px 2px rgba(31,27,22,.04)}

  .lc-head .lname{font-weight:600;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lc-head .lmeta{font-size:13px;color:hsl(var(--h) 30% 38%)}

  .lc-btn{flex:none;width:36px;height:36px;border:0;background:none;border-radius:10px;display:grid;place-items:center;color:hsl(var(--h) 30% 40%);font-size:20px;line-height:1}

  .lc-btn.star.on{color:#E0A100}

  .lc-empty{padding:10px 14px;color:var(--muted);font-size:14.5px}
  .lc-more{display:block;width:100%;border:0;border-top:1px solid var(--line);background:none;color:hsl(var(--h) 45% 38%);font-weight:600;font-size:14px;padding:10px;text-align:center}
  html[data-theme="dark"] .lc-more{color:hsl(var(--h) 45% 65%)}
  .newlist{width:100%;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:10px;border:1.5px dashed var(--line);background:transparent;border-radius:20px;padding:16px;color:var(--muted);font-weight:600;font-size:15.5px}

  .impsw{margin:14px 0 2px}

  /* Liens vidéo dans les cases */

    background:linear-gradient(150deg,#3a3a3a,#1d1d1d)}

  .vthumb.tiktok{background:linear-gradient(150deg,#25F4EE 0%,#111 45%,#111 55%,#FE2C55 100%)}
  .vthumb.instagram{background:linear-gradient(45deg,#f9a03f,#e1306c 50%,#833ab4)}
  .vthumb.web{background:linear-gradient(150deg,color-mix(in srgb, var(--lc) 70%, #000),var(--lc))}
  .vthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .vplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.45);
    display:grid;place-items:center;font-size:14px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding-left:2px}
  .vsrc{position:absolute;left:6px;bottom:6px;font-size:10.5px;font-weight:700;background:rgba(0,0,0,.5);padding:2px 7px;border-radius:999px;max-width:calc(100% - 12px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tiles .irow.hasvid .itext{min-height:0;padding-top:8px}
  .tiles .irow.hasvid .check,.tiles .irow.hasvid .pickbox{top:11px;left:11px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
  .tiles .irow.hasvid .drag{top:9px;right:8px;opacity:.9;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
  .tiles .irow.hasvid .impbadge{top:10px;right:30px}
  .grp.mini .vthumb{aspect-ratio:1;margin:4px 4px 0}
  .done .vthumb{opacity:.55}

  /* Icône libre (2 caractères) */
  .iconbox{width:58px;flex:none;text-align:center;font-size:22px;font-weight:700;padding:10px 4px;text-transform:none}
  .iconbox::placeholder{font-size:14px;font-weight:500}
  .dd-newrow{display:flex;align-items:center;gap:10px;margin:4px 0 10px}
  .dd-newrow .iconbox{width:54px;font-size:19px;padding:8px 4px}
  .dd-newrow .muted{font-size:13px}
  .lcard .lemo.letter{font-weight:800;font-size:22px;color:hsl(var(--h) 45% 35%)}
  html[data-theme="dark"] .lcard .lemo.letter{color:hsl(var(--h) 55% 78%)}

  /* Réactions et photos dans les réponses */
  .rxrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
  .rxchip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 9px 3px 7px;font-size:15px;line-height:1.2;color:var(--ink)}
  .rxchip b{font-size:12.5px;font-weight:700;color:var(--muted)}
  .rxchip.me{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 12%, var(--card))}
  .rxchip.me b{color:var(--accent)}
  .rxnames{font-size:12.5px;color:var(--muted)}
  .reply .rxrow{margin-top:5px}
  .prow{display:flex;align-items:center;gap:6px;width:100%}
  .preact{border:1px solid var(--line);background:none;color:var(--muted);border-radius:999px;padding:4px 10px;font-size:14px}
  .rreact{font-size:12.5px;padding:0;color:var(--muted)}
  #reactbar{position:fixed;z-index:200;animation:rxpop .16s ease-out}
  @keyframes rxpop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
  .rxbar{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:999px;padding:6px 8px;box-shadow:0 8px 30px rgba(0,0,0,.22),0 0 0 1px var(--line)}
  .rxbar button{border:0;background:none;font-size:27px;width:40px;height:44px;border-radius:50%;transition:transform .12s;padding:0}
  .rxbar button:active{transform:scale(1.3)}
  .rxbar button.me{background:color-mix(in srgb, var(--accent) 16%, transparent)}
  .rxbar .rxplus{font-size:20px;color:var(--muted);background:color-mix(in srgb, var(--ink) 7%, transparent);width:36px;height:36px}
  .rxmore{margin-top:8px;background:var(--card);border-radius:14px;padding:6px;box-shadow:0 8px 30px rgba(0,0,0,.18)}
  .rxmore .field{font-size:15px}
  .rphoto{display:block;border:0;padding:0;margin-top:6px;border-radius:12px;overflow:hidden;background:var(--line);max-width:220px}
  .rphoto img{display:block;width:100%;height:auto;max-height:260px;object-fit:cover}
  .replyform{flex-wrap:wrap}
  .rpending{flex-basis:100%}
  .rpending:empty{display:none}
  .rpthumb{position:relative;display:inline-block;margin-bottom:4px}
  .rpthumb img{width:64px;height:64px;object-fit:cover;border-radius:12px;display:block}
  .rpthumb button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:#333;color:#fff;display:grid;place-items:center;padding:0}
  .rpthumb button svg{width:12px;height:12px}
  .rcam{flex:none;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:color-mix(in srgb, var(--ink) 6%, var(--card));cursor:pointer}
  .ptext[data-react-tap],.rbubble[data-react-tap]{cursor:pointer;-webkit-tap-highlight-color:transparent}
  /* ===== Éléments en cases ===== */
  .card.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;background:transparent;box-shadow:none;border:0;padding:0;overflow:visible}
  .tiles .irow{position:relative;display:block;padding:0;min-height:0;border:0!important;border-radius:18px;background-color:var(--card);
    box-shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05)}
  .tiles .irow + .irow{border-top:0}
  .tiles .itext{display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;padding:16px 7px 11px;min-height:118px;height:100%}
  .tiles .iemo{font-size:34px;width:auto;line-height:1.1;margin-top:4px}
  .tiles .ithumb{width:52px;height:52px;border-radius:13px;margin-top:2px}
  .tiles .ititle{flex:none;font-size:14.5px;font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
  .tiles .qty{margin:0;font-size:11.5px;padding:2px 8px;max-width:100%}
  .tiles .note{font-size:11.5px;line-height:1.25;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;padding:0}
  .tiles .iemo.letter{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:21px;font-weight:700;margin-top:2px;
    color:hsl(var(--h) 45% 35%);background:hsl(var(--h) 55% 92%)}
  html[data-theme="dark"] .tiles .iemo.letter{color:hsl(var(--h) 55% 78%);background:hsl(var(--h) 25% 24%)}
  .tiles .note{max-width:100%}
  .tiles .note .shortlink{display:inline;padding:0;background:none;font-size:inherit;white-space:nowrap}
  .tiles .tav{display:flex;justify-content:center;margin-top:auto}
  .tiles .check{position:absolute;top:7px;left:7px;width:23px;height:23px;z-index:2;background-color:var(--card)}
  .tiles .check.on{background-color:var(--lc)}
  .tiles .check svg{width:13px;height:13px}
  .tiles .drag{position:absolute;top:5px;right:4px;z-index:2;opacity:.35;padding:4px}
  .tiles .drag svg{width:15px;height:15px}
  .tiles .pickbox{position:absolute;top:7px;left:7px;width:23px;height:23px;z-index:2;background:var(--card)}
  .tiles .picked .pickbox,.tiles .irow.picked .pickbox{background:var(--lc)}
  .tiles .irow.picked{box-shadow:0 0 0 2.5px var(--lc)}
  .tiles .irow.done{background-color:color-mix(in srgb, var(--card) 60%, transparent);box-shadow:none}
  .tiles .irow.done .itext{min-height:96px;padding-top:12px}
  .tiles .irow.done .iemo{font-size:26px}
  .tiles .irow.assigned{background-image:var(--pg);background-size:100% 4px;background-position:bottom;background-repeat:no-repeat}
  .grp.mini .tiles{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
  .grp.mini .tiles .itext{min-height:84px;padding:12px 5px 8px}
  .grp.mini .tiles .ititle{font-size:12.5px}
  .grp.mini .tiles .note,.grp.mini .tiles .qty{display:none}
  .tiles .drag-ghost{opacity:.35}

  .selbar{position:fixed;left:0;right:0;bottom:0;z-index:9;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
          background:color-mix(in srgb, var(--card) 94%, transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
          border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(31,27,22,.08);animation:up .2s ease}
  .selcount{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14.5px;margin:0 4px 8px}
  .selacts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .selact{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;border-radius:14px;padding:8px 4px;font-size:13px;font-weight:600;
          background:color-mix(in srgb, var(--ink) 6%, transparent);transition:transform .12s, opacity .2s}
  .selact span{font-size:20px}
  .selact:disabled{opacity:.4}
  .selact:active{transform:scale(.95)}
  .selact.danger-t{color:#C0392B}
  .selact.sure{background:#C0392B;color:#fff}

  /* Barre d'onglets */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;justify-content:center;gap:4px;
          padding:6px 10px calc(6px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
          background:color-mix(in srgb, var(--bg) 88%, transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
  .tab{flex:1;max-width:180px;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--muted);
       font-size:11.5px;font-weight:600;padding:6px 0 4px;border-radius:12px;transition:color .2s, transform .12s}
  .tab svg{width:24px;height:24px}
  .tab.on{color:var(--accent)}
  .tab:active{transform:scale(.92)}

  /* Calendrier */
  .calcard{padding:12px 10px 10px}
  .calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .calnav{width:40px;height:40px;border:0;background:none;color:var(--accent);display:grid;place-items:center;border-radius:12px}
  .calnav svg{width:22px;height:22px}
  .calnav.next svg{transform:rotate(180deg)}
  .calnav:active{background:color-mix(in srgb, var(--accent) 10%, transparent)}
  .calmonth{border:0;background:none;font-family:Fraunces,Georgia,serif;font-weight:600;font-size:20px;color:var(--ink)}
  .calweek,.calgrid{display:grid;grid-template-columns:repeat(7,1fr)}
  .calweek span{text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding:4px 0 6px}
  .calgrid{gap:2px}
  .calgrid.slide-l{animation:viewIn .28s cubic-bezier(.2,.8,.3,1)}
  .calgrid.slide-r{animation:viewBack .28s cubic-bezier(.2,.8,.3,1)}
  .cday{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 6px;border-radius:12px;color:var(--ink);min-height:48px}
  .cday .num{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;font-size:15px;font-weight:500;transition:background .15s,color .15s}
  .cday.other{color:color-mix(in srgb, var(--muted) 60%, transparent)}
  .cday.today .num{color:var(--accent);font-weight:700;box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--accent) 45%, transparent)}
  .cday.sel .num{background:var(--accent);color:#fff;box-shadow:none}
  .cday:active .num{transform:scale(.9)}
  .dots{display:flex;gap:3px;height:6px}
  .dots i{width:6px;height:6px;border-radius:50%;background:hsl(var(--h) 55% 50%)}
  .dayhead{display:flex;align-items:baseline;justify-content:space-between;margin:24px 4px 10px}
  .dayhead h2{margin:0;font-size:18px}
  .evlist{display:flex;flex-direction:column;gap:8px}
  .ev{display:flex;align-items:stretch;gap:12px;width:100%;text-align:left;border:0;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);transition:transform .12s}
  .ev:active{transform:scale(.98)}
  .evtime{flex:none;width:54px;display:flex;flex-direction:column;justify-content:center;font-size:14px;font-weight:600;color:var(--ink)}
  .evtime small{font-size:12px;font-weight:500;color:var(--muted)}
  .evtime b{font-size:20px;line-height:1}
  .evbar{flex:none;width:4px;border-radius:4px;background:hsl(var(--h) 55% 50%)}
  .evtitle{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px}
  .evemo{font-size:19px}
  .evmeta{display:block;font-size:13.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .addev{margin-top:12px}
  .switch{display:flex;align-items:center;gap:12px;margin-top:16px;font-size:16px;cursor:pointer;-webkit-user-select:none;user-select:none}
  .switch input{position:absolute;opacity:0;pointer-events:none}
  .switch .sw{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .2s;flex:none}
  .switch .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
  .switch input:checked + .sw{background:var(--accent)}
  .switch input:checked + .sw::after{transform:translateX(18px)}
  .times{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  input[type="date"].field,input[type="time"].field{-webkit-appearance:none;appearance:none;min-height:50px}

  /* Notes */
  .wallform{padding:12px}
  .wallform textarea{border:0;background:transparent;padding:6px 4px;resize:none;min-height:52px}
  .wallform textarea:focus{border:0}
  .wallbar{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
  .photo-btn{cursor:pointer}
  .wallprev{position:relative;margin:6px 4px 8px;display:inline-block}
  .wallprev img{max-width:100%;max-height:220px;border-radius:14px;display:block}
  .prevx{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
  .prevx svg{width:16px;height:16px}
  .wall{margin-top:20px}
  .posts{display:flex;flex-direction:column;gap:12px}
  .post{padding:14px}
  .post.enter{animation:rise .4s cubic-bezier(.2,.8,.3,1)}
  .phead{display:flex;align-items:center;gap:10px}
  .pname{font-weight:600;font-size:15px}
  .ptime{font-size:12.5px;color:var(--muted)}
  .pin{font-size:16px}
  .pmore{color:var(--muted);padding:6px;margin:-6px -6px -6px 0}
  .pmore svg{width:20px;height:20px}
  .ptext{margin-top:10px;font-size:16px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
  .ptext a{color:var(--accent)}
  .pphoto{display:block;width:100%;border:0;padding:0;background:none;margin-top:10px}
  .pphoto img{display:block;width:100%;height:auto;max-height:70vh;object-fit:cover;border-radius:14px;background:var(--line)}
  .lightbox{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .lightbox img{max-width:100%;max-height:100%;object-fit:contain;animation:rise .25s ease}
  .lbx{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;float:none;margin:0;background:rgba(255,255,255,.18);color:#fff}

  /* Connexion, code, administration */
  .pw{position:relative}
  .pw .field{padding-right:52px}
  .pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;color:var(--muted);
          display:grid;place-items:center;border-radius:10px}
  .pw-eye svg{width:21px;height:21px}
  .pw-eye:active{background:color-mix(in srgb, var(--ink) 7%, transparent)}
  .authswitch{text-align:center;margin-top:18px;color:var(--muted);font-size:15px}
  .authswitch .link{font-size:15px}
  .codefield{text-align:center;font-size:24px;font-weight:600;letter-spacing:.35em;text-transform:uppercase;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .bigcode{text-align:center;font-size:38px;font-weight:700;letter-spacing:.3em;padding:18px 10px 18px 22px;border-radius:18px;
           background:color-mix(in srgb, var(--accent) 10%, var(--bg));color:var(--accent);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;user-select:all;-webkit-user-select:all}
  .ulist{display:flex;flex-direction:column;gap:12px;margin-top:18px}
  .ucard{padding:16px}
  .ucard.isblocked{opacity:.75}
  .urow{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .umeta{font-size:14px;margin-top:4px}
  .adminbadge{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);background:color-mix(in srgb, var(--accent) 13%, transparent);border-radius:999px;padding:2px 8px;vertical-align:2px;letter-spacing:.02em}
  .badge{display:inline-block;font-size:12px;font-weight:600;color:#fff;background:#C0392B;border-radius:999px;padding:2px 8px;vertical-align:2px}
  .ucard .btn.sure{background:#C0392B;color:#fff}
  .deluser{color:#C0392B}
  .toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);
         padding:11px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:calc(100% - 40px);text-align:center}
</style>
</head>

function newCode() {
  const abc = 'abcdefghjkmnpqrstuvwxyz23456789';

}

function newJoinCode() {
  const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

}

function ago(ts) {
  if (!ts) return '';
  const s = (Date.now() - ts) / 1000;
  if (s < 15 * 60) return 'actif récemment';
  if (s < 3600) return `vu il y a ${Math.round(s / 60)} min`;
  if (s < 86400) return `vu il y a ${Math.round(s / 3600)} h`;
  if (s < 172800) return 'vu hier';
  return 'vu le ' + new Date(ts).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
}

// Récupère automatiquement les maisons créées avec l'ancienne version (sans comptes) sur cet appareil.
async function migrateLegacy() {
  if (store.get('maison.migrated')) return;
  const codes = new Set();
  try { JSON.parse(store.get('maison.houses') || '[]').forEach(h => h && typeof h.code === 'string' && codes.add(h.code)); } catch (_) {}
  const lc = store.get('maison.code'); if (lc) codes.add(lc);
  const oldMe = store.get('maison.me');
  if (oldMe) {
    try { const s = await getDoc(doc(db, 'people', oldMe)); if (s.exists()) (s.data().houses || []).forEach(h => h && h.code && codes.add(h.code)); } catch (_) {}
  }
  let got = 0;
  for (const id of codes) {
    if (houses.some(h => h.code === id)) continue;
    try {
      const jc = newJoinCode();
      const b = writeBatch(db);
      b.update(doc(db, 'households', id), { members: [meId], banned: [], code: jc, createdBy: meId });
      b.set(doc(db, 'joinCodes', jc), { houseId: id });
      await b.commit();
      const s = await getDoc(doc(db, 'households', id));
      rememberHouse(id, s.data()?.name || '');
      got++;
    } catch (e) { console.warn('ancienne maison non récupérée', id, e && e.code); }
  }
  store.set('maison.migrated', '1');
  if (got) toast(got > 1 ? `${got} anciennes maisons récupérées.` : 'Ton ancienne maison a été récupérée.');
}

function closeHouse() {

  state.code = null; state.house = null; state.members = [];

  if (state.view !== 'admin') state.view = 'home';

function subscribe() {
  unsubs.forEach(u => u()); unsubs = [];
  state.loading = true; state.error = null;
  const have = {};
  const kinds = ['lists', 'sections', 'items'];
  const code = state.code;
  const got = k => { have[k] = true; if (kinds.every(x => have[x])) state.loading = false; render(); };
  const lost = async () => {
    // On n'a plus accès à cette maison : retiré par un membre… ou compte bloqué.
    if (state.code !== code) return;
    try {
      const p = await getDoc(userRef());
      if (p.data()?.blocked) { state.blocked = true; closeHouse(); render(); return; }
    } catch (_) {}
    if (state.code !== code) return;
    const name = houses.find(h => h.code === code)?.name || 'la maison';
    houses = houses.filter(h => h.code !== code);
    if (fav === code) fav = houses[0]?.code || null;
    saveHouses();
    closeHouse();
    toast(`Tu ne fais plus partie de « ${name} ».`);
    if (houses.length) enterHouse(fav || houses[0].code); else render();
  };
  const err = e => {
    console.error(e);
    if (e && e.code === 'permission-denied') return lost();
    state.loading = false; state.error = 'Impossible de charger les listes pour le moment.'; render();
  };

  unsubs.push(onSnapshot(houseRef(), snap => {
    if (!snap.exists()) { if (!snap.metadata.fromCache) lost(); return; }
    state.house = snap.data();
    if (Array.isArray(state.house.members) && !state.house.members.includes(meId) && !snap.metadata.hasPendingWrites) return lost();
    if (typeof state.house.name === 'string') rememberHouse(code, state.house.name);
    if (!Array.isArray(state.house.admins) && houseAdmins()[0] === meId && !snap.metadata.fromCache) fire(updateDoc(houseRef(), { admins: [meId] }));
    render();
    if (sheetKind === 'members') openMembersSheet();
    if (sheetKind === 'manage' && !amAdmin()) closeSheet();
    if (sheetKind === 'invite') openInviteSheet();
  }, err));

  unsubs.push(onSnapshot(col('members'), snap => {
    state.members = snap.docs.map(d => {
      const v = d.data();
      const devs = v.devices && typeof v.devices === 'object' ? Object.entries(v.devices) : [];
      return {
        id: d.id, name: str(v.name, "Quelqu'un"), removed: v.removed === true, hue: typeof v.hue === 'number' ? v.hue : null,
        devices: devs.map(([k, x]) => ({ id: k, label: str(x && x.label, 'Appareil'), lastSeen: Number(x && x.lastSeen) || 0 }))
                     .sort((a, b) => b.lastSeen - a.lastSeen)
      };
    });
    render();
    if (sheetKind === 'members') openMembersSheet();
  }, e => { if (e && e.code === 'permission-denied') return; console.error('membres', e); }));

  unsubs.push(onSnapshot(query(col('lists'), orderBy('createdAt')), snap => {
    state.lists = snap.docs.map(d => { const v = d.data(); return { id: d.id, name: str(v.name, 'Sans nom'), emoji: typeof v.emoji === 'string' ? clipIcon(v.emoji) : '', order: typeof v.order === 'number' ? v.order : (v.createdAt || 0) }; }).sort(byOrder);
    got('lists');
  }, err));
  unsubs.push(onSnapshot(query(col('sections'), orderBy('createdAt')), snap => {
    state.sections = snap.docs.map(d => { const v = d.data(); return { id: d.id, listId: v.listId, name: str(v.name, 'Sans nom'), emoji: typeof v.emoji === 'string' ? clipIcon(v.emoji) : '', order: typeof v.order === 'number' ? v.order : (v.createdAt || 0) }; });
    if (sheetKind === 'sec') openSecView(sheetTarget);
    got('sections');
  }, err));
  // Calendrier et notes : si les règles Firebase ne sont pas à jour, on prévient sans casser le reste.
  let warned = false;
  const soft = what => e => {
    console.error(what, e);
    if (e && e.code === 'permission-denied' && !warned) { warned = true; toast(`${what} : mets à jour les règles Firebase.`); }
  };
  // Seulement les 2 derniers mois et le futur (les plus vieux sont supprimés)
  setTimeout(purgeOldEvents, 4000);
  unsubs.push(onSnapshot(query(col('events'), where('date', '>=', evCutoff())), snap => {
    state.events = snap.docs.map(evFromDoc).filter(e => e.date);
    if (state.tab === 'cal' || (state.tab === 'lists' && state.view !== 'list')) render();
  }, soft('Calendrier')));
  const seenPosts = new Set(); let postsPrimed = false;
  unsubs.push(onSnapshot(query(col('posts'), orderBy('createdAt', 'desc'), limit(80)), snap => {
    const fresh = new Set();
    for (const d of snap.docs) { if (postsPrimed && !seenPosts.has(d.id)) fresh.add(d.id); seenPosts.add(d.id); }
    postsPrimed = true; state.freshPosts = fresh;
    state.posts = snap.docs.map(d => {
      const v = d.data();
      return { id: d.id, text: typeof v.text === 'string' ? v.text : '', photo: typeof v.photo === 'string' && v.photo.startsWith('data:image/') ? v.photo : null,
               w: Number(v.w) || 0, h: Number(v.h) || 0, by: typeof v.by === 'string' ? v.by : null, byName: typeof v.byName === 'string' ? v.byName : '',
               createdAt: Number(v.createdAt) || 0, pinned: v.pinned === true,
               mentions: Array.isArray(v.mentions) ? v.mentions.filter(x => typeof x === 'string') : [],
               photoId: typeof v.photoId === 'string' ? v.photoId : null, editedAt: Number(v.editedAt) || 0, reactions: cleanReactions(v.reactions) };
    });
    if (state.tab === 'notes' || (state.tab === 'lists' && state.view !== 'list')) render();
    else renderTabbar(true);
    if (sheetKind === 'post' && !state.posts.some(p => p.id === sheetTarget)) closeSheet();
  }, soft('Notes')));

  unsubs.push(onSnapshot(query(col('replies'), orderBy('createdAt', 'desc'), limit(300)), snap => {
    state.replies = snap.docs.map(d => { const v = d.data(); return { id: d.id, postId: v.postId, text: String(v.text || ''),

      photoId: typeof v.photoId === 'string' ? v.photoId : null, w: Number(v.w) || 0, h: Number(v.h) || 0, reactions: cleanReactions(v.reactions) }; }).sort((x, y) => x.createdAt - y.createdAt);
    if (state.tab === 'notes' || (state.tab === 'lists' && state.view !== 'list')) render(); else renderTabbar(true);
    if (sheetKind === 'thread') openThread(sheetTarget);
  }, soft('Réponses')));

  unsubs.push(onSnapshot(query(col('items'), orderBy('createdAt')), snap => {
    const fresh = new Set();
    for (const d of snap.docs) { if (itemsPrimed && !seenItems.has(d.id)) fresh.add(d.id); seenItems.add(d.id); }
    itemsPrimed = true; state.fresh = fresh;
    state.items = snap.docs.map(d => {

               title: String(v.title ?? ''), done: v.done === true, byName: typeof v.byName === 'string' ? v.byName : '',
               by: typeof v.by === 'string' ? v.by : null,
               emoji: typeof v.emoji === 'string' && v.emoji ? v.emoji : null,
               qty: typeof v.qty === 'string' ? v.qty.trim() : '',
               note: typeof v.note === 'string' ? v.note.trim() : '',
               order: typeof v.order === 'number' ? v.order : (v.createdAt || 0),
               assignees: Array.isArray(v.assignees) ? v.assignees.filter(x => typeof x === 'string') : [],
               assignedAt: Number(v.assignedAt) || 0, assignedBy: typeof v.assignedBy === 'string' ? v.assignedBy : '',
               photoId: typeof v.photoId === 'string' ? v.photoId : null, important: v.important === true,
               link: typeof v.link === 'string' ? v.link.trim() : '', thumb: typeof v.thumb === 'string' ? v.thumb : '' };
    }).sort(byOrder);
    got('items');
    if (state.tab !== 'lists') renderTabbar(true);
    if (sheetKind === 'sec') openSecView(sheetTarget);
  }, err));
}

function enterHouse(code) {
  state.code = code;
  if (state.view !== 'admin') state.view = 'home';
  state.house = null; state.members = []; state.lists = []; state.sections = []; state.items = [];
  state.events = []; state.posts = []; state.replies = []; state.newMentions = new Set(); pendingTags.clear();
  seenItems.clear(); itemsPrimed = false; state.anim = 'first';
  subscribe();
  touchMember(true);
  render();
}

function createHouse(name) {
  name = String(name || '').trim().slice(0, 40) || 'Ma maison';
  const id = newCode(), jc = newJoinCode();
  const b = writeBatch(db);
  b.set(doc(db, 'households', id), { name, createdAt: Date.now(), createdBy: meId, members: [meId], admins: [meId], banned: [], code: jc });
  b.set(doc(db, 'joinCodes', jc), { houseId: id });
  // une fois la maison créée : listes de départ + événement de bienvenue
  fire(b.commit().then(() => seedHouse(id, name)));
  houses.push({ code: id, name });
  fav = fav || id;
  saveHouses();
  enterHouse(id);
  setTimeout(openInviteSheet, 450);
}

function seedHouse(id, name) {
  const t = Date.now(), c = sub => collection(db, 'households', id, sub);
  const lists = [
    { name: 'Courses', emoji: '🛒' },
    { name: 'Idées repas', emoji: '🍝' },
    { name: 'Achats', emoji: '🛍️' },
    { name: 'Travaux', emoji: '🔨' }
  ];
  const b = writeBatch(db);
  const refs = lists.map((l, i) => { const r = doc(c('lists')); b.set(r, { ...l, createdAt: t + i, order: t + i }); return r; });
  b.set(doc(c('events')), { title: `Bienvenue dans « ${String(name).slice(0, 50)} »`, emoji: '🎉', date: todayYmd(), allDay: true, time: '', end: '',
    note: `${state.myName || 'Quelqu\'un'} a créé la maison aujourd'hui.`, people: [meId], by: meId, byName: state.myName, createdAt: t });
  // la liste Courses en favori pour le créateur
  b.update(userRef(), { [`homePrefs.${id}.fav`]: [refs[0].id] });
  if (state.profile) { state.profile.homePrefs = state.profile.homePrefs || {}; state.profile.homePrefs[id] = { fav: [refs[0].id], collapsed: [] }; }
  return b.commit();
}

async function joinWithCode(raw) {
  const code = cleanCode(raw);
  if (code.length !== 6) { toast('Le code fait 6 caractères (lettres et chiffres).'); return false; }
  let s;
  try { s = await getDoc(doc(db, 'joinCodes', code)); }
  catch (e) { console.error(e); toast('Impossible de vérifier le code pour le moment.'); return false; }
  if (!s.exists()) { toast('Ce code ne correspond à aucune maison.'); return false; }
  const id = s.data().houseId;
  try { await updateDoc(doc(db, 'households', id), { members: arrayUnion(meId), joinWith: code }); }
  catch (e) {
    console.error(e);
    toast(e && e.code === 'permission-denied' ? "Tu ne peux pas rejoindre cette maison (code changé ou accès retiré)." : "Ça n'a pas marché, réessaie.");
    return false;
  }
  let name = '';
  try { name = (await getDoc(doc(db, 'households', id))).data()?.name || ''; } catch (_) {}
  if (!houses.some(h => h.code === id)) houses.push({ code: id, name });
  if (!fav) fav = id;
  saveHouses();
  closeSheet();
  enterHouse(id);
  toast(`Bienvenue dans « ${name || 'la maison'} » !`);
  return true;
}

// Quitter une maison : tu n'en fais plus partie (les listes restent pour les autres).
// ----- Administrateurs de la maison : le créateur au départ, il peut nommer d'autres personnes -----
function houseAdmins(h = state.house) {
  if (!h) return [];
  if (Array.isArray(h.admins)) return h.admins;
  return h.createdBy ? [h.createdBy] : (Array.isArray(h.members) && h.members[0] ? [h.members[0]] : []);
}
const amAdmin = () => !!meId && houseAdmins().includes(meId);

function setAdmin(uid, on) {
  const cur = houseAdmins();
  if (!on && cur.length <= 1 && cur.includes(uid)) { toast('Il faut au moins un administrateur.'); return; }
  const next = on ? [...new Set([...cur, uid])] : cur.filter(x => x !== uid);
  fire(updateDoc(houseRef(), { admins: next }));
  toast(on ? `${memberName(uid)} est administrateur.` : `${memberName(uid)} n'est plus administrateur.`);
}

// Retirer quelqu'un : il perd l'accès, mais peut revenir avec le code (sauf si on change le code)
function removeMember(uid) {
  const b = writeBatch(db);
  b.update(houseRef(), { members: arrayRemove(uid), admins: houseAdmins().filter(x => x !== uid) });
  b.delete(ref('members', uid));
  fire(b.commit());
  toast(`${memberName(uid)} a été retiré de la maison.`);
}

function forgetHouseLocally(id) {
  houses = houses.filter(h => h.code !== id);
  if (fav === id) fav = houses[0]?.code || null;
  saveHouses();
  closeSheet();
  closeHouse();
  if (houses.length) enterHouse(fav || houses[0].code); else render();
}

// Quitter : un admin seul doit d'abord passer la main ; s'il n'y a plus personne, la maison est supprimée
function startLeave() {
  const others = (state.house?.members || []).filter(x => x !== meId);
  const lastAdmin = amAdmin() && houseAdmins().filter(x => x !== meId).length === 0;
  if (!lastAdmin) return leaveHouse();
  if (others.length) return openTransferSheet(others);
  openSheet(`<h3>Supprimer la maison ?</h3>
    <p class="hint">Tu es la dernière personne dans <b>${esc(state.house?.name || 'cette maison')}</b>. En partant, la maison et tout son contenu (listes, calendrier, notes, photos) seront <b>supprimés définitivement</b>.</p>
    <div class="actions"><button type="button" class="btn ghost" data-close>Annuler</button>
      <button type="button" class="btn danger" data-delete-house>Supprimer et quitter</button></div>`);
  sheetKind = 'leaveDelete';
}
let transferTo = null;
function openTransferSheet(others) {
  transferTo = null;
  const ms = others.map(id => ({ id, name: memberName(id) }));
  openSheet(`<h3>Avant de partir</h3>
    <p class="hint" style="margin-bottom:12px">Tu es l'administrateur de la maison. Choisis qui reprend les droits :</p>
    <div class="card">${ms.map(m => `<button type="button" class="tagrow" data-transfer="${esc(m.id)}">
        <span class="avatar" style="--h:${pHue(m.id)}">${esc(initial(m.name))}</span><span class="grow">${esc(m.name)}</span><span class="tagck">${ICON.check}</span></button>`).join('')}</div>
    <div class="actions"><button type="button" class="btn ghost" data-close>Annuler</button>
      <button type="button" class="btn danger" data-transfer-go disabled>Transférer et quitter</button></div>`);
  sheetKind = 'transfer';
}
function leaveHouse(newAdmin) {
  const id = state.code;
  if (!id) return;
  const b = writeBatch(db);
  b.delete(ref('members', meId));
  const upd = { members: arrayRemove(meId) };
  if (newAdmin) upd.admins = [newAdmin];
  else if (amAdmin()) upd.admins = houseAdmins().filter(x => x !== meId);
  b.update(houseRef(), upd);
  fire(b.commit());
  forgetHouseLocally(id);
}
async function deleteHouse() {
  const id = state.code, jc = state.house?.code;
  if (!id) return;
  closeSheet();
  toast('Suppression de la maison…');
  try {
    for (const c of ['items', 'sections', 'lists', 'events', 'replies', 'posts', 'media', 'members']) {
      const sn = await getDocs(collection(db, 'households', id, c));
      for (let i = 0; i < sn.docs.length; i += 400) {
        const b = writeBatch(db);
        sn.docs.slice(i, i + 400).forEach(d => b.delete(doc(db, 'households', id, c, d.id)));
        await b.commit();
      }
    }
    if (jc) await deleteDoc(doc(db, 'joinCodes', jc)).catch(() => {});
    await deleteDoc(doc(db, 'households', id));
    toast('Maison supprimée.');
  } catch (e) { console.error(e); toast("La suppression n'a pas pu aller jusqu'au bout."); }
  forgetHouseLocally(id);
}

// Réautoriser : la personne pourra revenir avec le code de la maison.
// Supprimer définitivement une personne retirée : elle disparaît et pourra revenir avec le code.
function purgeMember(uid) {
  const b = writeBatch(db);
  b.update(houseRef(), { banned: arrayRemove(uid) });
  b.delete(ref('members', uid));
  fire(b.commit());
}

function changeJoinCode() {
  const old = state.house?.code, jc = newJoinCode();
  const b = writeBatch(db);
  b.set(doc(db, 'joinCodes', jc), { houseId: state.code });
  b.update(houseRef(), { code: jc });
  if (old) b.delete(doc(db, 'joinCodes', old));
  fire(b.commit());
}

screen.addEventListener('submit', async e => {
  e.preventDefault();
  if (e.target.id === 'wallForm') return publishPost();
  const f = e.target, v = n => (f.querySelector(`[name="${n}"]`)?.value || '').trim();
  const need = n => { const el = f.querySelector(`[name="${n}"]`); if (!el.value.trim()) { el.classList.add('err'); el.focus(); return true; } return false; };
  const btn = f.querySelector('button[type="submit"]');
  const busy = on => { if (btn) { btn.disabled = on; btn.style.opacity = on ? .6 : ''; } };

  if (f.dataset.form === 'signup') {
    if (need('pseudo') || need('email') || need('password') || need('password2')) return;
    const pw1 = f.querySelector('[name="password"]').value, pw2 = f.querySelector('[name="password2"]');
    if (pw1 !== pw2.value) { pw2.classList.add('err'); pw2.focus(); toast('Les deux mots de passe ne sont pas identiques.'); return; }
    busy(true); creatingProfile = true;
    try {
      const cred = await createUserWithEmailAndPassword(auth, v('email'), f.querySelector('[name="password"]').value);
      await setDoc(userRef(cred.user.uid), newProfile(cred.user, v('pseudo')));
      updateProfile(cred.user, { displayName: v('pseudo').slice(0, 30) }).catch(() => {});
    } catch (err) { toast(authError(err)); busy(false); }
    creatingProfile = false;
  } else if (f.dataset.form === 'login') {
    if (need('email') || need('password')) return;
    busy(true);
    try { await signInWithEmailAndPassword(auth, v('email'), f.querySelector('[name="password"]').value); }
    catch (err) { toast(authError(err)); busy(false); }
  } else if (f.dataset.form === 'reset') {
    if (need('email')) return;
    busy(true);
    try { await sendPasswordResetEmail(auth, v('email')); toast('E-mail envoyé ! Regarde ta boîte de réception (et les spams).'); state.authMode = 'login'; render(); }
    catch (err) { toast(authError(err)); busy(false); }
  } else if (f.dataset.form === 'create') {
    if (need('house')) return;
    createHouse(v('house'));
  } else if (f.dataset.form === 'join') {
    if (need('code')) return;
    busy(true);
    if (!(await joinWithCode(v('code')))) busy(false);
  }
});

// Supprimer un compte (admin) : son profil est effacé et il est retiré de toutes ses maisons.
// S'il se reconnecte avec son e-mail, il repart de zéro (pour l'empêcher de revenir, bloque-le plutôt).
async function adminDeleteUser(uid) {
  let u = (state.users || []).find(x => x.id === uid);
  if (!u) { try { const sn = await getDoc(userRef(uid)); u = sn.exists() ? sn.data() : null; } catch (_) {} }
  if (!u) u = { pseudo: memberName(uid), houses: state.code ? [{ code: state.code }] : [] };
  if (state.code && !(u.houses || []).some(h => h && h.code === state.code) && (state.house?.members || []).includes(uid)) u.houses = [...(u.houses || []), { code: state.code }];
  const hs = Array.isArray(u?.houses) ? u.houses.map(h => h && h.code).filter(Boolean) : [];
  hs.forEach(h => {
    updateDoc(doc(db, 'households', h), { members: arrayRemove(uid), banned: arrayRemove(uid) }).catch(e => console.warn(e));
    deleteDoc(doc(db, 'households', h, 'members', uid)).catch(e => console.warn(e));
  });
  fire(deleteDoc(userRef(uid)));
  toast(`Compte de ${u?.pseudo || 'cette personne'} supprimé.`);
}

body.addEventListener('click', e => {
  const du = e.target.closest('[data-deluser]');
  if (du) {
    if (!du.classList.contains('sure')) { du.classList.add('sure'); du.textContent = 'Confirmer : supprimer ce compte'; return; }
    adminDeleteUser(du.dataset.deluser);
    return;
  }
  const b = e.target.closest('[data-block]');
  if (!b) return;
  const unblock = b.dataset.state === '1';
  if (!unblock && !b.classList.contains('sure')) { b.classList.add('sure'); b.textContent = 'Confirmer le blocage'; return; }
  fire(updateDoc(userRef(b.dataset.block), { blocked: !unblock }));
  toast(unblock ? 'Compte débloqué.' : 'Compte bloqué.');
});
screen.addEventListener('input', e => {

function filterHomeLists() {
  const q = norm(state.listQuery);
  let shown = 0;
  screen.querySelectorAll('.lcard[data-list-id]').forEach(c => {
    const ok = !q || c.dataset.name.includes(q);
    c.hidden = !ok; if (ok) shown++;
  });
  screen.querySelectorAll('section.lcol').forEach(sec => {
    const any = sec.querySelector('.lcard[data-list-id]:not([hidden])');
    const head = sec.previousElementSibling;
    if (head?.classList.contains('lc-sec')) head.hidden = !!q && !any;
    sec.classList.toggle('searching', !!q);
  });
  screen.querySelectorAll('.lcard.add, .lc-hint').forEach(el => el.hidden = !!q);
  const none = screen.querySelector('.lc-none'); if (none) none.hidden = !q || shown > 0;
}

function renderList(l) {
  const its = state.items.filter(i => i.listId === l.id);
  const todo = its.filter(i => !i.done), done = its.filter(i => i.done);
  const secs = sectionsOf(l.id), secIds = new Set(secs.map(s => s.id));
  let h = `<nav class="catbar">${secs.map(s => {
      const n = todo.filter(i => i.sectionId === s.id).length;
      return `<button type="button" class="catchip" data-action="openSec" data-id="${esc(s.id)}"><span class="e">${esc(s.emoji)}</span>${esc(s.name)}${n ? `<span class="n">${n}</span>` : ''}</button>`;
    }).join('')}<button type="button" class="catchip add" data-action="newSec">＋ Catégorie</button></nav>`;

  if (!todo.length) {
    h += `<section class="sec"><div class="card"><div class="pad muted">${
      done.length ? 'Plus rien à faire ici.' : 'Ajoute un premier élément juste au-dessus.'}</div></div></section>`;
  } else {
    const groups = secs.map(s => ({ s, items: todo.filter(i => i.sectionId === s.id) })).filter(g => g.items.length);
    const loose = todo.filter(i => !secIds.has(i.sectionId));
    if (!groups.length) h += `<section class="sec"><div class="card tiles" data-drop="">${loose.map(itemRow).join('')}</div></section>`;
    else {
      h += `<div id="groups">${groups.map(g => group(g.s, g.items)).join('')}</div>`;
      if (loose.length) h += group(null, loose);
    }
  }
  if (done.length) {
    // Cochés, rangés par catégorie : on retrouve vite l'élément à remettre dans la liste.
    const dg = secs.map(s => ({ s, items: done.filter(i => i.sectionId === s.id) })).filter(g => g.items.length);
    const dl = done.filter(i => !secIds.has(i.sectionId));
    h += `<div class="done-zone"><div class="grp-h soft done-h">Cochés<span class="n">${done.length}</span>
        <button class="link act" data-action="clearDone">Tout effacer</button></div>
      ${dg.length ? dg.map(g => group(g.s, g.items, { mini: true })).join('') + (dl.length ? group(null, dl, { mini: true }) : '')
                  : `<div class="card tiles">${dl.map(itemRow).join('')}</div>`}
    </div>`;
  }
  return h;
}
